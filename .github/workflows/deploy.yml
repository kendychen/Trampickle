name: deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/build.mjs
      - name: List dist
        run: ls -R dist | head -n 100
      # Deploy via SSH if secrets present
      - name: Deploy to VPS
        if: secrets.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*,docker-compose.yml,nginx.conf,Dockerfile"
          target: /opt/trampickle
          strip_components: 0
      - name: Restart on VPS
        if: secrets.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/trampickle
            docker compose up -d --build
            docker ps | grep trampickle
            curl -I https://trampickle.vn/sitemap.xml | head