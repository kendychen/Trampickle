{{define "dangnhap.html"}}
{{template "html-dau" .}}

<section class="hero">
  <div class="khung" style="max-width:440px">
    <div class="nhan-nho">{{nd "dangnhap.nhan"}}</div>
    <h1 style="margin:16px 0 24px;font-size:34px">{{nd "dangnhap.h1"}}</h1>

    {{if .Loi}}<div class="bao bao-loi">{{.Loi}}</div>{{end}}

    <form method="post" action="/dang-nhap" class="the">
      <input type="hidden" name="_csrf" value="{{$.CSRF}}">
      <label>{{nd "dangnhap.ten"}}<input name="ten" value="{{.Ten}}" autocomplete="username" autofocus required></label>
      <label style="margin-bottom:18px">{{nd "dangnhap.mat-khau"}}<input name="mat_khau" type="password" autocomplete="current-password" required></label>
      {{if .Hoi2FA}}
      <label style="margin-bottom:18px">Mã xác thực
        <span class="hd">6 số trong ứng dụng xác thực, hoặc một mã dự phòng.</span>
        <input name="ma_totp" inputmode="numeric" autocomplete="one-time-code" autofocus required>
      </label>
      {{end}}
      <button type="submit" style="width:100%">{{nd "dangnhap.nut"}}</button>
    </form>

    <p class="nho mo" style="margin-top:20px">{{ndd "dangnhap.chu"}}</p>
  </div>
</section>

{{template "html-chan" .}}
{{end}}
