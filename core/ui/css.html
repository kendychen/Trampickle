/* Bộ thứ sáu, không có mẫu để đo — Kendy đặt sáu mà chỉ có năm đường dẫn.
   Hướng: nhà trạm / công trường, và nét riêng là VẠCH CẢNH BÁO chéo thay cho
   các đường kẻ mảnh của trang. Đây là bộ duy nhất có hoa văn trong đường chia
   khối, nên nhìn lướt cũng không lẫn với năm bộ kia. */
body.theme-cam { --r: 3px; --r-nho: 2px; --r-lon: 4px; }
body.theme-cam h2 { text-transform: uppercase; font-size: clamp(21px, 2.6vw, 31px); letter-spacing: -.005em; }
body.theme-cam .nut {
  border-radius: 3px; padding: 15px 30px; font-size: 14px;
  letter-spacing: .08em; text-transform: uppercase;
}
body.theme-cam .nut-nho, body.theme-cam .dau-trong nav a.nut-nho {
  border-radius: 3px; letter-spacing: .07em; text-transform: uppercase;
}
body.theme-cam .chip, body.theme-cam .dv-the .bt-o, body.theme-cam .bang-anh-khung { border-radius: 3px; }
/* Nút in hoa cần cột chữ rộng hơn — xem ghi chú ở bộ cobalt. */
@media (min-width: 980px) {
  body.theme-cam .hero-canh { grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); }
}
body.theme-cam .hero-lon > .khung, body.theme-cam .hero > .khung { border-radius: 4px; }
body.theme-cam section { padding: 68px 0; }
/* Nhãn mono dán như dán tem: chữ tối trên mảng cam. Trừ đúng loại nhãn có
   vạch dẫn — cái đó là thẻ flex chạy hết bề ngang, tô nền vào thì thành một
   thanh cam dài suốt trang. */
body.theme-cam .nhan-nho:not(.nhan-vach) {
  background: var(--sang); color: var(--tren-sang);
  display: inline-block; padding: 4px 9px; border-radius: 2px;
}
/* Vạch dẫn đổi thành vạch cảnh báo chéo. */
body.theme-cam .nhan-vach::after {
  height: 8px; opacity: .5;
  background: repeating-linear-gradient(-45deg, var(--muc) 0 6px, transparent 6px 12px);
}
body.theme-cam .hero .nhan-vach::after {
  opacity: .6;
  background: repeating-linear-gradient(-45deg, rgba(255,255,255,.62) 0 6px, transparent 6px 12px);
}
/* Mép dưới đầu trang là một dải cam dày thay cho đường kẻ 1px. */
body.theme-cam header.dau { border-bottom: 3px solid var(--sang); }
/* Mọi thẻ có gạch cam trên đỉnh — dấu nhận biết thứ hai của bộ này. */
body.theme-cam .the { border-top: 3px solid var(--sang); }
/* Khe giữa các ô trong lưới cũng là vạch cảnh báo. Làm được vì .luoi-vach
   dựng đường kẻ bằng gap 1px để lộ nền của chính nó (css.html:490) — nới gap
   lên 5px rồi đổi nền đó thành sọc chéo là xong, không đụng HTML. Viền ngoài
   dày lên 2px cho khớp với dải cam ở đầu trang. */
body.theme-cam .luoi-vach {
  gap: 5px; border-width: 2px; border-color: var(--vien-dam);
  background: repeating-linear-gradient(-45deg,
    color-mix(in srgb, var(--muc) 26%, transparent) 0 4px, transparent 4px 8px) var(--nen);
}
body.theme-cam .luoi-vach .dv-the:hover { box-shadow: inset 0 3px 0 var(--sang); }


/* ==========================================================================
   BỐ CỤC RIÊNG CỦA TỪNG BỘ
   --------------------------------------------------------------------------
   Đổi màu rồi đổi dáng vẫn chưa đủ: sáu bộ vẫn xếp mọi thứ vào cùng một chỗ —
   hero chia đôi trái phải, lưới dịch vụ ba cột, ô nào cũng biểu tượng nằm trên
   chữ. Kendy nhìn ra ngay: "giao diện bố cục vẫn thế". Khối này sửa đúng chỗ
   đó, và vẫn không đụng một dòng HTML nào.

   Ba đòn bẩy có sẵn trong markup, đủ để dựng sáu cách xếp khác hẳn nhau:

     .hero-canh   hai con XẾP DỌC: khối chữ, rồi .hero-duoi. Dồn cả hai vào
                  cùng một ô lưới (grid-area: 1/1) là cho chữ đè lên hình.
     .hero-duoi   hai con: khối hình, rồi danh sách việc. Đổi
                  grid-template-columns là đổi tỉ lệ ảnh/việc; direction: rtl
                  là đảo trái phải.
     .luoi-vach   số cột đặt trong media query, mà media query KHÔNG cộng thêm
                  điểm ưu tiên — nên một dòng body.theme-x .luoi-vach đặt ngoài
                  media là đè được cả ba mốc 1/2/3 cột.
     .dv-the      flex dọc. Chuyển sang grid hai cột rồi ghim .bt-o vào cột
                  trái trải hết chiều dọc là biểu tượng nhảy sang bên trái chữ.

   Bố cục đo được ở đâu thì ghi rõ ở đó; hai bộ không đo được cũng ghi rõ.
   ========================================================================== */

/* --- cobalt: ảnh phủ kín, chữ đè lên nửa trái ---------------------------- */
/* Đo từ chính mẫu (curl vì trang chặn trình duyệt không giao diện):
   <div class="swiper-slide" data-slide-bg="images/slide-1-1920x753.jpg"> —
   hero KHÔNG có cột hình riêng, ảnh là nền phủ kín, chữ nằm đè lên trong
   col-lg-6 offset-lg-1, tức nửa trái thụt vào một cột. Đầu trang chỉ cao 60px.
   Các hàng chữ-hình dùng flex-lg-row-reverse nên ở đây đảo lại toàn bộ. */
@media (min-width: 980px) {
  body.theme-cobalt .hero-canh { grid-template-columns: minmax(0, 1fr); align-items: center; }
  /* Cả hai con vào chung một ô: con sau nằm dưới làm nền, con trước đè lên. */
  body.theme-cobalt .hero-canh > * { grid-area: 1 / 1; }
  /* 58% cho cột chữ là mức sàn, không hạ được nữa: nút của bộ này dài và thấp
     (đệm 34px, tối thiểu 200px), hai nút cộng khe cần 594px, mà 54% chỉ cho
     559px là chúng rơi xuống hai hàng. Cột hình lấy đúng 42% còn lại — trước
     đây để 46% và chồng lấn 4%, chịu được vì cột hình lúc ấy chỉ là bản vẽ mờ
     .34 nằm làm nền. Từ khi tấm đầu trang có ẢNH THẬT phía sau thì cột hình
     phải rõ hẳn (đục 1), mà đã rõ thì không được đè lên chữ nữa. */
  body.theme-cobalt .hero-canh > *:first-child { z-index: 2; max-width: 58%; }
  /* margin:0 là bắt buộc, không phải thừa: .hero-canh .bang-anh có margin:0
     auto để căn giữa lúc hero xếp một cột. Lề auto nuốt hết khoảng trống trước
     khi justify-self kịp nói gì, nên bỏ nó đi thì băng ảnh đứng chình ình giữa
     tấm hero, đè lên đúng chữ tiêu đề. */
  body.theme-cobalt .hero-canh > *:last-child { justify-self: end; width: 42%; margin: 0; }
  body.theme-cobalt .hero-canh > *:last-child { align-self: center; }
  /* Chỉ .sv (bản vẽ dự phòng, nằm TRONG .sv-ve) mới cần kéo rộng hết ô. Băng
     ảnh .bang-anh chính là con thứ hai của .hero-canh, nên rule width:100% ở
     đây từng ghi đè mất 42% bên trên và thổi nó ra full chiều ngang — cả tấm
     đầu trang thành một mảng sữa đè lên tiêu đề. */
  body.theme-cobalt .hero-canh .sv { max-width: none; width: 100%; }
  body.theme-cobalt .hero-lon > .khung { min-height: 520px; display: grid; align-content: center; }
  /* Hàng chữ-hình đảo chiều so với mặc định, đúng như flex-lg-row-reverse. */
  body.theme-cobalt .doi-hinh { direction: rtl; }
  body.theme-cobalt .doi-hinh > * { direction: ltr; }
  body.theme-cobalt .doi-hinh.lat { direction: ltr; }
}
body.theme-cobalt .dau-trong { padding: 7px 0; }

/* --- dien: hero một cột căn giữa, hình thành băng rộng dưới chữ ---------- */
/* KHÔNG đo được: preview.themeforest.net dựng bằng script, không nhả iframe
   nào để đi tiếp. Bố cục dưới đây chọn theo thể loại chứ không sao từ mẫu.
   Ghép với băng hero tràn hết bề ngang đã có ở khối DÁNG, bộ này thành bộ duy
   nhất không chia hero làm hai cột. Lưới hai cột lớn, biểu tượng bên trái. */
@media (min-width: 980px) {
  body.theme-dien .hero-canh {
    grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; gap: 44px;
  }
  body.theme-dien .hero-canh > *:first-child { max-width: 820px; }
  body.theme-dien .hero-dv { justify-self: stretch; text-align: left; }
  body.theme-dien .hero-lon h1 { max-width: none; }
  body.theme-dien .hero-lon .dan { max-width: 58ch; margin-inline: auto; }
  body.theme-dien .hero-nut { justify-content: center; }
  /* Tran 560px la di san cua bo cuc hero mot cot: hoi do anh an tron be
     ngang, khong chan thi tam anh ra 880x660 va dau trang cao 174% man hinh.
     Gio anh nam trong cot cua .hero-duoi va da bi chan CHIEU CAO o khoi duoi,
     nen chan chieu ngang chi con lam thua mot mang trong ben phai. */
  body.theme-dien .hero-trai .bang-anh { width: 100%; }
  body.theme-dien .hero-trai .sv { max-width: 560px; width: 100%; }
  body.theme-dien .bang-anh-khung { aspect-ratio: 16 / 9; }
  body.theme-dien .luoi-vach { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
body.theme-dien .dv-the {
  display: grid; grid-template-columns: 50px minmax(0, 1fr);
  column-gap: 18px; row-gap: 7px; align-content: start;
}
body.theme-dien .dv-the .bt-o { grid-column: 1; grid-row: 1 / -1; margin-bottom: 0; }
body.theme-dien .dv-the > *:not(.bt-o) { grid-column: 2; }
/* Con của lưới mặc định kéo giãn hết ô. Nhãn là cái viên chữ ngắn, giãn ra
   thành một thanh dài suốt bề ngang thẻ thì đọc ra như thanh tiến trình. */
body.theme-dien .dv-the .chip { justify-self: start; }
body.theme-dien .dv-the .chan { margin-top: 4px; }

/* --- bien: hình bên TRÁI chữ, lưới bốn cột, đầu trang hai tầng ----------- */
/* Đo được đủ (repairpress chạy tốt trong trình duyệt không giao diện):
   hero có anhBenTrai=true, chữ bắt đầu ở x=611 tức nằm nửa phải — ngược hẳn
   với mặc định của ta. Lưới đếm được 4 ô một hàng, mỗi ô rộng 263px, biểu
   tượng nằm TRÊN chữ. Đầu trang cao 219px và có 2 tầng. */
@media (min-width: 980px) {
  body.theme-bien .hero-canh { direction: rtl; }
  body.theme-bien .hero-canh > * { direction: ltr; }
}
@media (min-width: 1000px) {
  body.theme-bien .luoi-vach { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  /* Bốn cột thì ô hẹp lại, chữ mô tả và hàng chân phải nhỏ theo. */
  body.theme-bien .dv-the { padding: 18px 16px; }
  body.theme-bien .dv-the .mota { font-size: 13px; }
  body.theme-bien .dv-the .chan { font-size: 12px; gap: 10px; }
}
/* Hai tầng: logo một hàng, thanh điều hướng hàng dưới, ngăn bằng một đường kẻ. */
body.theme-bien .dau-trong { flex-direction: column; align-items: stretch; gap: 0; padding: 16px 0 0; }
body.theme-bien .dau-trong > a:first-child { align-self: flex-start; }
body.theme-bien .dau-trong nav {
  margin-left: 0; justify-content: center; padding: 10px 0;
  margin-top: 14px; border-top: 1px solid rgba(255,255,255,.12);
}
/* Nút "Tra cứu đơn" nằm sẵn trong <nav> nên nó tự đi xuống tầng hai cùng các
   link — đúng chỗ cần, không phải kéo ra góc phải. */

/* --- kem: khung rộng 1296px, hero một cột căn trái, hình thành băng dưới -- */
/* Đo được: cột nội dung của mẫu webflow rộng 1296px chứ không phải 1140, và
   hero cao đúng một màn hình với chữ bắt đầu ở x=72 — tức chữ chạy hết bề
   ngang cột, không có hình đứng cạnh. */
/* width: calc(100% - 40px) chứ không chỉ max-width. Màn 1280px mà khung rộng
   1296px thì khung chạm hai mép: tấm hero mất bo góc, nút "Tra cứu đơn" ở đầu
   trang bị cắt cụt. Có dòng width thì máy nào hẹp hơn 1336px vẫn còn lề. */
body.theme-kem .khung { max-width: 1296px; width: calc(100% - 40px); }
@media (min-width: 980px) {
  /* Hai cột chứ không còn một: cột phải giờ có danh sách việc bấm được,
     để một cột thì nó rơi xuống dưới ảnh và khách phải kéo mới thấy —
     đúng cái phải sửa. Cột phải 360px vừa đủ cho tên việc dài nhất
     ("Tinh chỉnh cân bằng bằng lead tape") không xuống dòng. */
  /* Không chặn bề ngang cột trái: chặn 980px là chặn luôn băng ảnh, mà ảnh
     to là thứ Kendy yêu cầu. Bề ngang chữ đã có h1/dan tự chặn theo số ký
     tự — đó mới là chỗ cần chặn để còn đọc được. */
  body.theme-kem .hero-lon h1 { max-width: 20ch; }
  body.theme-kem .hero-trai .sv { max-width: 560px; width: 100%; margin: 0; }
  body.theme-kem .hero-lon > .khung { padding-block: clamp(48px, 5vw, 76px); }
}

/* --- do: khung hẹp, lưới thành DANH SÁCH một cột ------------------------- */
/* KHÔNG đo được: demo MobRepair (templatemonster 321112) chặn cả trình duyệt
   không giao diện lẫn curl. Bố cục chọn theo thể loại: bảng thợ đọc từ trên
   xuống, mỗi việc một hàng ngang, biểu tượng bên trái, thời gian và bảo hành
   dồn về mép phải. Khung hẹp lại còn 1040px cho hàng không dài quá tầm mắt. */
body.theme-do .khung { max-width: 1040px; }
/* Khung hẹp lại 100px thì cột chữ hero còn 569px, mà hai nút cộng khe là
   578px — thiếu 9px là xuống dòng thành hai hàng so le. Bớt mỗi bên 4px đệm
   ngang, đủ nằm một hàng mà nút vẫn to bản. */
body.theme-do .hero-nut .nut { padding-inline: 26px; }
body.theme-do .luoi-vach { grid-template-columns: minmax(0, 1fr); }
body.theme-do .dv-the {
  display: grid; grid-template-columns: 50px minmax(0, 1fr) auto;
  column-gap: 20px; row-gap: 5px; align-items: center; padding: 18px 22px;
}
body.theme-do .dv-the .bt-o { grid-column: 1; grid-row: 1 / -1; margin-bottom: 0; }
body.theme-do .dv-the .dau-the { grid-column: 2; }
body.theme-do .dv-the .chip { grid-column: 2; justify-self: start; }
body.theme-do .dv-the .mota { grid-column: 2; }
/* Hàng chân nhảy sang cột ba, trải hết chiều dọc để nằm giữa hàng. */
body.theme-do .dv-the .chan {
  grid-column: 3; grid-row: 1 / -1; margin-top: 0; padding-top: 0;
  flex-direction: column; align-items: flex-end; gap: 4px; text-align: right;
}
@media (max-width: 620px) {
  body.theme-do .dv-the { grid-template-columns: 42px minmax(0, 1fr); }
  body.theme-do .dv-the .chan { grid-column: 2; grid-row: auto; flex-direction: row; align-items: baseline; }
}

/* --- cam: lưới bốn cột căn giữa, hero nghiêng về phía hình -------------- */
/* Không có mẫu để đo — bộ này em dựng thêm cho đủ sáu. Chọn cách xếp còn
   trống trong năm bộ kia: ô dịch vụ căn giữa như bảng hiệu treo tường, bốn ô
   một hàng, và mọi hàng chữ-hình đảo chiều so với mặc định.
   Hero từng để cột hình rộng hơn cột chữ (.95/1.05), nhưng đo ra cột chữ chỉ
   còn 463px trong khi hai nút cần 585px — hai nút rơi xuống hai hàng so le.
   Đổi lại thành cột chữ rộng hơn; nét riêng của bộ này nằm ở lưới và ở vạch
   cảnh báo, không cần vay thêm ở hero. */
@media (min-width: 980px) {
  body.theme-cam .hero-canh { grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); }
  body.theme-cam .doi-hinh { direction: rtl; }
  body.theme-cam .doi-hinh > * { direction: ltr; }
  body.theme-cam .doi-hinh.lat { direction: ltr; }
}
/* Bốn ô một hàng, nhưng dựng bằng flex-wrap chứ không phải grid bốn cột.
   Lý do: nền của khối này là vạch sọc, nên ô trống ở hàng cuối không phải là
   chỗ trống mà là một mảng sọc to đùng — sáu dịch vụ chia bốn cột thì dư hai ô.
   flex-wrap cho các thẻ ở hàng cuối tự nở ra lấp kín hàng, đúng với mọi số
   dịch vụ chứ không riêng con số sáu hôm nay.

   Đánh đổi đã biết, đọc luật gốc ở css.html:481 trước khi bê cách này sang bộ
   khác: 5 thẻ thì ra 4 + 1, và cái thứ 5 kéo dài hết bề ngang trông như lỗi.
   Hôm nay chịu được: 5 dịch vụ hiện trên trang chủ cộng thẻ "Không thấy việc
   của mình?" là 6 ô, hàng cuối ra 2 ô đều nhau. Bảng giá có 12 dịch vụ, bật
   thêm 3 cái nữa là 9 ô — chia 4 dư 1, hàng cuối còn ĐÚNG MỘT ô kéo dài hết
   bề ngang, đúng cái lỗi ghi ở trên. Lúc đó quay lại đây đổi sang grid. */
@media (min-width: 1000px) {
  body.theme-cam .luoi-vach { display: flex; flex-wrap: wrap; }
  body.theme-cam .luoi-vach > * { flex: 1 1 calc(25% - 6px); }
}
body.theme-cam .dv-the { align-items: center; text-align: center; padding: 22px 16px; }
body.theme-cam .dv-the .dau-the { justify-content: center; }
body.theme-cam .dv-the .chan { justify-content: center; }
/* .dv-the .chip có align-self: flex-start (css.html:529) để nó khỏi giãn rộng
   hết thẻ. Ở bộ này mọi thứ căn giữa nên phải gỡ, không thì nhãn nằm lệch hẳn
   sang mép trái trong khi tên việc ở giữa. */
body.theme-cam .dv-the .chip { align-self: center; }
body.theme-cam .dv-the .bt-o { margin-inline: auto; }

/* --- Tấm hero phải nằm gọn trong MỘT màn hình ---------------------------- */
/* Đây là lần sửa thứ ba. Hai lần trước hỏng vì cùng một sai lầm: tôi ĐOÁN chỗ
   trống còn lại rồi ghi thẳng con số vào CSS.

   - Lần 1: height cứng + minmax(0,1fr). Gặp .hero > .khung { overflow: hidden }
     (css.html:340) thì phần thừa bị CẮT chứ không đẩy trang dài ra — mất hẳn
     hàng nút mà không có thanh cuộn nào báo.
   - Lần 2: bỏ height, đo riêng băng ảnh bằng calc(100svh - 580px). Sai hai chỗ:
     580px là con số tôi nhẩm, mà chiều cao khối chữ lại đổi theo BỀ NGANG cửa
     sổ — cửa sổ hẹp thì h1 xuống ba dòng, mọi con số nhẩm sẵn đều lệch.
   - Và cái không ai ngờ: body.theme-kem section { padding: 100px 0 } ở
     css.html:1920 áp cho MỌI section, hero là <section> nên dính đủ 200px trên
     dưới. Tôi trừ 92px trong khi thực tế phải trừ gần 300px.

   Lần này không đoán nữa. Khung có chiều cao xác định để hàng 1fr có mốc chia,
   CỘNG min-height: fit-content làm van an toàn — chữ dài quá thì khung tự cao
   thêm, nên overflow: hidden không còn gì để cắt. Ảnh nhận đúng phần CÒN DƯ,
   bao nhiêu cũng được, không cần ai nhẩm hộ. Đúng thứ tự đã chốt: co ảnh
   trước, chữ nhỏ lại chút, không bỏ khối nào. */
@media (min-width: 980px) {
  /* Gỡ 200px đệm mà theme-kem phát cho mọi section. Hero là tấm duy nhất bắt
     buộc nằm gọn một màn; 200px khoảng trắng ở đây là một phần sáu màn hình. */
  body.theme-tim .hero-lon,
  body.theme-dien .hero-lon,
  body.theme-kem .hero-lon { padding: 24px 0 0; }

  body.theme-tim .hero-lon > .khung,
  body.theme-dien .hero-lon > .khung,
  body.theme-kem .hero-lon > .khung {
    display: grid;
    /* 108px = dải đầu trang (~80px) + đệm trên vừa đặt lại (24px). Trần 1040px
       để trên màn 2K ảnh đừng kéo thành tấm dọc — cắt dọc là mất cả cây vợt. */
    height: min(calc(100vh - 108px), 1040px);
    height: min(calc(100svh - 108px), 1040px);
    min-height: -webkit-fit-content;
    min-height: fit-content;
    padding-block: clamp(22px, 2.8vh, 54px);
  }
  /* stretch để cột trái cao bằng khung — có thế hàng 1fr bên trong nó mới có
     mốc mà chia. Riêng danh sách việc giữ align-self: start, không thì tấm
     kính mờ bị kéo dài xuống tận đáy trong khi chỉ có tám dòng chữ. */
  body.theme-tim .hero-canh,
  body.theme-dien .hero-canh,
  body.theme-kem .hero-canh { align-items: stretch; }
  body.theme-tim .hero-canh > .hero-dv,
  body.theme-dien .hero-canh > .hero-dv,
  body.theme-kem .hero-canh > .hero-dv { align-self: start; }

  /* Sàn 150px: ảnh có thể co, nhưng biến mất hẳn thì hero còn mỗi chữ. Chạm
     sàn rồi mà vẫn chật thì fit-content ở trên cho khung cao thêm — cuộn một
     quãng ngắn, chứ không cắt. */
  body.theme-tim .hero-trai,
  body.theme-dien .hero-trai,
  body.theme-kem .hero-trai {
    grid-template-rows: auto minmax(150px, 1fr);
    gap: clamp(16px, 2.2vh, 32px);
  }
  body.theme-tim .hero-trai > .bang-anh,
  body.theme-dien .hero-trai > .bang-anh,
  body.theme-kem .hero-trai > .bang-anh {
    display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0;
  }
  /* Bỏ tỉ lệ 4:3: chiều cao giờ do ô lưới cấp, ảnh cắt theo object-fit như cũ. */
  body.theme-tim .hero-trai .bang-anh-khung,
  body.theme-dien .hero-trai .bang-anh-khung,
  body.theme-kem .hero-trai .bang-anh-khung {
    aspect-ratio: auto; height: 100%; min-height: 0;
  }

  /* 46ch là bề ngang của bố cục MỘT cột cũ. Cột trái giờ rộng chừng 920px, giữ
     46ch nghĩa là đoạn mô tả chỉ dùng non nửa chiều ngang rồi đổ xuống bảy
     dòng — ăn mất đúng phần đất của băng ảnh. Nới ra là bớt được hai dòng mà
     không cắt chữ nào. Bộ tim để yên: nó canh giữa, dòng dài quá đọc mỏi mắt. */
  body.theme-dien .hero-lon .dan,
  body.theme-kem .hero-lon .dan { max-width: 68ch; }

  /* Dòng chữ to nhất trang đang 58px — trên màn rộng nó chiếm gần một phần ba
     chiều cao hero, đẩy ảnh và cả địa chỉ xuống. Hạ xuống 44px vẫn là thứ to
     nhất trang, mà lấy lại được chỗ cho hai dòng mới. Nới max-width theo, không
     thì chữ bé đi lại rơi thành ba dòng — chẳng tiết kiệm được gì. */
  body.theme-tim .hero-lon h1,
  body.theme-dien .hero-lon h1,
  body.theme-kem .hero-lon h1 { font-size: clamp(30px, 3.3vw, 44px); max-width: 24ch; }

  /* Bản vẽ giữ chỗ lúc chưa up ảnh: cùng ô lưới ấy, giữ tỉ lệ gốc. */
  body.theme-tim .hero-trai > .sv-ve,
  body.theme-dien .hero-trai > .sv-ve,
  body.theme-kem .hero-trai > .sv-ve {
    min-height: 0; display: grid; align-content: center; justify-items: center;
  }
  body.theme-tim .hero-trai > .sv-ve > svg,
  body.theme-dien .hero-trai > .sv-ve > svg,
  body.theme-kem .hero-trai > .sv-ve > svg { max-height: 100%; width: auto; }
}

/* Màn thấp: chữ nhỏ lại theo chiều cao màn. 880px là chỗ bắt đầu chật — trên
   mức đó cỡ chữ gốc vẫn vừa, dưới mức đó mà giữ nguyên thì riêng khối chữ đã
   ăn hết màn, ảnh chạm sàn rồi vẫn phải cuộn. */
@media (min-width: 980px) and (max-height: 880px) {
  body.theme-tim .hero-lon h1,
  body.theme-dien .hero-lon h1,
  body.theme-kem .hero-lon h1 { font-size: clamp(28px, 4.2vh, 44px); }

  body.theme-tim .hero-lon .dan,
  body.theme-dien .hero-lon .dan,
  body.theme-kem .hero-lon .dan { font-size: clamp(14.5px, 1.9vh, 17px); line-height: 1.55; }

  body.theme-tim .hero-lon .hero-nut,
  body.theme-dien .hero-lon .hero-nut,
  body.theme-kem .hero-lon .hero-nut { margin-top: clamp(16px, 2.6vh, 34px); }

  /* Màn càng thấp thì càng phải nới ngang: mỗi dòng bớt đi là hai chục pixel
     trả lại cho băng ảnh. */
  body.theme-dien .hero-lon .dan,
  body.theme-kem .hero-lon .dan { max-width: 76ch; }
}

/* Laptop 1366x768 và các màn còn thấp hơn: hạ sàn băng ảnh xuống 110px. Giữ
   150px ở đây thì riêng phần chênh ấy đã đủ đẩy hero quá một màn. */
@media (min-width: 980px) and (max-height: 760px) {
  body.theme-tim .hero-trai,
  body.theme-dien .hero-trai,
  body.theme-kem .hero-trai { grid-template-rows: auto minmax(110px, 1fr); }
}



/* ==========================================================================
   BỐ CỤC — BẢY KHỐI CÒN LẠI CỦA TRANG CHỦ
   --------------------------------------------------------------------------
   Khối trên mới đổi tấm hero và lưới dịch vụ. Chụp cả sáu bộ nguyên trang rồi
   xếp cạnh nhau thì lòi ra: đó là 2 trên 10 khối, còn tám khối kia — dải số
   liệu, phiếu khám, hai khối chữ-hình, bốn bước, ba cam kết, form, chân trang
   — giống hệt nhau ở cả sáu bộ, mà chúng chiếm 80% chiều dài trang. Nhìn từ
   xa vẫn là "một tấm hero màu rồi tám khối trắng xếp y hệt". Kendy trả lại
   lần thứ tư, đúng.

   Xếp theo KHỐI chứ không theo bộ: mỗi khối ghi luật gốc trước rồi tới sáu
   cách dựng lại. Sau này sửa luật gốc thì đọc một chỗ là biết bộ nào bị đè.

   Bảy khối này bám vào bảy điểm neo có sẵn trong trangchu.html — không thêm
   một class nào, không đụng nội dung:

     .bang-so-luoi  ba ô, mỗi ô ba dòng .n / .v / .t
     .doi-hinh      hai cột hình-chữ (ba lần trên trang), .lat là bản đảo
     .doc-lon       tiêu đề khối rồi tới nội dung khối (dùng ở 3 mục)
     .buoc          bốn ô quy trình, mỗi ô có .n
     .cam-ket       ba thẻ .the[data-so]
     .doi-cot       form bên trái, .canh hai thẻ bên phải
     footer .cot    lưới cột link chân trang
   ========================================================================== */

/* --- 1. Dải số liệu ------------------------------------------------------- */
/* Gốc (css.html:459): lưới vạch 3 ô, thẻ trắng, kéo lên -26px đè lên hero,
   trong mỗi ô là nhãn nhỏ → số to → câu giải thích. */

/* cobalt: một dải mực đặc, số trước nhãn sau. Băng tối vắt ngang chân tấm
   hero xanh cho ra nhịp hai lớp giống mẫu. */
body.theme-cobalt .bang-so-luoi {
  background: var(--muc); border-color: var(--muc); box-shadow: none; gap: 1px;
}
body.theme-cobalt .bang-so-luoi > div { background: var(--muc); padding: 20px 26px; }
body.theme-cobalt .bang-so-luoi > div + div { box-shadow: -1px 0 0 rgba(255,255,255,.16); }
body.theme-cobalt .bang-so-luoi > div { display: flex; flex-direction: column; }
body.theme-cobalt .bang-so .v { order: 1; color: var(--sang); }
body.theme-cobalt .bang-so .n { order: 2; margin: 12px 0 0; color: var(--tren-dam); }
body.theme-cobalt .bang-so .t { order: 3; color: var(--tren-dam-mo); }

/* dien: bỏ hẳn thẻ. Ba con số trần, căn giữa, to gấp rưỡi, ngăn nhau bằng một
   đường kẻ dọc. Bỏ luôn cú kéo lên -26px: không còn nền thẻ thì chữ đè lên
   hero là không đọc được. */
body.theme-dien .bang-so > .khung { margin-top: 40px; }
body.theme-dien .bang-so-luoi {
  background: none; border: none; box-shadow: none; border-radius: 0; gap: 0;
}
body.theme-dien .bang-so-luoi > div { background: none; text-align: center; padding: 6px 24px; }
body.theme-dien .bang-so-luoi > div + div { border-left: 1px solid var(--vien); }
body.theme-dien .bang-so .v { font-size: clamp(34px, 4.6vw, 48px); }
body.theme-dien .bang-so .t { max-width: 30ch; margin-inline: auto; }

/* bien: số nằm BÊN TRÁI chữ chứ không nằm trên — ô thấp hẳn xuống, hợp với bộ
   nhỏ và khẽ. */
body.theme-bien .bang-so-luoi > div {
  display: grid; grid-template-columns: auto minmax(0, 1fr);
  column-gap: 16px; align-items: center; padding: 18px 20px;
}
body.theme-bien .bang-so .v { grid-column: 1; grid-row: 1 / 3; font-size: 32px; }
body.theme-bien .bang-so .n { grid-column: 2; margin-bottom: 3px; }
body.theme-bien .bang-so .t { grid-column: 2; margin-top: 0; font-size: 13px; }

/* kem: ba mảng màu rời nhau, bo góc to, không viền không bóng — cùng công thức
   với lưới dịch vụ của bộ này. */
body.theme-kem .bang-so-luoi {
  background: none; border: none; box-shadow: none; gap: 16px;
  grid-template-columns: 1fr;
}
@media (min-width: 700px) { body.theme-kem .bang-so-luoi { grid-template-columns: repeat(3, 1fr); } }
body.theme-kem .bang-so-luoi > div { border-radius: var(--r); padding: 26px 28px; }
body.theme-kem .bang-so-luoi > div:nth-child(2) { background: var(--th-nen); }
body.theme-kem .bang-so-luoi > div:nth-child(3) { background: color-mix(in srgb, var(--sang) 15%, var(--the)); }

/* do: xếp dọc thành ba dòng, số dồn về mép phải — đọc như bảng thông số dán
   trên tường trạm, cùng mạch với lưới dịch vụ một cột của bộ này. */
body.theme-do .bang-so-luoi { grid-template-columns: 1fr; }
body.theme-do .bang-so-luoi > div {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  column-gap: 24px; align-items: center; padding: 14px 22px;
}
body.theme-do .bang-so .n { grid-column: 1; margin-bottom: 4px; }
body.theme-do .bang-so .t { grid-column: 1; margin-top: 0; }
body.theme-do .bang-so .v { grid-column: 2; grid-row: 1 / 3; font-size: 34px; }

/* cam: căn giữa, khe là vạch cảnh báo — đúng công thức đã dùng cho lưới. */
body.theme-cam .bang-so-luoi {
  gap: 5px; border-width: 2px; border-color: var(--vien-dam);
  background: repeating-linear-gradient(-45deg,
    color-mix(in srgb, var(--muc) 26%, transparent) 0 4px, transparent 4px 8px) var(--nen);
}
body.theme-cam .bang-so-luoi > div { text-align: center; }
body.theme-cam .bang-so .t { max-width: 28ch; margin-inline: auto; }

/* --- 2. Hai khối chữ-hình ------------------------------------------------- */
/* Gốc (css.html:610): cột hình 460px cố định, cột chữ 1fr, .lat đảo bên. */

/* cobalt: chia đôi đều, không khe, hình vuông góc chạm mép cột — kiểu ấn phẩm,
   khớp với hero phủ kín của bộ này. */
@media (min-width: 900px) {
  body.theme-cobalt .doi-hinh { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
  body.theme-cobalt .doi-hinh > *:last-child { padding-inline: 44px; }
  body.theme-cobalt .hinh-o { border-radius: 0; margin: 0; }
}

/* dien: một cột, hình NẰM TRÊN chữ, cả hai căn giữa. Riêng danh sách gạch đầu
   dòng phải kéo về căn trái: chữ chạy dài mà căn giữa thì mỗi dòng một mép,
   mắt không bắt được đầu dòng. */
@media (min-width: 900px) {
  body.theme-dien .doi-hinh { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; gap: 40px; }
  body.theme-dien .doi-hinh .hinh-o { max-width: 640px; }
  body.theme-dien .doi-hinh > * { max-width: 860px; }
  body.theme-dien .doi-hinh .gach { max-width: 64ch; margin-inline: auto; text-align: left; }
  body.theme-dien .doi-hinh .dan-lon { max-width: 62ch; margin-inline: auto; }
}

/* bien: cột hình hẹp lại còn 360px cho cột chữ dài ra — bộ này chữ nhỏ, dòng
   thưa, cần bề ngang chứ không cần hình to. */
@media (min-width: 900px) {
  body.theme-bien .doi-hinh { grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 44px; }
}

/* kem: đảo tỉ lệ — hình rộng hơn chữ. Khung bộ này đã 1296px nên bản vẽ có chỗ
   để thở, và đó là thứ duy nhất trên trang chưa được dùng to. */
@media (min-width: 900px) {
  body.theme-kem .doi-hinh { grid-template-columns: minmax(0, 1fr) minmax(0, .74fr); gap: 56px; }
  body.theme-kem .hinh-o { border-radius: 22px; padding: 30px; }
}

/* do: hình co lại thành bản vẽ kỹ thuật ghim bên cạnh, vuông góc, viền dày —
   chữ mới là phần chính. */
@media (min-width: 900px) {
  body.theme-do .doi-hinh { grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 40px; align-items: start; }
  body.theme-do .hinh-o { border-radius: 0; border-width: 2px; }
}

/* cam: đã đảo chiều ở khối trên. Thêm vạch cam trên nóc khung hình cho khớp
   với gạch cam ở đỉnh mỗi thẻ. */
body.theme-cam .hinh-o { border-top: 3px solid var(--sang); border-radius: 0; }

/* --- 3. Khối "tiêu đề rồi tới nội dung" ----------------------------------- */
/* Gốc (css.html:237): .doc-lon xếp dọc, tiêu đề trên, nội dung dưới. Dùng ở ba
   mục: bảng dịch vụ, bốn bước, ba cam kết — nên đổi một dòng là đổi ba mục. */

/* kem và do: tiêu đề tách sang một cột trái, nội dung chạy bên phải. Đây là
   đòn đổi dáng trang mạnh nhất trong cả khối này vì nó ăn vào ba mục một lúc.
   Chỉ hai bộ được dùng: kem có khung 1296px và do có lưới một cột, cả hai còn
   chỗ cho cột trái. Bốn bộ kia lưới 3-4 cột, cắt thêm 300px là ô bẹp dí.
   CHÚ Ý: chỉ ăn khi con ĐẦU của .doc-lon thật sự là khối tiêu đề (nhận ra qua
   .nhan-vach bên trong). Bốn trang — dịch vụ, quy trình, bài viết, tra cứu —
   đặt thẳng lưới vào con đầu, không có tiêu đề; thiếu chốt :has() thì lưới bị
   nhét vào cột 320px và thẻ bẹp còn 96px, mỗi dòng một chữ. */
@media (min-width: 1000px) {
  body.theme-kem .doc-lon:has(> *:first-child .nhan-vach) { grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 48px; align-items: start; }
  body.theme-do .doc-lon:has(> *:first-child .nhan-vach)  { grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 40px; align-items: start; }
}

/* dien và cam: tiêu đề khối căn giữa. Hai bộ này căn giữa từ hero xuống nên
   tiêu đề lệch trái sẽ lạc quẻ. */
body.theme-dien .doc-lon > *:first-child:has(.nhan-vach),
body.theme-cam .doc-lon > *:first-child:has(.nhan-vach) { text-align: center; max-width: 70ch; margin-inline: auto; }
body.theme-dien .doc-lon > *:first-child .nhan-vach,
body.theme-cam .doc-lon > *:first-child .nhan-vach { justify-content: center; }

/* --- 4. Bốn bước --------------------------------------------------------- */
/* Gốc (css.html:589): lưới vạch 4 ô ngang, mỗi ô nhãn BƯỚC N gạch chân. */

/* cobalt: bỏ nền thẻ, bốn cột chỉ ngăn bằng vạch vàng dựng đứng ở đầu mỗi cột. */
body.theme-cobalt .buoc { background: none; border: none; box-shadow: none; gap: 0; border-radius: 0; }
body.theme-cobalt .buoc > div { background: none; padding: 0 26px; border-left: 2px solid var(--sang); }
@media (max-width: 760px) { body.theme-cobalt .buoc > div { padding: 14px 0 14px 20px; } }
body.theme-cobalt .buoc .n { border-bottom: none; padding-bottom: 0; }

/* dien: bốn cột nhưng căn giữa, số bước to đùng nằm trên tên bước. */
body.theme-dien .buoc { background: none; border: none; box-shadow: none; gap: 18px; border-radius: 0; }
body.theme-dien .buoc > div { background: var(--the); border: 1px solid var(--vien); border-radius: var(--r); justify-items: center; text-align: center; }
body.theme-dien .buoc .n {
  justify-self: center; border-bottom: none; padding-bottom: 0;
  font-size: 26px; letter-spacing: .02em; color: var(--sang-muc);
}

/* bien: 2x2 thay vì 4 ngang — bộ này ô nhỏ, xếp bốn ô ngang thì mỗi ô chỉ còn
   248px mà chữ mô tả dài bốn dòng. */
@media (min-width: 760px) { body.theme-bien .buoc { grid-template-columns: repeat(2, 1fr); } }

/* kem: 2x2, các ô rời nhau bo góc to, màu luân phiên. */
body.theme-kem .buoc { background: none; border: none; box-shadow: none; gap: 16px; }
@media (min-width: 760px) { body.theme-kem .buoc { grid-template-columns: repeat(2, 1fr); } }
body.theme-kem .buoc > div { border-radius: var(--r); padding: 28px 26px; }
body.theme-kem .buoc > div:nth-child(2n) { background: var(--th-nen); }

/* do: bốn bước xếp DỌC thành bốn hàng, số bước nằm trong ô vuông bên trái —
   cùng một mạch với bảng dịch vụ một cột. */
body.theme-do .buoc { grid-template-columns: 1fr; }
@media (min-width: 760px) { body.theme-do .buoc { grid-template-columns: 1fr; } }
body.theme-do .buoc > div {
  grid-template-columns: 96px minmax(0, 1fr); column-gap: 22px; row-gap: 4px;
  align-content: center; padding: 18px 22px;
}
body.theme-do .buoc .n {
  grid-column: 1; grid-row: 1 / 3; align-self: center; justify-self: stretch;
  display: grid; place-content: center; text-align: center;
  border-bottom: none; padding: 12px 0; margin: 0;
  background: var(--th-nen); color: var(--th); border-left: 3px solid var(--sang);
}
body.theme-do .buoc > div > h4,
body.theme-do .buoc > div > p { grid-column: 2; }

/* cam: bốn ô căn giữa, nhãn bước thành một tem dán chứ không phải chữ gạch chân. */
body.theme-cam .buoc {
  gap: 5px; border-width: 2px; border-color: var(--vien-dam);
  background: repeating-linear-gradient(-45deg,
    color-mix(in srgb, var(--muc) 26%, transparent) 0 4px, transparent 4px 8px) var(--nen);
}
body.theme-cam .buoc > div { justify-items: center; text-align: center; }
body.theme-cam .buoc .n {
  justify-self: center; border-bottom: none; padding: 5px 12px;
  background: var(--sang); color: var(--tren-sang);
}

/* --- 5. Ba cam kết ------------------------------------------------------- */
/* Gốc (css.html:573): ba thẻ ngang, viền trên 3px, số 01/02/03 mờ ở góc phải. */

/* cobalt: bỏ thẻ, ba cột chữ trần dưới một vạch vàng dày. */
body.theme-cobalt .cam-ket .the {
  background: none; border: none; border-top: 4px solid var(--sang);
  border-radius: 0; box-shadow: none; padding: 20px 0 0;
}
body.theme-cobalt .cam-ket .the::after { top: -2px; right: 0; opacity: .1; }

/* dien: ba cột căn giữa, số thứ tự kéo ra làm tiêu đề chứ không nấp ở góc. */
body.theme-dien .cam-ket .the { text-align: center; padding-top: 58px; }
body.theme-dien .cam-ket .the::after {
  left: 0; right: 0; top: 14px; text-align: center; font-size: 40px;
  opacity: .55; color: var(--sang-muc);
}

/* bien: ba cột nhỏ, bỏ vạch trên, dùng bóng tỏa — bộ này khẽ, không gạch đầu. */
body.theme-bien .cam-ket { gap: 16px; }
body.theme-bien .cam-ket .the { border-top-width: 1px; border-top-color: var(--vien); }

/* kem: ba mảng màu luân phiên, không viền. */
body.theme-kem .cam-ket { gap: 16px; }
body.theme-kem .cam-ket .the { border: none; border-radius: var(--r); padding: 26px 28px; }
body.theme-kem .cam-ket .the:nth-child(2) { background: var(--th-nen); }
body.theme-kem .cam-ket .the:nth-child(3) { background: color-mix(in srgb, var(--sang) 15%, var(--the)); }

/* do: ba hàng dọc, số thứ tự to bên trái làm cột mốc. */
body.theme-do .cam-ket { grid-template-columns: 1fr; gap: 1px; background: var(--vien); border: 1px solid var(--vien); }
body.theme-do .cam-ket .the {
  border: none; border-radius: 0; border-left: 3px solid var(--sang);
  padding: 20px 24px 20px 92px; overflow: visible;
}
body.theme-do .cam-ket .the::after {
  left: 22px; right: auto; top: 50%; transform: translateY(-50%);
  font-size: 40px; opacity: .3;
}

/* cam: ba ô căn giữa, khe vạch cảnh báo. */
body.theme-cam .cam-ket {
  gap: 5px; padding: 0; border: 2px solid var(--vien-dam);
  background: repeating-linear-gradient(-45deg,
    color-mix(in srgb, var(--muc) 26%, transparent) 0 4px, transparent 4px 8px) var(--nen);
}
body.theme-cam .cam-ket .the { text-align: center; border-radius: 0; }
/* Số thứ tự mờ ở đây phải nằm nguyên góc phải như luật gốc. Từng thử kéo nó ra
   giữa cho khớp với chữ căn giữa: nó rơi đúng sau tiêu đề, mờ 7% vẫn đủ làm
   chữ nhòe ở chỗ mắt nhìn vào đầu tiên. Ở góc thì không đụng ai. */

/* --- 6. Khối form gửi yêu cầu -------------------------------------------- */
/* Gốc (css.html:604): form bên trái 1fr, .canh hai thẻ bên phải 340px, dính
   theo khi cuộn. */

/* cobalt: hai thẻ phụ sang bên TRÁI. direction: rtl đảo thứ tự cột, con phải
   trả về ltr không thì dấu câu nhảy sang đầu dòng. */
@media (min-width: 900px) {
  body.theme-cobalt .doi-cot { direction: rtl; }
  body.theme-cobalt .doi-cot > * { direction: ltr; }
}

/* dien: một cột, form căn giữa, hai thẻ phụ xuống dưới nằm ngang. */
@media (min-width: 900px) {
  body.theme-dien .doi-cot { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  body.theme-dien .doi-cot > *:first-child { max-width: 780px; width: 100%; }
  body.theme-dien .doi-cot > .canh {
    position: static; grid-template-columns: repeat(2, minmax(0, 1fr));
    max-width: 780px; width: 100%;
  }
}

/* bien: cột phụ hẹp lại 280px và thôi dính theo — bộ này khối nào cũng đứng
   yên, một mảng bám theo màn hình là thứ duy nhất động đậy, chỏi. */
@media (min-width: 900px) {
  body.theme-bien .doi-cot { grid-template-columns: minmax(0, 1fr) 280px; }
  body.theme-bien .doi-cot > .canh { position: static; }
}

/* kem: một cột, form chạy hết khung 1296px, hai thẻ phụ thành hai mảng rộng
   bên dưới. */
@media (min-width: 900px) {
  body.theme-kem .doi-cot { grid-template-columns: minmax(0, 1fr); }
  body.theme-kem .doi-cot > .canh { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
}

/* do: hai thẻ phụ nhảy LÊN TRÊN form, nằm ngang như hai dòng thông báo dán
   trước cửa. order âm được vì .doi-cot là lưới. */
@media (min-width: 900px) {
  body.theme-do .doi-cot { grid-template-columns: minmax(0, 1fr); }
  body.theme-do .doi-cot > .canh {
    position: static; order: -1; grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* cam: hai thẻ phụ sang trái và căn giữa nội dung, cho khớp với mọi ô khác. */
@media (min-width: 900px) {
  body.theme-cam .doi-cot { direction: rtl; }
  body.theme-cam .doi-cot > * { direction: ltr; }
}
body.theme-cam .doi-cot > .canh .the { text-align: center; }

/* --- 7. Chân trang ------------------------------------------------------- */
/* Gốc (css.html:791): auto-fit từ 190px, ra bốn cột đều nhau ở màn rộng. */
body.theme-dien footer .cot { text-align: center; }
body.theme-bien footer .cot { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 40px; }
@media (min-width: 900px) {
  body.theme-do footer .cot { grid-template-columns: 1.6fr 1fr 1fr 1fr; }
  body.theme-kem footer .cot { grid-template-columns: 2fr 1fr 1fr; gap: 40px; }
}
body.theme-cam footer .cot { text-align: center; }


/* ==========================================================================
   CHUYỂN ĐỘNG
   --------------------------------------------------------------------------
   Ba thứ, không hơn: nút và thẻ nhấc lên khi rê chuột, mỗi khối nội dung trôi
   lên một quãng ngắn khi cuộn tới, và vệt sáng trên hero thở rất chậm. Trang
   bán hàng cần thấy sống, nhưng thứ nhảy múa quá tay thì đọc mệt, và trên máy
   yếu là giật — mà khách của trạm phần lớn mở bằng điện thoại giữa sân.

   Cả khối này tự tắt trong @media (prefers-reduced-motion: reduce) phía trên,
   vì rule ở đó dùng !important.
   ========================================================================== */
.nut, .dv-the, .the, .bt-o, .phieu {
  transition: transform .18s ease, box-shadow .22s ease,
              background-color .18s ease, border-color .18s ease, color .18s ease;
}
.nut-chinh:hover, .nut-vien:hover { transform: translateY(-2px); }
.nut-chinh:active, .nut-vien:active { transform: translateY(0); }
.nut-chinh:hover {
  box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--sang) 70%, transparent);
}
.dv-the:hover { transform: translateY(-3px); }
/* Trong lưới có vạch ngăn thì thẻ không được nhấc: nhấc lên là hở vạch. */
.luoi-vach .dv-the:hover { transform: none; }

/* Vệt sáng hero thở. 16 giây một nhịp — chậm tới mức không ai bắt được nó
   đang động, chỉ thấy tấm hero không chết cứng. Chỉ animate opacity: ::before
   phủ inset:0 nên scale sẽ tràn khỏi bo góc. */
@keyframes tho-sang { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
.hero-lon > .khung::before { animation: tho-sang 16s ease-in-out infinite; }

/* Khối nội dung trôi lên khi cuộn tới.
   Trạng thái ẩn ban đầu CHỈ bật khi JS đã chạy và đã gắn class lên body —
   không có JS (hoặc JS lỗi) thì trang vẫn hiện đủ chữ. Ẩn bằng CSS thuần rồi
   trông chờ JS hiện ra là cách nhanh nhất để có một trang trắng. */
@keyframes troi-len { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
body.js-troi .troi { opacity: 0; }
body.js-troi .troi.vao { animation: troi-len .55s cubic-bezier(.22,.68,.36,1) both; }


/* ==========================================================================
   ẢNH, TRANG TRÍ VÀ CHUYỂN ĐỘNG — RIÊNG TỪNG BỘ
   --------------------------------------------------------------------------
   Khối này sinh ra từ một lần bị trả lại: "nó vẫn chỉ là thay màu sắc thôi mà".
   Đo lại thì đúng thật. Trước khối này cả bảy bộ dùng CHUNG bốn @keyframes
   (ve-net, hien-dan, tho-sang, troi-len) và chung đúng một luật rê chuột —
   nghĩa là màu khác, dáng khác, bố cục khác, nhưng trang ĐỘNG y hệt nhau.
   Đo ba mẫu gốc bằng scratchpad/hieuung.js:

     mẫu Compair (cobalt)   30 ảnh · 368 transition · 40 keyframes · WOW+Swiper
     mẫu Gogrin  (đỏ)       12 ảnh · 491 transition · 40 keyframes · WOW+Swiper
     mẫu RepairPress (biển) 12 ảnh ·  79 transition · 11 keyframes · không thư viện
     trang mình               3 ảnh ·  30 transition ·  4 keyframes

   Ba con số đầu tiên mới là chỗ chênh lệch thật: ẢNH. Mẫu nào cũng 12-30 tấm,
   mình có 3 tấm line-art xanh volt dùng chung cho cả bảy bộ. Không có ảnh thì
   sáu trang chỉ còn là sáu cách xếp chữ, mà xếp chữ thì nhìn lướt qua giống
   nhau hết.

   Nên khối này làm ba việc, theo đúng thứ tự sức nặng:

   1. ẢNH. Mỗi bộ hai tấm riêng, nhúng trong binary ở ui/anh/, phục vụ qua
      /anh-gd/{ten}. Gắn bằng background-image chứ không phải thẻ <img>: HTML
      không phải đổi một chữ, và mỗi bộ tự chọn tấm của mình. Ảnh lấy ở
      Unsplash — giấy phép cho dùng thương mại, không bắt ghi nguồn. Đây là
      ảnh ĐỆM: Kendy up ảnh trạm thật vào /qt/anh-trang-chu thì ảnh thật
      thắng ở tấm đầu trang, mấy chỗ còn lại vẫn là ảnh kho cho tới khi có đủ.

   2. TRANG TRÍ. Mỗi bộ một món, không bộ nào trùng bộ nào:
        cobalt  băng ảnh phủ kín dưới dải số
        điện    số to hơn nữa, ảnh làm nền rất mờ sau ba cam kết
        biển    tấm đè lấn — hình có một tấm phẳng lệch 22px sau lưng
        kem     huy hiệu tròn thay ô vuông, băng ảnh ấm ở chân trang
        đỏ      dải ảnh trạm làm kết cấu sau bốn bước
        cam     đường cắt chéo trên tấm đầu trang, ảnh chạy hết bề ngang

   3. CHUYỂN ĐỘNG. Mỗi bộ một hướng hiện, một nhịp, một kiểu rê chuột. Nhịp
      là thứ ít ai gọi tên được nhưng nhận ra ngay: đỏ nảy trong 0.1s, kem
      trôi 0.42s. Cùng một trang, hai cảm giác khác nhau.

   Ba luật giữ khối này không thành trang trí rởm:
     · Chữ trên ảnh luôn có màn lọc bằng chính --th của bộ, đủ dày để tỉ lệ
       tương phản không rơi. Ảnh chỉ được nằm dưới chữ khi có màn lọc.
     · Dưới 900px mọi kiểu cắt chéo/chia đôi đều rơi về "ảnh phủ kín + màn lọc
       dày", vì ở đó chữ chạy hết bề ngang, không còn nửa nào trống để đặt ảnh.
     · Cả khối tự tắt trong prefers-reduced-motion nhờ rule * !important ở trên.
   ========================================================================== */

/* --- Từ vựng chuyển động dùng chung -------------------------------------- */
/* Ảnh nền thở rất chậm. Chỉ transform, không đụng background-size: đổi
   background-size là trình duyệt vẽ lại ảnh mỗi khung hình, điện thoại giữa
   sân là giật ngay. */
@keyframes anh-tho { from { transform: scale(1); } to { transform: scale(1.07); } }

@keyframes troi-trai { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
@keyframes troi-phai { from { opacity: 0; transform: translateX(26px);  } to { opacity: 1; transform: none; } }
@keyframes troi-no   { from { opacity: 0; transform: scale(.945);       } to { opacity: 1; transform: none; } }
@keyframes troi-mo   { from { opacity: 0;                               } to { opacity: 1; } }
@keyframes troi-roi  { from { opacity: 0; transform: translateY(-22px); } to { opacity: 1; transform: none; } }
/* Quét từ trái sang như kéo tờ giấy ra khỏi máy in. Giữ opacity 1 suốt vì
   thứ tạo hiệu ứng là mép cắt, mờ thêm nữa thì mất luôn cái mép ấy. */
@keyframes troi-quet { from { opacity: 1; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }


/* --- T-PIC (bộ mặc định) -------------------------------------------------- */
/* Bộ này Kendy đã duyệt hình dáng rồi, nên chỉ thêm ảnh chứ không đụng bố cục.
   Tấm đầu trang là bàn tay quấn grip — đúng nghề, và tông xám lạnh của nó
   không cãi nhau với volt. Màn lọc nghiêng 158deg trùng hướng gradient gốc để
   ảnh trông như nằm TRONG tấm hero chứ không phải dán đè lên. */
body.theme-tpic .hero > .khung::before {
  background:
    linear-gradient(158deg, var(--th) 4%, color-mix(in srgb, var(--th-dam) 78%, transparent) 58%, color-mix(in srgb, var(--th-dam) 46%, transparent) 100%),
    url("/anh-gd/chung-grip.jpg") 62% 40%/cover no-repeat;
  animation: anh-tho 34s ease-in-out infinite alternate;
}
/* Dải số: ảnh chỉ làm kết cấu, 5% thôi. Ba con số ở đây là thứ khách đọc đầu
   tiên sau tiêu đề — ảnh rõ hơn nữa là ăn mất chúng. */
/* Đệm 14px là phần việc chính ở đây, không phải cái ảnh. Lưới số liệu vốn
   gap:1px và không đệm, nên ảnh đặt làm nền chỉ lộ ra ở khe 1px giữa ba ô —
   tức là không ai thấy. Có đệm thì ảnh thành một cái nẹp bo quanh ba ô, đúng
   kiểu đóng khung ảnh. Màn lọc hạ 92%→82% vì bộ này nền trắng: lọc dày quá thì
   nẹp thành mảng xám phẳng, người xem đọc ra là lỗi chứ không phải chủ ý.
   Đã thử 92% rồi 82%: cả hai đều ra mảng xám. 74% mới thấy được vân giày. */
body.theme-tpic .bang-so-luoi {
  background:
    linear-gradient(0deg, color-mix(in srgb, var(--vien) 74%, transparent), color-mix(in srgb, var(--vien) 74%, transparent)),
    url("/anh-gd/chung-giay.jpg") center/cover no-repeat;
  padding: 14px;
}
body.theme-tpic .bang-so-luoi > div { background: var(--the); }


/* --- COBALT: băng ảnh phủ kín ---------------------------------------------- */
/* Mẫu gốc (Compair) mở trang bằng một tấm ảnh chiếm hết bề ngang, chữ nằm đè
   lên góc trái. Chép đúng cái đó: ảnh phủ kín, màn lọc xanh đặc ở trái loãng
   dần sang phải, nên chữ trắng ở cột trái vẫn đủ tương phản còn nửa phải để
   lộ ảnh. */
body.theme-cobalt .hero > .khung::before {
  background:
    linear-gradient(94deg, var(--th-dam) 2%, color-mix(in srgb, var(--th-dam) 88%, transparent) 34%, color-mix(in srgb, var(--th) 34%, transparent) 100%),
    url("/anh-gd/cobalt-hero.jpg") 68% center/cover no-repeat;
  animation: anh-tho 30s linear infinite alternate;
}
/* Dải số của bộ này vốn đã là một băng mực đặc. Giờ băng ấy đứng trên ảnh
   tường đồ nghề: nền là ảnh, từng ô phủ mực 88% nên chữ vẫn đọc được mà mắt
   vẫn thấy có ảnh phía sau. Đây là món trang trí riêng của cobalt. */
body.theme-cobalt .bang-so-luoi {
  background: url("/anh-gd/cobalt-bang.jpg") center/cover no-repeat;
  border-color: var(--muc);
}
body.theme-cobalt .bang-so-luoi > div {
  background: color-mix(in srgb, var(--muc) 88%, transparent);
}
/* Hiện khi cuộn: trượt từ trái vào. Mẫu gốc dùng WOW fadeInLeft cho gần như
   mọi khối — đây là bản không thư viện của đúng cử chỉ đó. */
body.theme-cobalt.js-troi .troi.vao { animation: troi-trai .5s cubic-bezier(.16,.84,.44,1) both; }
/* Bốn bước và ba cam kết vào lệch nhau 90ms một ô, thành một đợt sóng chạy từ
   trái sang. Ô đầu không delay: chờ rồi mới thấy gì đó là trang trông chậm. */
body.theme-cobalt.js-troi .troi .buoc > div,
body.theme-cobalt.js-troi .troi .cam-ket .the { opacity: 0; }
body.theme-cobalt.js-troi .troi.vao .buoc > div,
body.theme-cobalt.js-troi .troi.vao .cam-ket .the { animation: troi-trai .46s cubic-bezier(.16,.84,.44,1) both; }
body.theme-cobalt.js-troi .troi.vao .buoc > div:nth-child(2),
body.theme-cobalt.js-troi .troi.vao .cam-ket .the:nth-child(2) { animation-delay: .09s; }
body.theme-cobalt.js-troi .troi.vao .buoc > div:nth-child(3),
body.theme-cobalt.js-troi .troi.vao .cam-ket .the:nth-child(3) { animation-delay: .18s; }
body.theme-cobalt.js-troi .troi.vao .buoc > div:nth-child(4) { animation-delay: .27s; }
/* Rê chuột: thẻ không nhấc lên mà nhích sang phải, vạch vàng mép trái dày ra.
   Nhấc lên là cử chỉ của thẻ bo góc; bộ này góc vuông tuyệt đối nên nhấc lên
   trông như thẻ bị bung ra khỏi lưới. */
body.theme-cobalt .dv-the { transition-duration: .18s; }
body.theme-cobalt .dv-the:hover { transform: translateX(5px); }
body.theme-cobalt .luoi-vach .dv-the:hover { transform: translateX(5px); }
body.theme-cobalt .dv-the::before { width: 4px; transition: opacity .18s ease, width .18s ease; }
body.theme-cobalt .dv-the:hover::before { width: 8px; }
body.theme-cobalt .nut-chinh:hover, body.theme-cobalt .nut-vien:hover { transform: none; }
body.theme-cobalt .nut-chinh:hover { box-shadow: inset 0 -3px 0 var(--muc); }
body.theme-cobalt .nut-vien:hover { box-shadow: inset 0 0 0 2px var(--sang); }


/* --- ĐIỆN: số to, ảnh mờ sau cam kết -------------------------------------- */
/* Bộ này căn giữa suốt trang nên chữ chiếm gần hết bề ngang — không còn nửa
   nào trống để đặt ảnh. Vậy chia theo CHIỀU DỌC: dải tối nằm ngang chỗ có chữ
   (24%-76%), ảnh chỉ lộ ra ở mép trên và mép dưới. Từng thử vignette tròn ở
   giữa: bán kính phải to tới mức che kín cả tấm, ảnh mua về mà không ai thấy. */
body.theme-dien .hero > .khung::before {
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--th-dam) 30%, transparent) 0%, color-mix(in srgb, var(--th-dam) 90%, transparent) 24%, color-mix(in srgb, var(--th-dam) 90%, transparent) 76%, color-mix(in srgb, var(--th-dam) 26%, transparent) 100%),
    url("/anh-gd/dien-hero.jpg") center 38%/cover no-repeat;
  animation: anh-tho 18s ease-in-out infinite alternate;
}
/* Ba cam kết đứng trên một tấm ảnh mờ hẳn. Không viền, không thẻ nổi — cả
   khối là một mảng ảnh nhạt, chữ nằm thẳng lên. */
body.theme-dien .cam-ket {
  background:
    linear-gradient(0deg, color-mix(in srgb, var(--nen) 90%, transparent), color-mix(in srgb, var(--nen) 90%, transparent)),
    url("/anh-gd/dien-bang.jpg") center/cover no-repeat;
  padding: 44px 30px; border-radius: var(--r);
}
/* Thẻ trong suốt 18% để ảnh xuyên qua cả thẻ, chứ không phải ba tấm trắng đục
   dán lên ảnh. Vẫn giữ viền: bỏ viền thì ba cột dính thành một mảng chữ. */
body.theme-dien .cam-ket .the { background: color-mix(in srgb, var(--the) 82%, transparent); box-shadow: none; }
/* Số thứ tự là món trang trí riêng của bộ này — kéo từ 40px lên 58px. Phải
   đẩy padding-top lên 76px cùng lúc: số cao 58 + top 6 = chạm mốc 64, chữ bắt
   đầu ở 76 nên còn 12px hở. Đổi một trong hai số mà quên số kia là số đè lên
   tiêu đề ngay. */
body.theme-dien .cam-ket .the { padding-top: 76px; }
body.theme-dien .cam-ket .the::after { top: 6px; font-size: 58px; }
/* Hiện khi cuộn: nở ra từ tâm. Trang căn giữa thì mọi thứ phải lớn ra từ giữa,
   trượt ngang là lộ ngay rằng bố cục không thật sự đối xứng. */
body.theme-dien.js-troi .troi.vao { animation: troi-no .62s cubic-bezier(.16,1,.3,1) both; }
/* Rê chuột: nhấc cao hơn mặc định và có quầng sáng màu nhấn. Bộ này nhịp
   chậm nhất trong sáu bộ — .3s, đủ để thấy nó đi lên chứ không phải nhảy. */
body.theme-dien .dv-the, body.theme-dien .the, body.theme-dien .nut {
  transition-duration: .3s;
}
body.theme-dien .dv-the:hover {
  transform: translateY(-6px);
  box-shadow: 0 18px 34px -18px color-mix(in srgb, var(--sang) 62%, transparent);
}
body.theme-dien .luoi-vach .dv-the:hover { transform: none; }
body.theme-dien .nut-chinh:hover, body.theme-dien .nut-vien:hover { transform: translateY(-3px); }


/* --- BIỂN: tấm đè lấn ------------------------------------------------------ */
/* Mẫu RepairPress là mẫu ÍT hiệu ứng nhất trong ba mẫu đo được: 79 transition,
   11 keyframes, không dùng thư viện nào. Bộ này chép cả cái tiết chế đó —
   đây là bộ khẽ nhất, và khẽ là một lựa chọn chứ không phải làm thiếu. */
body.theme-bien .hero > .khung::before {
  background:
    linear-gradient(160deg, color-mix(in srgb, var(--th-dam) 90%, transparent) 0%, color-mix(in srgb, var(--th-dam) 82%, transparent) 62%, color-mix(in srgb, var(--th-dam) 74%, transparent) 100%),
    url("/anh-gd/bien-hero.jpg") center 45%/cover no-repeat;
  animation: none;
}
/* Món trang trí riêng của biển: TẤM ĐÈ LẤN. Khung hình có một tấm phẳng màu
   nhấn lệch 22px sau lưng, như hai tờ giấy chồng lệch. Làm bằng box-shadow
   chứ không bằng margin âm: khối .doi-hinh có bản .lat đảo chiều bằng
   direction:rtl, margin âm ở đó sẽ đẩy hình ra ngoài mép container. box-shadow
   không tính vào bố cục nên đảo chiều kiểu gì cũng không lệch, và không đẻ ra
   thanh cuộn ngang. */
body.theme-bien .hinh-o {
  background:
    linear-gradient(0deg, color-mix(in srgb, var(--the) 88%, transparent), color-mix(in srgb, var(--the) 88%, transparent)),
    url("/anh-gd/bien-bang.jpg") center/cover no-repeat;
  box-shadow: 22px 22px 0 -1px color-mix(in srgb, var(--sang) 20%, transparent);
}
@media (max-width: 680px) {
  /* Tấm lệch 22px ăn hết lề phải trên điện thoại. Rút còn 10px. */
  body.theme-bien .hinh-o { box-shadow: 10px 10px 0 -1px color-mix(in srgb, var(--sang) 20%, transparent); }
}
/* Hiện khi cuộn: chỉ mờ dần, không dịch chuyển. Bộ này là bộ ngắn nhất —
   trang ngắn thì khối nào cũng vào tầm mắt gần như cùng lúc, cho chúng trượt
   ngang nữa là bốn khối bò ngang màn hình một lượt. */
body.theme-bien.js-troi .troi.vao { animation: troi-mo .45s ease both; }
/* Rê chuột: thẻ đứng yên, chỉ vạch trên đậm lên. Nhịp nhanh .14s cho cảm giác
   dứt khoát mà không ồn. */
body.theme-bien .dv-the, body.theme-bien .the, body.theme-bien .nut { transition-duration: .14s; }
body.theme-bien .dv-the { box-shadow: inset 0 0 0 0 var(--sang); }
body.theme-bien .dv-the:hover { transform: none; border-color: var(--sang); box-shadow: inset 0 3px 0 0 var(--sang); }
body.theme-bien .nut-chinh:hover, body.theme-bien .nut-vien:hover { transform: none; }
body.theme-bien .nut-vien:hover { border-color: var(--sang); color: var(--sang); }


/* --- KEM: huy hiệu tròn, băng ảnh ấm ở chân trang ------------------------- */
/* Nửa trái đặc màu tới mốc 46% rồi loãng dần — ảnh gỗ ấm chỉ sáng lên ở nửa
   phải. Bộ này khung rộng 1296px, chữ dẫn 54ch chạy tới quãng 52% bề ngang,
   nên mốc đặc phải là 46% chứ không thấp hơn. Từng để radial 150% ở góc phải
   trên: bán kính lớn quá nên tới giữa tấm màn lọc mới được 40%, chữ xám nằm
   thẳng trên vân gỗ sáng. */
body.theme-kem .hero > .khung::before {
  background:
    linear-gradient(96deg, var(--th-dam) 0 46%, color-mix(in srgb, var(--th-dam) 72%, transparent) 74%, color-mix(in srgb, var(--th-dam) 44%, transparent) 100%),
    url("/anh-gd/kem-hero.jpg") 76% 22%/cover no-repeat;
  animation: anh-tho 40s ease-in-out infinite alternate;
  transform-origin: 78% 20%;
}
/* Món trang trí riêng của kem: HUY HIỆU TRÒN. Ô biểu tượng vuông bo 14px
   thành đĩa tròn có vành màu nhấn. Ô sẵn là 50x50 nên tròn đều, không méo. */
body.theme-kem .dv-the .bt-o {
  border-radius: 50%; border: 2px solid color-mix(in srgb, var(--sang) 45%, transparent);
  background: var(--nen-2);
}
body.theme-kem .dv-the:hover .bt-o { border-color: var(--sang); }
/* Chân trang đứng trên một băng ảnh ấm. Màn lọc 88% giữ nguyên độ tương phản
   của chữ chân trang — chỗ này chữ đã nhỏ 13.5px, không được phép mờ thêm. */
body.theme-kem footer {
  background:
    linear-gradient(0deg, color-mix(in srgb, var(--th-dam) 88%, transparent), color-mix(in srgb, var(--th-dam) 92%, transparent)),
    url("/anh-gd/kem-bang.jpg") center 35%/cover no-repeat;
}
/* Hiện khi cuộn: trôi từ phải sang, chậm nhất trong sáu bộ (.7s). Bộ này là
   bộ giãn nhất — khối cách nhau 100px — nên chuyển động cũng phải thong thả
   theo, nhanh thì lệch hẳn với khoảng trống xung quanh. */
body.theme-kem.js-troi .troi.vao { animation: troi-phai .7s cubic-bezier(.22,.72,.28,1) both; }
/* Rê chuột: thẻ trượt sang phải, không nhấc. Bộ này thẻ không có viền cũng
   không có bóng, nhấc lên thì chẳng thấy gì thay đổi vì không có mép để nhìn. */
body.theme-kem .dv-the, body.theme-kem .the, body.theme-kem .nut { transition-duration: .42s; }
body.theme-kem .dv-the:hover { transform: translateX(6px); background: var(--th-nen); }
body.theme-kem .luoi-vach .dv-the:hover { transform: translateX(6px); }
body.theme-kem .nut-chinh:hover, body.theme-kem .nut-vien:hover { transform: translateY(-2px); }


/* --- ĐỎ: dải ảnh trạm sau bốn bước --------------------------------------- */
/* Mẫu Gogrin dùng ảnh tối, tương phản cao, gần như đen trắng, để màu đỏ là
   thứ duy nhất có màu trên trang. Chép đúng cách đó: ảnh tấm đầu trang bị màn
   lọc gần như đơn sắc, chỉ chừa cho --sang chỗ nổi lên. */
body.theme-do .hero > .khung::before {
  background:
    linear-gradient(102deg, var(--th-dam) 0%, color-mix(in srgb, var(--th-dam) 90%, transparent) 40%, color-mix(in srgb, var(--th-dam) 52%, transparent) 100%),
    url("/anh-gd/do-hero.jpg") 64% center/cover no-repeat;
  animation: none;
}
/* Món trang trí riêng của đỏ: DẢI ẢNH TỐI CHẠY HẾT BỀ NGANG ở khối quy trình.
   Mẫu Gogrin cắt trang bằng những dải tối phủ hết bề ngang, chữ trắng, đỏ là
   thứ duy nhất có màu — cả trang sáng rồi đột ngột tối một khoảng.

   Lần đầu đặt ảnh vào riêng .buoc và phủ --vien 82%: sai. Bộ này nền sáng nên
   màn lọc sáng dày 82% xoá sạch ảnh, mà bốn hàng lại phủ kín gần hết .buoc,
   chỉ chừa khe 1px. Kết quả là mua ảnh về rồi giấu đi. Muốn ảnh có mặt thì
   phải cho nó một khoảng RỘNG và phải lọc bằng màu TỐI.

   Nới ra cả section: bốn hàng vẫn trắng đục nổi trên nền tối, tiêu đề khối
   phải đổi sang chữ sáng — đó là lý do có ba dòng đè màu chữ ngay dưới. Dùng
   :has() để bắt đúng section chứa .buoc; trang chủ chỉ có một khối như vậy. */
body.theme-do section.nen2:has(.buoc) {
  background:
    linear-gradient(0deg, color-mix(in srgb, var(--th-dam) 86%, transparent), color-mix(in srgb, var(--th-dam) 78%, transparent)),
    url("/anh-gd/do-bang.jpg") center/cover no-repeat;
}
body.theme-do section.nen2:has(.buoc) h2 { color: var(--tren-dam); }
body.theme-do section.nen2:has(.buoc) .nhan-nho { color: var(--sang); }
/* Vạch dẫn của nhãn nhỏ vẽ bằng --vien, tức màu sáng — trên dải tối nó biến
   mất. Vẽ lại bằng màu trắng loãng, giống cách hero vẫn làm. */
body.theme-do section.nen2:has(.buoc) .nhan-vach::after {
  background: linear-gradient(90deg, rgba(255,255,255,.30), transparent);
}
/* Bốn hàng đục hẳn, không pha trong suốt: chúng là bốn tấm trắng đặt trên dải
   tối, khe 1px giữa chúng để lọt ảnh qua chính là đường kẻ. */
body.theme-do .buoc { background: none; }
body.theme-do .buoc > div { background: var(--the); }
/* Hiện khi cuộn: quét từ trái sang, như tờ giấy chui ra khỏi máy in. Không mờ
   dần — mép cắt CHÍNH LÀ hiệu ứng. */
body.theme-do.js-troi .troi.vao { animation: troi-quet .5s cubic-bezier(.65,0,.35,1) both; }
/* Rê chuột: nhịp .1s, nhanh nhất trong sáu bộ. Bộ này in hoa, góc vuông, viền
   dày — cử chỉ phải dứt khoát cho khớp. Thẻ không nhấc mà đổi nền, và ô số
   bước lật sang màu đỏ. */
body.theme-do .dv-the, body.theme-do .the, body.theme-do .nut, body.theme-do .bt-o {
  transition-duration: .1s;
}
body.theme-do .dv-the:hover { transform: none; background: var(--th-nen); box-shadow: none; }
body.theme-do .buoc > div { transition: background-color .1s ease; }
body.theme-do .buoc > div:hover { background: var(--the); }
body.theme-do .buoc .n { transition: background-color .1s ease, color .1s ease; }
body.theme-do .buoc > div:hover .n { background: var(--sang); color: var(--tren-sang); }
body.theme-do .nut-chinh:hover, body.theme-do .nut-vien:hover { transform: none; }
body.theme-do .nut-chinh:hover { box-shadow: 4px 4px 0 0 var(--muc); }


/* --- CAM: đường cắt chéo -------------------------------------------------- */
/* Món trang trí riêng của cam: ĐƯỜNG CẮT CHÉO. Ảnh phủ kín tấm đầu trang,
   nhưng màn lọc là một gradient 100deg có mốc dừng cứng ở 54% — không chuyển
   dần mà cắt phựt. Cột chữ nằm hết bên trái mốc ấy nên tương phản không đổi
   một chút nào so với lúc chưa có ảnh; bên phải mốc là ảnh gần như trần. */
body.theme-cam .hero > .khung::before {
  background:
    linear-gradient(100deg, var(--th-dam) 0 54%, color-mix(in srgb, var(--th-dam) 34%, transparent) 54.5%, color-mix(in srgb, var(--th) 16%, transparent) 100%),
    url("/anh-gd/cam-hero.jpg") 72% center/cover no-repeat;
  animation: none;
}
/* Cột chữ phải dừng TRƯỚC nhát cắt. Đoạn dẫn mặc định rộng 54ch: ở 1280px nó
   chạy tới x≈703 trong khi nhát cắt ở quãng x≈600, nên ba dòng đầu nằm một
   nửa trên ảnh gỗ — chữ --tren-dam-mo trên gỗ sáng là chỗ tương phản rơi thấp
   nhất cả trang. 40ch là mức dòng dài nhất còn dừng kịp. Đổi mốc 47% thì phải
   đổi lại số này. */
@media (min-width: 900px) {
  body.theme-cam .hero .dan, body.theme-cam .hero > .khung > .dan { max-width: 38ch; }
}
@media (max-width: 899px) {
  /* Dưới 900px hero về một cột: chữ chạy hết bề ngang, tràn qua mốc 54% và
     rơi thẳng lên phần ảnh trần. Ở đây bỏ hẳn nhát cắt, quay về màn lọc dày
     đều. Cùng một ảnh, chỉ khác cách che. */
  body.theme-cam .hero > .khung::before {
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--th-dam) 92%, transparent), color-mix(in srgb, var(--th-dam) 80%, transparent)),
      url("/anh-gd/cam-hero.jpg") center/cover no-repeat;
  }
}
/* Khối gửi yêu cầu — khối cuối và dài nhất trang — đứng trên một băng ảnh
   chạy hết bề ngang. Màn lọc 94%: dưới nó là form, mà nhãn form với ô nhập
   thì không được phép nhòe dù chỉ một chút. */
body.theme-cam #gui-yeu-cau {
  background:
    linear-gradient(0deg, color-mix(in srgb, var(--nen-2) 94%, transparent), color-mix(in srgb, var(--nen-2) 94%, transparent)),
    url("/anh-gd/cam-bang.jpg") center 30%/cover no-repeat;
}
/* Hiện khi cuộn: rơi từ trên xuống, có nảy nhẹ (mốc 1.56 vượt quá 1 nên nó đi
   quá đích rồi bật lại). Nhanh — .38s. Bộ công trường thì cử chỉ phải là
   "đặt xuống", không phải "trôi lên". */
body.theme-cam.js-troi .troi.vao { animation: troi-roi .38s cubic-bezier(.34,1.56,.64,1) both; }
body.theme-cam .dv-the, body.theme-cam .the, body.theme-cam .nut { transition-duration: .16s; }
/* Thẻ ở bộ này đã có vạch cam trên đỉnh. Rê chuột thì vạch ấy dày gấp đôi —
   không nhấc thẻ, vì lưới của bộ này ngăn nhau bằng vạch sọc chéo, nhấc lên
   là hở sọc ra. */
body.theme-cam .dv-the { transition: border-top-width .16s ease, background-color .16s ease; }
body.theme-cam .dv-the:hover { transform: none; box-shadow: none; }
body.theme-cam .the:hover { border-top-width: 6px; }
body.theme-cam .nut-chinh:hover, body.theme-cam .nut-vien:hover { transform: translateY(-1px); }
body.theme-cam .nut-chinh:hover { box-shadow: 0 6px 0 -2px var(--muc); }

/* ==========================================================================
   MÀN HÌNH APP (/app) và thanh mời cài
   Chạy trên body.la-app, tách hẳn khỏi khung web. Mọi màu lấy từ biến của
   giao diện đang bật, nên đổi giao diện ở /qt/giao-dien là app đổi theo,
   không phải sửa chỗ này.
   ========================================================================== */
body.la-app {
  background: var(--nen-2);
  /* Chừa chỗ cho thanh đáy cố định, cộng lề an toàn của iPhone tai thỏ. */
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
body.la-app main { min-height: 0; }

.app-dau {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px calc(10px) 16px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  background: var(--the); border-bottom: 1px solid var(--vien);
}
/* --- Bảng hiệu ở màn hình đầu ------------------------------------------
   Logo, tên trạm, dòng nghề — xếp giữa thành một tấm biển. Trước đây ba thứ
   này nằm chen một hàng ngang bên trái, chữ 16px, lọt thỏm cạnh cái logo;
   khách mở app ra không thấy tên trạm đâu.

   Tấm biển này KHÔNG dính đỉnh: nó cao gần trăm điểm ảnh, dính lại thì suốt
   lúc cuộn cứ chiếm mất một phần bảy màn hình để lặp lại thứ khách đã đọc.
   Đường về vẫn còn nguyên ở nút Trang chủ dưới thanh đáy. */
/* --- Hàng rào: chặn giao diện web tràn vào vỏ app ----------------------
   Sáu bộ giao diện web đều khai luật theo dạng `body.theme-X <thẻ>`, đặc
   hiệu (0,1,2). Luật của app viết bằng class trần — (0,1,0) hay (0,2,0) —
   thua sạch, nằm sau bao nhiêu dòng cũng vô ích. Hậu quả thấy trên máy
   Kendy: <section class="app-hero"> ăn nguyên `body.theme-kem section
   { padding: 100px 0 }`, thành hai khoảng trắng hai trăm điểm ảnh kẹp lấy
   đúng một câu; h1 trong đó nhảy lên 33px, to ngang tên trạm trên tấm biển;
   .app-muc ở trang con cũng phồng y như vậy.

   Không sửa bằng cách hạ luật theme xuống: chúng đúng cho trang web trên
   màn 24 inch. Dựng hàng rào ở đây thay vào đó — mọi luật trong khối này
   đều kèm body.la-app nên vượt được body.theme-*, mà không rơi giọt nào ra
   ngoài, vì lớp la-app chỉ có trên các trang /app. Luật app nào đụng cùng
   một thẻ với theme thì phải nằm trong hàng rào này, không viết class trần
   ở ngoài rồi mong nó thắng. */
body.la-app .app-than section { padding: 0; border-top: none; }
body.la-app .app-than section.app-muc { padding: 16px 15px 17px; }
body.la-app .app-h2 { font-size: 16px; line-height: 1.3; letter-spacing: -.01em; font-weight: 700; }
body.la-app .app-dv-ten { font-size: 21px; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; }

.app-bia {
  text-align: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 18px;
  background: var(--the); border-bottom: 1px solid var(--vien);
}
.app-bia-lk { display: block; text-decoration: none; color: var(--muc); }
.app-bia .logo-dau { height: 44px; width: auto; margin: 0 auto; display: block; }
.app-bia img.logo-dau { max-width: 200px; object-fit: contain; }
/* Ba màu trong logo mặc định là bản nền tối — chữ T-PIC màu paper. Thân app
   nền sáng, để nguyên là chữ trắng trên nền trắng, mất hẳn. Đổi sang bản một
   màu theo mực của giao diện đang bật; riêng quả bóng lấy màu nhấn đã hạ tối
   đủ tương phản (assets/logo/README.md: nền sáng thì dùng bản mono). */
body.la-app .app-bia .logo-dau, body.la-app .app-dau .logo-dau {
  --lg-do: var(--muc-mo); --lg-chu: var(--muc); --lg-bong: var(--sang-muc);
}
.app-bia-ten {
  display: block; margin-top: 12px;
  font-size: clamp(23px, 6.6vw, 29px); font-weight: 800;
  letter-spacing: -.03em; line-height: 1.08;
}
.app-bia-mo {
  display: block; margin: 6px auto 0; max-width: 32ch;
  font-size: 12.5px; line-height: 1.42; color: var(--muc-mo);
}

.app-than { max-width: 620px; margin: 0 auto; padding: 18px 16px 8px; }
.app-dan { margin: 2px 2px 14px; color: var(--muc-mo); font-size: 14px; line-height: 1.5; }

/* Dòng chữ to nhất màn app. Tên trạm trên đầu trang là tên riêng — nó không
   nói ra nghề, mà khách mới cài xong thì cần biết ngay app này làm gì với cây
   vợt. Cỡ chữ co theo bề ngang máy: máy 320px vẫn hai dòng, không tràn. */
/* Mọi khối trong thân app ăn chung lề của .app-than. Trước đây mỗi khối tự
   thêm 2-3px lề riêng, ba khối ba mép lệch nhau vài điểm ảnh — không ai chỉ
   ra được là lệch, nhưng nhìn vào thấy nó xộc xệch. */
.app-hero { margin: 0 0 20px; }
/* Nhỏ hơn tên trạm trên tấm biển một bậc rõ ràng. Hai dòng chữ to bằng nhau
   cách nhau hai chục điểm ảnh thì không dòng nào còn là dòng to nhất. */
body.la-app .app-hero h1 {
  margin: 0; font-size: clamp(18.5px, 5.2vw, 23px); line-height: 1.2;
  font-weight: 800; letter-spacing: -.022em;
}
.app-hero-chu { margin: 7px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--muc-mo); }
.app-hero-chu b, .app-hero-chu strong { color: var(--muc); font-weight: 700; }

/* Nhãn nhóm chứ không phải tiêu đề: chữ nhỏ, in hoa, giãn nét. Nó chỉ có
   việc nói mấy ô dưới là gì, không được to bằng câu hero ngay trên. */
.app-nhan-nhom {
  margin: 0 0 10px; font-size: 11.5px; font-weight: 700;
  letter-spacing: .09em; text-transform: uppercase; color: var(--muc-mo);
}

.app-luoi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
@media (min-width: 520px) { .app-luoi { grid-template-columns: repeat(3, 1fr); } }

/* Bản nhỏ của lưới, dùng ở màn hình đầu: ba cột, biểu tượng với tên việc,
   không có dòng số ngày. Ô cao 76px thay vì 116px — sáu việc gói trong hai
   hàng, còn chỗ cho ba khối gấp bên dưới nằm cùng một màn hình. Số ngày làm
   vẫn còn nguyên ở trang từng dịch vụ. Khai sau media query trên kia để
   thắng nó, hai bên cùng một mức đặc hiệu. */
.app-luoi-nho { grid-template-columns: repeat(2, 1fr); gap: 9px; }
@media (min-width: 520px) { .app-luoi-nho { grid-template-columns: repeat(4, 1fr); } }
.app-luoi-nho .app-o {
  flex-direction: row; align-items: center; justify-content: flex-start;
  min-height: 60px; padding: 10px 12px; gap: 10px; text-align: left;
}
/* Biểu tượng ngồi trong một khung bo tròn thay vì thả trôi: tám ô xếp thành
   bốn hàng, không có khung thì tám cái hình line-art nhạt trôi giữa khoảng
   trắng, mắt không bám vào đâu để dò xuống. */
.app-luoi-nho .app-bt {
  flex: none; width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--th-nen);
}
.app-luoi-nho .app-bt .bt { width: 19px; height: 19px; }
.app-luoi-nho .app-ten { margin-top: 0; font-size: 13.5px; line-height: 1.22; }
.app-luoi-nho .app-phu { display: none; }
/* Số dịch vụ lẻ thì ô cuối đứng một mình, nửa hàng còn lại là một lỗ trống
   to bằng cả cái ô. Cho nó chiếm hết hàng. Bốn cột thì lỗ chỉ hở khi ô cuối
   rơi đúng đầu hàng — bắt đúng trường hợp ấy, mấy trường hợp còn lại màn đã
   rộng, một khe hở cuối lưới không thành vấn đề. */
.app-luoi-nho > :last-child:nth-child(odd) { grid-column: 1 / -1; }
@media (min-width: 520px) {
  .app-luoi-nho > :last-child:nth-child(odd) { grid-column: auto; }
  .app-luoi-nho > :last-child:nth-child(4n+1) { grid-column: 1 / -1; }
}

/* Ô vuông cỡ ngón tay: cạnh ngắn nhất vẫn trên 44px kể cả trên máy 320px. */
.app-o {
  display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
  min-height: 116px; padding: 14px 13px;
  background: var(--the); border: 1px solid var(--vien); border-radius: var(--r);
  color: var(--muc); text-decoration: none;
  transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
}
.app-o:active { transform: scale(.97); }
.app-o:hover { border-color: var(--vien-dam); box-shadow: var(--bong); }
.app-bt { display: block; color: var(--sang-muc); }
.app-bt .bt { width: 30px; height: 30px; }
.app-ten { font-weight: 650; font-size: 14.5px; line-height: 1.25; margin-top: auto; }
.app-phu { font-size: 11.5px; color: var(--muc-mo); }
.app-o-hoi { border-style: dashed; }
.app-trong { margin: 22px 4px; color: var(--muc-mo); text-align: center; }

.app-chan {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; align-items: flex-end;
  background: var(--the); border-top: 1px solid var(--vien);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.app-chan a {
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 3px 10px; color: var(--muc-mo); text-decoration: none;
  font-size: 11px; line-height: 1.2; text-align: center;
}
.app-chan a:active { background: var(--th-nen); }
.app-chan a.dang { color: var(--sang-muc); font-weight: 650; }
.app-chan .bt { width: 22px; height: 22px; }

/* Nút giữa nhô hẳn lên khỏi thanh. Vành 4px cùng màu nền trang để nó trông
   như xuyên qua thanh chứ không dán đè lên. */
.app-chan a.app-chan-tron { padding-top: 0; color: var(--muc); font-weight: 650; }
.app-chan-tron .tron {
  flex: none; width: 54px; height: 54px; border-radius: 50%; margin: -24px 0 1px;
  display: flex; align-items: center; justify-content: center;
  background: var(--sang); color: var(--tren-sang);
  border: 4px solid var(--nen); box-shadow: 0 5px 14px rgba(0, 0, 0, .2);
}
.app-chan-tron .tron .bt { width: 25px; height: 25px; stroke-width: 1.9; }
/* Số điện thoại in thẳng dưới nút. Nhỏ hơn nhãn mấy nút kia vì mười chữ số
   phải lọt vào một ô rộng bằng một phần năm màn hình; tabular-nums cho các
   chữ số đều bề ngang, không so le. */
.app-chan a.app-chan-tron { flex-grow: 1.3; }
.app-chan-so {
  font-size: 10.5px; letter-spacing: -.01em; white-space: nowrap;
  font-variant-numeric: tabular-nums; font-weight: 700;
}

/* Bảng soi máy ở /app/kiem. Chữ nhỏ và cho phép ngắt giữa chừng vì cột phải
   chứa cả chuỗi userAgent dài ngoằng lẫn địa chỉ trang. */
.kiem-ds { margin: 0; font-size: 13px; }
.kiem-ds dt { color: var(--muc-mo); margin-top: 10px; }
.kiem-ds dd {
  margin: 1px 0 0; font-weight: 650;
  overflow-wrap: anywhere; word-break: break-word;
}
.app-chan a.app-chan-tron:active { background: none; }
.app-chan a.app-chan-tron:active .tron { filter: brightness(.93); }

/* Web trên điện thoại đeo luôn thanh này — vào bằng trình duyệt hay bằng icon
   ngoài màn hình chính thì thao tác như nhau. Màn hình rộng thì thôi, ở đó đã
   có nav trên đầu và chân trang bốn cột. */
@media (min-width: 761px) { body:not(.la-app) .app-chan { display: none; } }
@media (max-width: 760px) {
  body:not(.la-app) { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
}

/* --- Thẻ mời cài, nổi giữa màn hình ------------------------------------ */
.moi-nen {
  position: fixed; inset: 0; z-index: 59;
  background: rgba(8, 12, 18, .38);
  animation: moi-mo .2s ease both;
}
.moi-cai {
  position: fixed; z-index: 60;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(340px, calc(100vw - 40px));
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 8px; padding: 22px 20px 14px;
  background: var(--the); border: 1px solid var(--vien-dam);
  border-radius: 18px; box-shadow: var(--bong-cao);
  animation: moi-len .26s cubic-bezier(.34, 1.4, .64, 1) both;
}
@keyframes moi-mo { from { opacity: 0; } to { opacity: 1; } }
@keyframes moi-len {
  from { opacity: 0; transform: translate(-50%, -46%) scale(.94); }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
@media (prefers-reduced-motion: reduce) { .moi-cai, .moi-nen { animation: none; } }
/* Chốt chặn thứ hai, không dính gì tới JavaScript: màn hình rộng thì thẻ mời
   cài không có cửa hiện, kể cả khi đoạn script trên kia tính sai. Lời mời chỉ
   dành cho máy cầm tay. */
@media (min-width: 1025px) { .moi-cai, .moi-nen { display: none !important; } }

.moi-anh { display: flex; }
.moi-anh svg { width: 52px; height: 52px; }
.moi-cai b { font-size: 18px; line-height: 1.25; letter-spacing: -.01em; }
.moi-cai > span { font-size: 13px; color: var(--muc-mo); line-height: 1.45; }
.moi-cai .moi-nut {
  width: 100%; margin-top: 6px; padding: 15px 18px;
  font-size: 16px; min-height: 52px;
}
.moi-sau {
  background: none; border: none; cursor: pointer; padding: 5px 10px;
  font-size: 13px; color: var(--muc-mo); text-decoration: underline;
}
.moi-sau:hover { color: var(--muc); }
.moi-dong {
  position: absolute; top: 5px; right: 7px;
  width: 32px; height: 32px; padding: 0; line-height: 1;
  font-size: 22px; background: none; border: none; cursor: pointer; color: var(--muc-mo);
}
.moi-dong:hover { color: var(--muc); }

/* Hai bước của iPhone. Vẽ đúng biểu tượng Chia sẻ vì khách phải nhận ra nó
   trên thanh dưới của Safari, không phải đoán từ chữ. */
.moi-ios { width: 100%; margin-top: 2px; display: flex; flex-direction: column; gap: 9px; }
.moi-ios p {
  margin: 0; display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; line-height: 1.35; text-align: left;
}
.moi-so {
  flex: none; width: 21px; height: 21px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font: 700 11px/1 "JetBrains Mono", ui-monospace, monospace;
  background: var(--sang); color: var(--tren-sang);
}
.moi-ios-bt {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--th-nen); color: var(--th);
}
.moi-ios-bt .bt { width: 17px; height: 17px; }
.moi-mui {
