    display: block; position: fixed; inset: 0; z-index: 55;
    background: rgba(8, 12, 18, .45);
  }
  /* Menu mở thì khoá cuộn nền: kéo trong ngăn kéo mà trang sau lưng cũng
     chạy theo là mất phương hướng. */
  body.qt-mo { overflow: hidden; }

  .qt-than { min-height: 0; }
  .qt-noi { padding: 18px 14px calc(78px + env(safe-area-inset-bottom, 0px)); }

  .qt-thanh {
    display: grid; grid-template-columns: repeat(4, 1fr);
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--the); border-top: 1px solid var(--vien);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .qt-thanh a {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    min-width: 0; padding: 9px 3px 10px; text-decoration: none;
    color: var(--muc-mo); font-size: 11.5px; line-height: 1.2; text-align: center;
  }
  .qt-thanh a.dang { color: var(--sang-muc); font-weight: 650; }
  .qt-thanh a:active { background: var(--th-nen); }
  .qt-thanh .bt { width: 22px; height: 22px; }
  /* Đầu trang gọn lại: trong app không có thanh địa chỉ nên dòng này là tất
     cả những gì thấy trên đỉnh — để nó cao ba dòng là phí màn hình. */
  .qt-noi .qt-dau-trang h1 { font-size: 22px; }
}

/* Bảng đơn thành thẻ. Chỉ ở khổ hẹp nhất: từ 680px trở lên bảng chín cột vẫn
   đọc được, mà thẻ thì cao gấp bốn. */
@media (max-width: 680px) {
  .bang-the thead { display: none; }
  .bang-the, .bang-the tbody, .bang-the tr, .bang-the td { display: block; width: 100%; }
  .bang-the tr {
    border: 1px solid var(--vien); border-radius: var(--r);
    padding: 10px 13px; margin-bottom: 10px; background: var(--the);
  }
  .bang-the tr:last-child { margin-bottom: 0; }
  .bang-the td {
    display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    border: none; padding: 3px 0; text-align: right;
  }
  /* Tên cột lấy thẳng từ data-n trên ô — bảng và thẻ dùng chung một nguồn
     chữ, sửa tên cột ở template là cả hai đổi theo. */
  .bang-the td::before {
    content: attr(data-n); flex: none; text-align: left;
    color: var(--muc-mo); font-size: 12.5px; font-weight: 500;
  }
  /* Ô đầu KHÔNG có data-n là tên của cả thẻ (mã đơn, tên vật tư, tiêu đề
     bài): to, không nhãn, gạch chân tách khỏi phần thân. Bảng nào ô đầu cũng
     cần nhãn mới hiểu (sổ tiền mở bằng cột Ngày) thì cứ gắn data-n, thẻ thành
     một danh sách nhãn phẳng, không có dòng tiêu đề. */
  .bang-the td:first-child:not([data-n]) {
    display: block; text-align: left; padding-bottom: 8px; margin-bottom: 6px;
    border-bottom: 1px solid var(--vien); font-size: 16px;
  }
  /* Ô trống thì bỏ hẳn dòng. Bảng có cột Thu và cột Chi, mỗi khoản chỉ dùng
     một trong hai — in cả nhãn "Thu" rỗng lên thẻ là bắt đọc một dòng không
     mang tin gì. */
  .bang-the td:empty { display: none; }
  /* Dòng "chưa có gì" trải hết bảng: không phải tiêu đề thẻ, đừng kẻ gạch. */
  .bang-the td[colspan] {
    justify-content: flex-start; border-bottom: none;
    margin-bottom: 0; font-size: inherit;
  }
  /* Ô nhập trong thẻ ăn hết phần bên phải. Không có luật này thì input co
     lại bằng cỡ mặc định của trình duyệt, gõ ngày vào không nhìn thấy. */
  .bang-the td input:not([type="checkbox"]):not([type="radio"]),
  .bang-the td select, .bang-the td textarea { width: 100%; }
  .bang-the td:has(input[type="date"]), .bang-the td:has(input[type="text"]),
  .bang-the td:has(input:not([type])), .bang-the td:has(select), .bang-the td:has(textarea) {
    display: block; text-align: left;
  }
  .bang-the td:has(input[type="date"])::before, .bang-the td:has(input[type="text"])::before,
  .bang-the td:has(input:not([type]))::before, .bang-the td:has(select)::before,
  .bang-the td:has(textarea)::before { display: block; margin-bottom: 3px; }
  /* Ô nút (Xoá, Đã trả) không có nhãn: cho nút tự trải, ngón tay bấm dễ hơn
     là một nút con con nép ở mép phải. */
  .bang-the td:not([data-n]):not(:first-child) { padding-top: 8px; }
  .bang-the td:not([data-n]) .nut-nho { width: 100%; }
  .bang-the td .nho.mo.so { display: inline; margin-left: 6px; }
  /* Ô "hẹn trả" mang sẵn class chip để nổi lên giữa bảng. Kéo rộng cả dòng
     thì nó thành một vệt hồng dài — bỏ nền, giữ đúng màu chữ báo trễ. */
  .bang-the td.chip { background: none; border: none; border-radius: 0; font-weight: 650; }
  .bang-the .cuon, .cuon:has(.bang-the) { overflow: visible; }
  /* Hàng ngang trong form: ô nào không tự khai là hẹp thì cho ăn trọn bề
     ngang. Nhét ba ô cạnh nhau trên màn 390px thì ô nào cũng bé quá không
     gõ được. */
  .hang > *:not(.co-hep):not(button) { flex-basis: 100%; }
}

/* Màn "mất mạng" của app quản lý (ui/qt-matmang.html). */
.mm { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.mm-o { max-width: 380px; text-align: center; display: grid; gap: 12px; justify-items: center; padding: 30px 24px; }
.mm-o h1 { font-size: 22px; letter-spacing: -.02em; }
.mm-o p { font-size: 14px; color: var(--muc-mo); line-height: 1.55; margin: 0; }
.mm-bt .bt { width: 40px; height: 40px; color: var(--muc-mo); }
.mm-o .nut { margin-top: 8px; }
{{/* Đơn vị đo đi sau con số. Chữ "g" cùng cỡ 42px mà lại là font mono thì dấu
     cách rộng bằng cả một ký tự — nhìn thành hai thứ rời nhau. */}}
.bang-so .v i {
  font-style: normal; font-size: .5em; margin-left: .1em;
  color: var(--muc-mo); letter-spacing: 0;
}

/* --- Hero kiểu tấm phủ: chữ lớn bên trái, hình vẽ lớn bên phải -------------
   Tham chiếu dựng hero bằng một đoạn phim quay thật. Chưa có phim thì chỗ đó
   phải có thứ khác giữ được nửa màn hình — ở đây là bản vẽ cây vợt cỡ lớn,
   nét tự chạy khi tải trang. Hình vẽ không thay được phim, nhưng nó nói được
   một điều mà ảnh chụp không nói được: bên trong cây vợt có gì. */
.hero-lon > .khung {
  padding: clamp(40px, 5vw, 78px) clamp(24px, 4vw, 56px) clamp(44px, 5vw, 74px);
  background: radial-gradient(120% 130% at 78% 8%, #191532 0%, #110E22 46%, #090814 100%);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 26px;
}
@media (max-width: 680px) { .hero-lon > .khung { border-radius: 18px; } }
.hero-lon h1 { max-width: 15ch; margin-top: 20px; color: #fff; }
.hero-lon .dan { max-width: 46ch; }
.hero-lon .hero-nut { margin-top: 34px; }
/* Hai cột: trái là chữ RỒI ảnh xếp dọc, phải là danh sách việc bắt đầu ngay
   từ đỉnh. Bố cục cũ nhét cả ảnh lẫn danh sách việc vào cột phải, chồng lên
   nhau — cộng lại cao hơn một màn hình, mà ảnh thì bị bóp còn bằng con tem.
   Tách ra: danh sách việc giữ cột phải, ảnh xuống dưới chữ nên rộng gần hết
   bề ngang. */
.hero-canh { display: grid; gap: 34px; align-items: start; }
/* Cột việc 340px vừa đủ cho tên việc dài nhất ("Tinh chỉnh cân bằng bằng lead
   tape") không xuống dòng. */
@media (min-width: 980px) {
  .hero-canh { grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 40px; }
}
.hero-trai { display: grid; gap: clamp(24px, 3vh, 40px); min-height: 0; }
.hero-trai > * { min-width: 0; }
{{/* min-width:0 là bắt buộc, không phải cho đẹp. Ô lưới mặc định rộng tối thiểu
     bằng nội dung, mà SVG hero có kích thước gốc 440px — trên màn 430px thì cả
     trang bị đẩy tràn ngang, chữ cột trái cụt mất mép phải. */}}
.hero-canh > * { min-width: 0; }
/* --- Danh sách việc trong hero -------------------------------------------
   Kính mờ chứ không phải thẻ đặc: hero có ảnh trạm làm nền, đặt một tấm đục
   lên là che mất thứ đắt nhất của trang. Nền mờ 12% cho chữ đủ tương phản mà
   ảnh vẫn xuyên qua. */
.hero-dv {
  display: grid; gap: 1px;
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.22);
  border-radius: var(--r); overflow: hidden;
  backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
}
.hero-dv-dinh {
  background: rgba(255,255,255,.10); padding: 12px 16px;
  font: 700 10.5px/1.4 "Roboto Mono", monospace;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--sang-tren-toi, var(--sang));
}
.hero-dv a {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 16px; background: rgba(12,16,32,.42);
  color: #fff; text-decoration: none; font-size: 14.5px; font-weight: 600;
  transition: background .16s, padding-left .16s;
}
/* Mũi tên vẽ bằng ::after chứ không phải ký tự: font hệ thống trên Windows
   hay thay → bằng một ô vuông. */
.hero-dv a::after {
  content: ""; flex: none; width: 7px; height: 7px;
  border-top: 2px solid var(--sang-tren-toi, var(--sang));
  border-right: 2px solid var(--sang-tren-toi, var(--sang));
  transform: rotate(45deg); opacity: .75;
}
.hero-dv a:hover { background: rgba(12,16,32,.66); padding-left: 21px; }
.hero-dv a:hover::after { opacity: 1; }
.hero-dv a:focus-visible { outline: 2px solid var(--sang-tren-toi); outline-offset: -3px; }
.hero-dv-het { font-size: 13px !important; font-weight: 500 !important; color: var(--tren-dam-mo) !important; }
.hero-dv-het:hover { color: #fff !important; }
@media (max-width: 680px) {
  .hero-dv a { padding: 12px 14px; font-size: 14px; }
}
.hero-trai .sv { max-width: 460px; margin: 0 auto; }

/* --- Băng ảnh hero --------------------------------------------------------
   Thay chỗ bản vẽ khi trạm đã up ảnh thật. Khung cố định tỉ lệ 4:3 và ảnh
   cắt theo object-fit: ảnh thợ chụp bằng điện thoại đủ mọi tỉ lệ, để nguyên
   thì mỗi lần đổi ảnh là hero nhảy cao nhảy thấp một kiểu. */
/* Không còn trần chiều ngang: ảnh giờ chiếm gần hết cột trái. Chiều cao mới
   là thứ phải chặn, và chặn ở khối hero-cao-một-màn bên dưới. */
.hero-trai .bang-anh { width: 100%; }
.bang-anh-khung {
  position: relative; aspect-ratio: 4 / 3; overflow: hidden;
  border-radius: 18px; border: 1px solid rgba(255,255,255,.13);
  background: rgba(255,255,255,.05);
  box-shadow: var(--bong-cao);
}
.ba-o {
  position: absolute; inset: 0; margin: 0;
  opacity: 0; transition: opacity .7s ease;
}
.ba-o.hien { opacity: 1; }
.ba-o img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Chú thích nằm trên ảnh: ảnh nào cũng có chỗ sáng chỗ tối, nên phải có vệt
   tối đổ lên chứ không thể trông chờ vào màu ảnh. */
.ba-o figcaption {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 34px 16px 13px; font-size: 13.5px; line-height: 1.45; color: #fff;
  background: linear-gradient(180deg, transparent, rgba(3,8,4,.86));
}
/* Chấm chỉ 8px, nhưng vùng bấm phải đủ 24x24 (WCAG 2.5.8 Target Size). Cách
   nới: viền TRONG SUỐT 8px cộng background-clip: content-box — nền chỉ tô ô
   nội dung nên chấm vẫn 8px, còn ô nhận ngón tay đã là 24x24. Viền đã tạo
   khoảng cách sẵn nên gap về 0, và margin-top bù lại 8px viền phía trên. */
.ba-cham { display: flex; gap: 0; justify-content: center; margin-top: 6px; }
.ba-cham button {
  -webkit-appearance: none; appearance: none;
  box-sizing: content-box;
  width: 8px; height: 8px; min-width: 0; padding: 0; margin: 0;
  border: 8px solid transparent; background-clip: content-box;
  border-radius: 999px; cursor: pointer; font-size: 0;
  background-color: rgba(255,255,255,.3);
  transition: width .25s ease, background-color .25s ease;
}
.ba-cham button.day { width: 22px; background-color: var(--sang); }

/* Nét chạy dần khi tải trang. Mỗi nét mang pathLength="1", nghĩa là trình duyệt
   coi đường nào cũng dài đúng 1 đơn vị — nhờ vậy một luật dasharray duy nhất
   chạy đúng cho cả nét ngắn lẫn nét dài, không phải đo từng đường. */
@keyframes ve-net { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes hien-dan { from { opacity: 0; } to { opacity: 1; } }
.sv-ve .net {
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: ve-net 1.5s cubic-bezier(.6,.05,.3,1) forwards;
}
.sv-ve .cham { animation: hien-dan .8s ease 1.15s both; }
.sv-ve .lop2 { animation-delay: .35s; }
.sv-ve .lop3 { animation-delay: .7s; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .sv-ve .net { stroke-dashoffset: 0; }
  .sv-ve .cham { opacity: 1; }
}
body header.dau { background: var(--th-dam); border-bottom: 1px solid rgba(255,255,255,.10); }
body .hero-lon > .khung {
  background: radial-gradient(120% 130% at 78% 8%, var(--th-2) 0%, var(--th-dam) 74%);
  border: 1px solid rgba(255,255,255,.10);
}

/* Đo trên trang mẫu: tiêu đề Manrope 72px/700 line-height 1.2, thân Inter
   18px/500 — thân bài to hơn hẳn mức thường; nút bo 12px, đệm 14px 24px, nét
   500; khối thở 150px/150px; và điểm riêng nhất: các ô KHÔNG có bóng, KHÔNG
   có viền — chúng là những MẢNG MÀU PHẲNG luân phiên (chàm / vàng nắng / kem).
   Bộ này vì thế đi ngược cả năm bộ kia: mềm, to, phẳng. */
body {
  --r: 14px; --r-nho: 10px; --r-lon: 22px;
  font-size: 17px;
}
body h1 { font-size: clamp(33px, 5vw, 58px); line-height: 1.16; letter-spacing: -.026em; font-weight: 700; }
body h2 { font-size: clamp(24px, 3vw, 36px); line-height: 1.18; letter-spacing: -.022em; font-weight: 700; }
body .nut { border-radius: 12px; padding: 15px 24px; font-size: 16px; font-weight: 600; }
body .nut-nho,
body .dau-trong nav a.nut-nho { border-radius: 10px; }
body .dau-trong nav a { border-radius: 10px; }
body .dv-the .bt-o { border-radius: 14px; }
body section { padding: 100px 0; }
/* Mẫu chia khối bằng khoảng trống lớn, không bằng đường kẻ. */
body section + section { border-top: none; }
body .the { border: none; box-shadow: none; background: var(--nen-2); border-radius: 14px; }
body .luoi-vach,
body .buoc {
  background: none; border: none; box-shadow: none; border-radius: 0; gap: 16px;
}
body .luoi-vach > *,
body .buoc > div { border-radius: 14px; }
/* Ba màu luân phiên như mẫu. nth-child chứ không phải class vì HTML dùng
   chung cho mọi giao diện — không đổi template chỉ để đổi màu ô.
   Ô thứ ba KHÔNG lấy --nen-2: nền trang của bộ này đã là kem, hai màu trùng
   nhau nên ô thứ ba trông như một lỗ thủng giữa lưới. Pha vàng nắng vào nền
   thẻ cho nó là một mảng thật. */
body .luoi-vach > *:nth-child(3n+2) { background: var(--th-nen); }
body .luoi-vach > *:nth-child(3n) { background: color-mix(in srgb, var(--sang) 15%, var(--the)); }
body .buoc > div { background: var(--nen-2); }
body .luoi-vach .dv-the:hover {
  background: color-mix(in srgb, var(--sang) 30%, var(--the)); box-shadow: none;
}
/* Nút "Tra cứu đơn" nằm sẵn trong <nav> nên nó tự đi xuống tầng hai cùng các
   link — đúng chỗ cần, không phải kéo ra góc phải. */

/* --- kem: khung rộng 1296px, hero một cột căn trái, hình thành băng dưới -- */
/* Đo được: cột nội dung của mẫu webflow rộng 1296px chứ không phải 1140, và
   hero cao đúng một màn hình với chữ bắt đầu ở x=72 — tức chữ chạy hết bề
   ngang cột, không có hình đứng cạnh. */
/* width: calc(100% - 40px) chứ không chỉ max-width. Màn 1280px mà khung rộng
   1296px thì khung chạm hai mép: tấm hero mất bo góc, nút "Tra cứu đơn" ở đầu
   trang bị cắt cụt. Có dòng width thì máy nào hẹp hơn 1336px vẫn còn lề. */
body .khung { max-width: 1296px; width: calc(100% - 40px); }
@media (min-width: 980px) {
  /* Hai cột chứ không còn một: cột phải giờ có danh sách việc bấm được,
     để một cột thì nó rơi xuống dưới ảnh và khách phải kéo mới thấy —
     đúng cái phải sửa. Cột phải 360px vừa đủ cho tên việc dài nhất
     ("Tinh chỉnh cân bằng bằng lead tape") không xuống dòng. */
  /* Không chặn bề ngang cột trái: chặn 980px là chặn luôn băng ảnh, mà ảnh
     to là thứ Kendy yêu cầu. Bề ngang chữ đã có h1/dan tự chặn theo số ký
     tự — đó mới là chỗ cần chặn để còn đọc được. */
  body .hero-lon h1 { max-width: 20ch; }
  body .hero-trai .sv { max-width: 560px; width: 100%; margin: 0; }
  body .hero-lon > .khung { padding-block: clamp(48px, 5vw, 76px); }
}

/* --- Tấm hero phải nằm gọn trong MỘT màn hình ---------------------------- */
/* Đây là lần sửa thứ ba. Hai lần trước hỏng vì cùng một sai lầm: tôi ĐOÁN chỗ
   trống còn lại rồi ghi thẳng con số vào CSS.

   - Lần 1: height cứng + minmax(0,1fr). Gặp .hero > .khung { overflow: hidden }
     (css.html:340) thì phần thừa bị CẮT chứ không đẩy trang dài ra — mất hẳn
     hàng nút mà không có thanh cuộn nào báo.
   - Lần 2: bỏ height, đo riêng băng ảnh bằng calc(100svh - 580px). Sai hai chỗ:
     580px là con số tôi nhẩm, mà chiều cao khối chữ lại đổi theo BỀ NGANG cửa
     sổ — cửa sổ hẹp thì h1 xuống ba dòng, mọi con số nhẩm sẵn đều lệch.
   - Và cái không ai ngờ: `body section { padding: 100px 0 }` áp cho MỌI
     section, hero là <section> nên dính đủ 200px trên dưới. Tôi trừ 92px trong khi thực tế phải trừ gần 300px.

   Lần này không đoán nữa. Khung có chiều cao xác định để hàng 1fr có mốc chia,
   CỘNG min-height: fit-content làm van an toàn — chữ dài quá thì khung tự cao
   thêm, nên overflow: hidden không còn gì để cắt. Ảnh nhận đúng phần CÒN DƯ,
   bao nhiêu cũng được, không cần ai nhẩm hộ. Đúng thứ tự đã chốt: co ảnh
   trước, chữ nhỏ lại chút, không bỏ khối nào. */
@media (min-width: 980px) {
  /* Gỡ 200px đệm mà luật nền phát cho mọi section. Hero là tấm duy nhất bắt
     buộc nằm gọn một màn; 200px khoảng trắng ở đây là một phần sáu màn hình. */
  body .hero-lon { padding: 24px 0 0; }

  body .hero-lon > .khung {
    display: grid;
    /* 108px = dải đầu trang (~80px) + đệm trên vừa đặt lại (24px). Trần 1040px
       để trên màn 2K ảnh đừng kéo thành tấm dọc — cắt dọc là mất cả cây vợt. */
    height: min(calc(100vh - 108px), 1040px);
    height: min(calc(100svh - 108px), 1040px);
    min-height: -webkit-fit-content;
    min-height: fit-content;
    padding-block: clamp(22px, 2.8vh, 54px);
  }
  /* stretch để cột trái cao bằng khung — có thế hàng 1fr bên trong nó mới có
     mốc mà chia. Riêng danh sách việc giữ align-self: start, không thì tấm
     kính mờ bị kéo dài xuống tận đáy trong khi chỉ có tám dòng chữ. */
  body .hero-canh { align-items: stretch; }
  body .hero-canh > .hero-dv { align-self: start; }

  /* Sàn 150px: ảnh có thể co, nhưng biến mất hẳn thì hero còn mỗi chữ. Chạm
     sàn rồi mà vẫn chật thì fit-content ở trên cho khung cao thêm — cuộn một
     quãng ngắn, chứ không cắt. */
  body .hero-trai {
    grid-template-rows: auto minmax(150px, 1fr);
    gap: clamp(16px, 2.2vh, 32px);
  }
  body .hero-trai > .bang-anh {
    display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0;
  }
  /* Bỏ tỉ lệ 4:3: chiều cao giờ do ô lưới cấp, ảnh cắt theo object-fit như cũ. */
  body .hero-trai .bang-anh-khung {
    aspect-ratio: auto; height: 100%; min-height: 0;
  }

  /* 46ch là bề ngang của bố cục MỘT cột cũ. Cột trái giờ rộng chừng 920px, giữ
     46ch nghĩa là đoạn mô tả chỉ dùng non nửa chiều ngang rồi đổ xuống bảy
     dòng — ăn mất đúng phần đất của băng ảnh. Nới ra là bớt được hai dòng mà
     không cắt chữ nào. Bộ tim để yên: nó canh giữa, dòng dài quá đọc mỏi mắt. */
  body .hero-lon .dan { max-width: 68ch; }

  /* Dòng chữ to nhất trang đang 58px — trên màn rộng nó chiếm gần một phần ba
     chiều cao hero, đẩy ảnh và cả địa chỉ xuống. Hạ xuống 44px vẫn là thứ to
     nhất trang, mà lấy lại được chỗ cho hai dòng mới. Nới max-width theo, không
     thì chữ bé đi lại rơi thành ba dòng — chẳng tiết kiệm được gì. */
  body .hero-lon h1 { font-size: clamp(30px, 3.3vw, 44px); max-width: 24ch; }

  /* Bản vẽ giữ chỗ lúc chưa up ảnh: cùng ô lưới ấy, giữ tỉ lệ gốc. */
  body .hero-trai > .sv-ve {
    min-height: 0; display: grid; align-content: center; justify-items: center;
  }
  body .hero-trai > .sv-ve > svg { max-height: 100%; width: auto; }
}

/* Màn thấp: chữ nhỏ lại theo chiều cao màn. 880px là chỗ bắt đầu chật — trên
   mức đó cỡ chữ gốc vẫn vừa, dưới mức đó mà giữ nguyên thì riêng khối chữ đã
   ăn hết màn, ảnh chạm sàn rồi vẫn phải cuộn. */
@media (min-width: 980px) and (max-height: 880px) {
  body .hero-lon h1 { font-size: clamp(28px, 4.2vh, 44px); }

  body .hero-lon .dan { font-size: clamp(14.5px, 1.9vh, 17px); line-height: 1.55; }

  body .hero-lon .hero-nut { margin-top: clamp(16px, 2.6vh, 34px); }

  /* Màn càng thấp thì càng phải nới ngang: mỗi dòng bớt đi là hai chục pixel
     trả lại cho băng ảnh. */
  body .hero-lon .dan { max-width: 76ch; }
}

/* Laptop 1366x768 và các màn còn thấp hơn: hạ sàn băng ảnh xuống 110px. Giữ
   150px ở đây thì riêng phần chênh ấy đã đủ đẩy hero quá một màn. */
@media (min-width: 980px) and (max-height: 760px) {
  body .hero-trai { grid-template-rows: auto minmax(110px, 1fr); }
}

/* kem: ba mảng màu rời nhau, bo góc to, không viền không bóng — cùng công thức
   với lưới dịch vụ của bộ này. */
body .bang-so-luoi {
  background: none; border: none; box-shadow: none; gap: 16px;
  grid-template-columns: 1fr;
}
@media (min-width: 700px) { body .bang-so-luoi { grid-template-columns: repeat(3, 1fr); } }
body .bang-so-luoi > div { border-radius: var(--r); padding: 26px 28px; }
body .bang-so-luoi > div:nth-child(2) { background: var(--th-nen); }
body .bang-so-luoi > div:nth-child(3) { background: color-mix(in srgb, var(--sang) 15%, var(--the)); }

/* kem: đảo tỉ lệ — hình rộng hơn chữ. Khung bộ này đã 1296px nên bản vẽ có chỗ
   để thở, và đó là thứ duy nhất trên trang chưa được dùng to. */
@media (min-width: 900px) {
  body .doi-hinh { grid-template-columns: minmax(0, 1fr) minmax(0, .74fr); gap: 56px; }
  body .hinh-o { border-radius: 22px; padding: 30px; }
}

/* --- 3. Khối "tiêu đề rồi tới nội dung" ----------------------------------- */
/* Gốc (css.html:237): .doc-lon xếp dọc, tiêu đề trên, nội dung dưới. Dùng ở ba
   mục: bảng dịch vụ, bốn bước, ba cam kết — nên đổi một dòng là đổi ba mục. */

/* kem và do: tiêu đề tách sang một cột trái, nội dung chạy bên phải. Đây là
   đòn đổi dáng trang mạnh nhất trong cả khối này vì nó ăn vào ba mục một lúc.
   Chỉ hai bộ được dùng: kem có khung 1296px và do có lưới một cột, cả hai còn
   chỗ cho cột trái. Bốn bộ kia lưới 3-4 cột, cắt thêm 300px là ô bẹp dí.
   CHÚ Ý: chỉ ăn khi con ĐẦU của .doc-lon thật sự là khối tiêu đề (nhận ra qua
   .nhan-vach bên trong). Bốn trang — dịch vụ, quy trình, bài viết, tra cứu —
   đặt thẳng lưới vào con đầu, không có tiêu đề; thiếu chốt :has() thì lưới bị
   nhét vào cột 320px và thẻ bẹp còn 96px, mỗi dòng một chữ. */
@media (min-width: 1000px) {
  body .doc-lon:has(> *:first-child .nhan-vach) { grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 48px; align-items: start; }
}

/* kem: 2x2, các ô rời nhau bo góc to, màu luân phiên. */
body .buoc { background: none; border: none; box-shadow: none; gap: 16px; }
@media (min-width: 760px) { body .buoc { grid-template-columns: repeat(2, 1fr); } }
body .buoc > div { border-radius: var(--r); padding: 28px 26px; }
body .buoc > div:nth-child(2n) { background: var(--th-nen); }

/* kem: ba mảng màu luân phiên, không viền. */
body .cam-ket { gap: 16px; }
body .cam-ket .the { border: none; border-radius: var(--r); padding: 26px 28px; }
body .cam-ket .the:nth-child(2) { background: var(--th-nen); }
body .cam-ket .the:nth-child(3) { background: color-mix(in srgb, var(--sang) 15%, var(--the)); }

/* kem: một cột, form chạy hết khung 1296px, hai thẻ phụ thành hai mảng rộng
   bên dưới. */
@media (min-width: 900px) {
  body .doi-cot:not(:has(> .bai)):not(:has(.dv-doc)) { grid-template-columns: minmax(0, 1fr); }
  body .doi-cot:not(:has(> .bai)):not(:has(.dv-doc)) > .canh { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
}

/* Trang bài viết là ngoại lệ: nó KHÔNG có form, và thân bài bị chốt ở 65ch cho
   dễ đọc. Nếu để nó chạy hết khung 1296px thì chữ vẫn 65ch còn nửa phải trống
   trơn, còn hai thẻ phụ rơi xuống tận cuối bài. Nên giữ đúng hai cột: chữ neo
   trái, khối phụ neo phải thẳng mép hero, khoảng giữa là lề ấn phẩm. */
@media (min-width: 900px) {
  body .doi-cot:has(> .bai) {
    grid-template-columns: minmax(0, 65ch) minmax(0, 340px);
    justify-content: space-between; gap: 48px;
  }
}
@media (min-width: 900px) {
  body footer .cot { grid-template-columns: 2fr 1fr 1fr; gap: 40px; }
}


/* ==========================================================================
   CHUYỂN ĐỘNG
   --------------------------------------------------------------------------
   Ba thứ, không hơn: nút và thẻ nhấc lên khi rê chuột, mỗi khối nội dung trôi
   lên một quãng ngắn khi cuộn tới, và vệt sáng trên hero thở rất chậm. Trang
   bán hàng cần thấy sống, nhưng thứ nhảy múa quá tay thì đọc mệt, và trên máy
   yếu là giật — mà khách của trạm phần lớn mở bằng điện thoại giữa sân.

   Cả khối này tự tắt trong @media (prefers-reduced-motion: reduce) phía trên,
   vì rule ở đó dùng !important.
   ========================================================================== */
.nut,
.dv-the,
.the,
.bt-o,
.phieu {
  transition: transform .18s ease, box-shadow .22s ease,
              background-color .18s ease, border-color .18s ease, color .18s ease;
}
.nut-chinh:hover,
.nut-vien:hover { transform: translateY(-2px); }
.nut-chinh:active,
.nut-vien:active { transform: translateY(0); }
.nut-chinh:hover {
  box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--sang) 70%, transparent);
}
.dv-the:hover { transform: translateY(-3px); }
/* Trong lưới có vạch ngăn thì thẻ không được nhấc: nhấc lên là hở vạch. */
.luoi-vach .dv-the:hover { transform: none; }

/* Vệt sáng hero thở. 16 giây một nhịp — chậm tới mức không ai bắt được nó
   đang động, chỉ thấy tấm hero không chết cứng. Chỉ animate opacity: ::before
   phủ inset:0 nên scale sẽ tràn khỏi bo góc. */
@keyframes tho-sang { 0%,
100% { opacity: .82; } 50% { opacity: 1; } }
.hero-lon > .khung::before { animation: tho-sang 16s ease-in-out infinite; }

/* Khối nội dung trôi lên khi cuộn tới.
   Trạng thái ẩn ban đầu CHỈ bật khi JS đã chạy và đã gắn class lên body —
   không có JS (hoặc JS lỗi) thì trang vẫn hiện đủ chữ. Ẩn bằng CSS thuần rồi
   trông chờ JS hiện ra là cách nhanh nhất để có một trang trắng. */
@keyframes troi-len { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
body.js-troi .troi { opacity: 0; }
body.js-troi .troi.vao { animation: troi-len .55s cubic-bezier(.22,.68,.36,1) both; }


/* ==========================================================================
   ẢNH, TRANG TRÍ VÀ CHUYỂN ĐỘNG — RIÊNG TỪNG BỘ
   --------------------------------------------------------------------------
   Khối này sinh ra từ một lần bị trả lại: "nó vẫn chỉ là thay màu sắc thôi mà".
   Đo lại thì đúng thật. Trước khối này cả bảy bộ dùng CHUNG bốn @keyframes
   (ve-net, hien-dan, tho-sang, troi-len) và chung đúng một luật rê chuột —
   nghĩa là màu khác, dáng khác, bố cục khác, nhưng trang ĐỘNG y hệt nhau.
   Đo ba mẫu gốc bằng scratchpad/hieuung.js:

     mẫu Compair (cobalt)   30 ảnh · 368 transition · 40 keyframes · WOW+Swiper
     mẫu Gogrin  (đỏ)       12 ảnh · 491 transition · 40 keyframes · WOW+Swiper
     mẫu RepairPress (biển) 12 ảnh ·  79 transition · 11 keyframes · không thư viện
     trang mình               3 ảnh ·  30 transition ·  4 keyframes

   Ba con số đầu tiên mới là chỗ chênh lệch thật: ẢNH. Mẫu nào cũng 12-30 tấm,
   mình có 3 tấm line-art xanh volt dùng chung cho cả bảy bộ. Không có ảnh thì
   sáu trang chỉ còn là sáu cách xếp chữ, mà xếp chữ thì nhìn lướt qua giống
   nhau hết.

   Nên khối này làm ba việc, theo đúng thứ tự sức nặng:

   1. ẢNH. Mỗi bộ hai tấm riêng, nhúng trong binary ở ui/anh/, phục vụ qua
      /anh-gd/{ten}. Gắn bằng background-image chứ không phải thẻ <img>: HTML
      không phải đổi một chữ, và mỗi bộ tự chọn tấm của mình. Ảnh lấy ở
      Unsplash — giấy phép cho dùng thương mại, không bắt ghi nguồn. Đây là
      ảnh ĐỆM: Kendy up ảnh trạm thật vào /qt/anh-trang-chu thì ảnh thật
      thắng ở tấm đầu trang, mấy chỗ còn lại vẫn là ảnh kho cho tới khi có đủ.

   2. TRANG TRÍ. Mỗi bộ một món, không bộ nào trùng bộ nào:
        cobalt  băng ảnh phủ kín dưới dải số
        điện    số to hơn nữa, ảnh làm nền rất mờ sau ba cam kết
        biển    tấm đè lấn — hình có một tấm phẳng lệch 22px sau lưng
        kem     huy hiệu tròn thay ô vuông, băng ảnh ấm ở chân trang
        đỏ      dải ảnh trạm làm kết cấu sau bốn bước
        cam     đường cắt chéo trên tấm đầu trang, ảnh chạy hết bề ngang

   3. CHUYỂN ĐỘNG. Mỗi bộ một hướng hiện, một nhịp, một kiểu rê chuột. Nhịp
      là thứ ít ai gọi tên được nhưng nhận ra ngay: đỏ nảy trong 0.1s, kem
      trôi 0.42s. Cùng một trang, hai cảm giác khác nhau.

   Ba luật giữ khối này không thành trang trí rởm:
     · Chữ trên ảnh luôn có màn lọc bằng chính --th của bộ, đủ dày để tỉ lệ
       tương phản không rơi. Ảnh chỉ được nằm dưới chữ khi có màn lọc.
     · Dưới 900px mọi kiểu cắt chéo/chia đôi đều rơi về "ảnh phủ kín + màn lọc
       dày", vì ở đó chữ chạy hết bề ngang, không còn nửa nào trống để đặt ảnh.
     · Cả khối tự tắt trong prefers-reduced-motion nhờ rule * !important ở trên.
   ========================================================================== */

/* --- Từ vựng chuyển động dùng chung -------------------------------------- */
/* Ảnh nền thở rất chậm. Chỉ transform, không đụng background-size: đổi
   background-size là trình duyệt vẽ lại ảnh mỗi khung hình, điện thoại giữa
   sân là giật ngay. */
@keyframes anh-tho { from { transform: scale(1); } to { transform: scale(1.07); } }

@keyframes troi-trai { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
@keyframes troi-phai { from { opacity: 0; transform: translateX(26px);  } to { opacity: 1; transform: none; } }
@keyframes troi-no   { from { opacity: 0; transform: scale(.945);       } to { opacity: 1; transform: none; } }
@keyframes troi-mo   { from { opacity: 0;                               } to { opacity: 1; } }
@keyframes troi-roi  { from { opacity: 0; transform: translateY(-22px); } to { opacity: 1; transform: none; } }
/* Quét từ trái sang như kéo tờ giấy ra khỏi máy in. Giữ opacity 1 suốt vì
   thứ tạo hiệu ứng là mép cắt, mờ thêm nữa thì mất luôn cái mép ấy. */
@keyframes troi-quet { from { opacity: 1; clip-path: inset(0 100% 0 0); } to { opacity: 1; clip-path: inset(0 0 0 0); } }


/* --- KEM: huy hiệu tròn, băng ảnh ấm ở chân trang ------------------------- */
/* Nửa trái đặc màu tới mốc 46% rồi loãng dần — ảnh gỗ ấm chỉ sáng lên ở nửa
   phải. Bộ này khung rộng 1296px, chữ dẫn 54ch chạy tới quãng 52% bề ngang,
   nên mốc đặc phải là 46% chứ không thấp hơn. Từng để radial 150% ở góc phải
   trên: bán kính lớn quá nên tới giữa tấm màn lọc mới được 40%, chữ xám nằm
   thẳng trên vân gỗ sáng. */
body .hero > .khung::before {
  background:
    linear-gradient(96deg, var(--th-dam) 0 46%, color-mix(in srgb, var(--th-dam) 72%, transparent) 74%, color-mix(in srgb, var(--th-dam) 44%, transparent) 100%),
    url("/anh-gd/kem-hero.jpg") 76% 22%/cover no-repeat;
  animation: anh-tho 40s ease-in-out infinite alternate;
  transform-origin: 78% 20%;
}
/* Món trang trí riêng của kem: HUY HIỆU TRÒN. Ô biểu tượng vuông bo 14px
   thành đĩa tròn có vành màu nhấn. Ô sẵn là 50x50 nên tròn đều, không méo. */
body .dv-the .bt-o {
  border-radius: 50%; border: 2px solid color-mix(in srgb, var(--sang) 45%, transparent);
  background: var(--nen-2);
}
body .dv-the:hover .bt-o { border-color: var(--sang); }
/* ... trừ khi bên trong là hình MÀU. Bộ hình màu (.btm) vốn vẽ cho lưới app:
   mỗi hình đã là một ô vuông bo góc có nền riêng. Lồng nó vào đĩa tròn có
   vành thì thành hai cái nền chồng nhau, và đĩa tròn cắt cụt bốn góc hình.
   Nên ở đây ô chỉ còn là chỗ đặt: hình chiếm trọn 50×50.

   Chỉ nhắm ô CÓ .btm chứ không sửa .bt-o nói chung — ô "Xem tất cả" và mấy
   ô lối-thoát khác vẫn dùng hình nét, chúng vẫn cần cái đĩa làm nền. */
body .dv-the .bt-o:has(.btm),
body .dv-the:hover .bt-o:has(.btm) {
  background: none; border: none; border-radius: 14px; padding: 0;
}
.dv-the .bt-o .btm { width: 100%; height: 100%; }
/* Chân trang đứng trên một băng ảnh ấm. Màn lọc 88% giữ nguyên độ tương phản
   của chữ chân trang — chỗ này chữ đã nhỏ 13.5px, không được phép mờ thêm. */
body footer {
  background:
    linear-gradient(0deg, color-mix(in srgb, var(--th-dam) 88%, transparent), color-mix(in srgb, var(--th-dam) 92%, transparent)),
    url("/anh-gd/kem-bang.jpg") center 35%/cover no-repeat;
}
/* Hiện khi cuộn: trôi từ phải sang, chậm nhất trong sáu bộ (.7s). Bộ này là
   bộ giãn nhất — khối cách nhau 100px — nên chuyển động cũng phải thong thả
   theo, nhanh thì lệch hẳn với khoảng trống xung quanh. */
body.js-troi .troi.vao { animation: troi-phai .7s cubic-bezier(.22,.72,.28,1) both; }
/* Rê chuột: thẻ trượt sang phải, không nhấc. Bộ này thẻ không có viền cũng
   không có bóng, nhấc lên thì chẳng thấy gì thay đổi vì không có mép để nhìn. */
body .dv-the,
body .the,
body .nut { transition-duration: .42s; }
body .dv-the:hover { transform: translateX(6px); background: var(--th-nen); }
body .luoi-vach .dv-the:hover { transform: translateX(6px); }
body .nut-chinh:hover,
body .nut-vien:hover { transform: translateY(-2px); }

/* ==========================================================================
   MÀN HÌNH APP (/app) và thanh mời cài
   Chạy trên body.la-app, tách hẳn khỏi khung web. Mọi màu lấy từ biến --md-*
   khai ở đầu tệp, nên đổi bảng màu gốc là app đổi theo, không sửa chỗ này.
   Riêng màn hình ĐẦU của app dựng lại ở khối cuối tệp — luật ở đây là phần
   dùng chung cho các trang con.
   ========================================================================== */
body.la-app {
  background: var(--nen-2);
  /* Chừa chỗ cho thanh đáy cố định, cộng lề an toàn của iPhone tai thỏ. */
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
body.la-app main { min-height: 0; }

.app-dau {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px calc(10px) 16px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  background: var(--the); border-bottom: 1px solid var(--vien);
}
/* --- Bảng hiệu ở màn hình đầu ------------------------------------------
   Logo, tên trạm, dòng nghề — xếp giữa thành một tấm biển. Trước đây ba thứ
   này nằm chen một hàng ngang bên trái, chữ 16px, lọt thỏm cạnh cái logo;
   khách mở app ra không thấy tên trạm đâu.

   Tấm biển này KHÔNG dính đỉnh: nó cao gần trăm điểm ảnh, dính lại thì suốt
   lúc cuộn cứ chiếm mất một phần bảy màn hình để lặp lại thứ khách đã đọc.
   Đường về vẫn còn nguyên ở nút Trang chủ dưới thanh đáy. */
/* --- Hàng rào: chặn luật trang web tràn vào vỏ app ---------------------
   Luật bố cục của trang web khai theo dạng `body <thẻ>` — `body section`,
   `body h1`, `body h2`. Đặc hiệu (0,0,2): thua class, nhưng chỉ khi luật app
   THẬT SỰ có class đụng đúng thẻ đó. Chỗ chết người là luật app viết cho một
   thẻ trần thì thua sạch, nằm sau bao nhiêu dòng cũng vô ích.

   Đã dính một lần và mất công dò: <section class="app-hero"> ăn nguyên
   `section { padding: 100px 0 }`, thành hai khoảng trắng hai trăm điểm ảnh
   kẹp lấy đúng một câu; h1 trong đó nhảy lên 33px, to ngang tên trạm trên
   tấm biển; .app-muc ở trang con cũng phồng y như vậy.

   Không sửa bằng cách hạ luật web xuống: chúng đúng cho trang web trên màn
   24 inch. Dựng hàng rào ở đây thay vào đó — mọi luật trong khối này đều kèm
   body.la-app nên vượt được luật nền, mà không rơi giọt nào ra ngoài, vì lớp
   la-app chỉ có trên các trang /app. Luật app nào đụng cùng một thẻ với luật
   nền thì phải nằm trong hàng rào này, không viết class trần ở ngoài rồi
   mong nó thắng. */
body.la-app .app-than section { padding: 0; border-top: none; }
body.la-app .app-than section.app-muc { padding: 16px 15px 17px; }
body.la-app .app-h2 { font-size: 16px; line-height: 1.3; letter-spacing: -.01em; font-weight: 700; }
body.la-app .app-dv-ten { font-size: 21px; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; }

.app-bia {
  text-align: center;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 18px;
  background: var(--the); border-bottom: 1px solid var(--vien);
}
.app-bia-lk { display: block; text-decoration: none; color: var(--muc); }
/* Bảng hiệu app dùng bản logo-4d. Thân app nền SÁNG, còn mặc định của
   .logo-4d ở trên là bản nền tối (trắng) — để nguyên là chữ trắng trên nền
   trắng, mất hẳn. Cho nó ăn theo mực và màu nhấn của giao diện đang bật,
   đúng như bản phẳng làm ở dưới. KHÔNG khoá aspect-ratio: khung đã cắt sát
   mực nên hình không còn vuông, xem ghi chú ở .logo-dau. */
.app-bia .logo-4d { width: auto; }
body.la-app .app-bia .logo-4d {
  height: 46px; filter: none;
  --l4-chinh: var(--muc); --l4-nhan: var(--lime);
}
body.la-app.man-1 .app-bia .logo-4d { height: clamp(29px, 4.8svh, 40px); }
.app-bia .logo-dau { height: 46px; width: auto; margin: 0 auto; display: block; }
.app-bia .logo-khoi { margin: 0 auto; }
.app-bia .chu-tpic { height: 13px; }
.app-bia img.logo-dau { max-width: 200px; object-fit: contain; }
/* Mặc định của .logo-dau là bản nền tối (trắng). Thân app nền sáng, để
   nguyên là chữ trắng trên nền trắng, mất hẳn. Đổi sang bản ăn theo mực của
   giao diện đang bật; nửa trên mặt vợt vẫn là vàng nhấn — đó chính là bản
   nền sáng của dấu hiệu, không phải bản mono. */
body.la-app .app-bia .logo-dau,
body.la-app .app-dau .logo-dau {
  --lg-chinh: var(--muc); --lg-nhan: var(--lime);
}
/* Thân app nền SÁNG: gạch nối về cùng màu chữ, xem ghi chú ở .chu-tpic. */
body.la-app .chu-tpic { --tp-chu: var(--muc); --tp-gach: var(--muc); }
.app-bia-ten {
  display: block; margin-top: 12px;
  font-size: clamp(23px, 6.6vw, 29px); font-weight: 800;
  letter-spacing: -.03em; line-height: 1.08;
}

.app-than { max-width: 620px; margin: 0 auto; padding: 18px 16px 8px; }
.app-dan { margin: 2px 2px 14px; color: var(--muc-mo); font-size: 14px; line-height: 1.5; }

/* Dòng chữ to nhất màn app. Tên trạm trên đầu trang là tên riêng — nó không
   nói ra nghề, mà khách mới cài xong thì cần biết ngay app này làm gì với cây
   vợt. Cỡ chữ co theo bề ngang máy: máy 320px vẫn hai dòng, không tràn. */
/* Mọi khối trong thân app ăn chung lề của .app-than. Trước đây mỗi khối tự
   thêm 2-3px lề riêng, ba khối ba mép lệch nhau vài điểm ảnh — không ai chỉ
   ra được là lệch, nhưng nhìn vào thấy nó xộc xệch. */
.app-hero { margin: 0 0 20px; }
/* Nhỏ hơn tên trạm trên tấm biển một bậc rõ ràng. Hai dòng chữ to bằng nhau
   cách nhau hai chục điểm ảnh thì không dòng nào còn là dòng to nhất. */
body.la-app .app-hero h1 {
  margin: 0; font-size: clamp(18.5px, 5.2vw, 23px); line-height: 1.2;
  font-weight: 800; letter-spacing: -.022em;
}
.app-hero-chu { margin: 7px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--muc-mo); }
.app-hero-chu b,
.app-hero-chu strong { color: var(--muc); font-weight: 700; }

/* Nhãn nhóm chứ không phải tiêu đề: chữ nhỏ, in hoa, giãn nét. Nó chỉ có
   việc nói mấy ô dưới là gì, không được to bằng câu hero ngay trên. */
.app-nhan-nhom {
  margin: 0 0 10px; font-size: 11.5px; font-weight: 700;
  letter-spacing: .09em; text-transform: uppercase; color: var(--muc-mo);
}

.app-luoi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
@media (min-width: 520px) { .app-luoi { grid-template-columns: repeat(3, 1fr); } }

/* Bản nhỏ của lưới, dùng ở màn hình đầu: ba cột, biểu tượng với tên việc,
   không có dòng số ngày. Ô cao 76px thay vì 116px — sáu việc gói trong hai
   hàng, còn chỗ cho ba khối gấp bên dưới nằm cùng một màn hình. Số ngày làm
   vẫn còn nguyên ở trang từng dịch vụ. Khai sau media query trên kia để
   thắng nó, hai bên cùng một mức đặc hiệu. */
/* Bốn cột cố định, hình màu 42px với tên việc bên dưới. Trần 430px cho cả
   lưới: trên máy tính bảng .app-than rộng 620px mà vẫn chia bốn thì mỗi ô
   phình thành khung 150px chứa một hình 42px, nhìn như bảng còn thiếu chữ.
   Tám ô hai hàng luôn đầy — có thêm dịch vụ thì hàng cuối hở vài ô, không
   sao: ô nhỏ nên khoảng hở không thành cái lỗ như hồi ô cao 116px. */
.app-luoi-nho { grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 430px; margin: 0 auto; }
.app-luoi-nho .app-o {
  align-items: center; justify-content: flex-start; text-align: center;
  min-height: 0; padding: 10px 4px 11px; gap: 6px;
}
.app-luoi-nho .app-bt { display: flex; align-items: center; justify-content: center; }
.app-luoi-nho .app-bt .btm { width: 42px; height: 42px; }
/* Hai dòng là trần. Ở 4 cột trên máy 360px mỗi ô rộng chừng 78px, chữ 11px
   xuống được hai dòng là vừa; tên nào dài hơn thì cắt — hình đã nói việc
   rồi, chữ ở đây chỉ xác nhận. Đặc hiệu (0,2,0) để thắng luật .app-ten
   chung bên dưới, không phải để thắng giao diện. */
.app-luoi-nho .app-ten {
  margin-top: 0; font-size: 11px; line-height: 1.25; font-weight: 600;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Ô vuông cỡ ngón tay: cạnh ngắn nhất vẫn trên 44px kể cả trên máy 320px. */
.app-o {
  display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
  min-height: 116px; padding: 14px 13px;
  background: var(--the); border: 1px solid var(--vien); border-radius: var(--r);
  color: var(--muc); text-decoration: none;
  transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
}
.app-o:active { transform: scale(.97); }
.app-o:hover { border-color: var(--vien-dam); box-shadow: var(--bong); }
.app-bt { display: block; color: var(--sang-muc); }
.app-bt .bt { width: 30px; height: 30px; }
.app-bt .btm { width: 32px; height: 32px; }
.app-ten { font-weight: 650; font-size: 14.5px; line-height: 1.25; margin-top: auto; }
.app-phu { font-size: 11.5px; color: var(--muc-mo); }
/* Con số trong ô việc. Mono + tabular-nums để hai ô cạnh nhau có dấu chấm
   nghìn thẳng hàng; white-space:nowrap vì cắt giữa một con số là đọc ra giá
   sai, thà để nó tràn rồi bị ellipsis cắt ở cuối. */
.app-o-gia {
  font: 700 11px/1.2 "Roboto Mono", ui-monospace, monospace;
  font-variant-numeric: tabular-nums;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%; color: var(--th);
}
.app-luoi-chu {
  margin: 12px 4px 0; font-size: 12px; line-height: 1.5;
  color: var(--muc-mo); text-align: center;
}
.app-o-hoi { border-style: dashed; }
.app-trong { margin: 22px 4px; color: var(--muc-mo); text-align: center; }

.app-chan {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; align-items: flex-end;
  background: var(--the); border-top: 1px solid var(--vien);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.app-chan a {
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 3px 10px; color: var(--muc-mo); text-decoration: none;
  font-size: 11px; line-height: 1.2; text-align: center;
}
.app-chan a:active { background: var(--th-nen); }
.app-chan a.dang { color: var(--sang-muc); font-weight: 650; }
.app-chan .bt { width: 22px; height: 22px; }
/* Chỉ đường luôn đỏ để nổi trên thanh đáy — chỉ ô này, không chạm 4 nút kia. */
.app-chan a.app-chi-duong { color: #d32f2f; }
.app-chan a.app-chi-duong:active { background: var(--th-nen); }

/* Nút giữa nhô hẳn lên khỏi thanh. Vành 4px cùng màu nền trang để nó trông
   như xuyên qua thanh chứ không dán đè lên. */
.app-chan a.app-chan-tron { padding-top: 0; color: var(--muc); font-weight: 650; }
.app-chan-tron .tron {
  flex: none; width: 54px; height: 54px; border-radius: 50%; margin: -24px 0 1px;
  display: flex; align-items: center; justify-content: center;
  background: var(--sang); color: var(--tren-sang);
  border: 4px solid var(--nen); box-shadow: 0 5px 14px rgba(0, 0, 0, .2);
}
.app-chan-tron .tron .bt { width: 25px; height: 25px; stroke-width: 1.9; }
/* Số điện thoại in thẳng dưới nút. Nhỏ hơn nhãn mấy nút kia vì mười chữ số
   phải lọt vào một ô rộng bằng một phần năm màn hình; tabular-nums cho các
   chữ số đều bề ngang, không so le. */
.app-chan a.app-chan-tron { flex-grow: 1.3; }
.app-chan-so {
  font-size: 10.5px; letter-spacing: -.01em; white-space: nowrap;
  font-variant-numeric: tabular-nums; font-weight: 700;
}

/* Bảng soi máy ở /app/kiem. Chữ nhỏ và cho phép ngắt giữa chừng vì cột phải
   chứa cả chuỗi userAgent dài ngoằng lẫn địa chỉ trang. */
.kiem-ds { margin: 0; font-size: 13px; }
.kiem-ds dt { color: var(--muc-mo); margin-top: 10px; }
.kiem-ds dd {
  margin: 1px 0 0; font-weight: 650;
  overflow-wrap: anywhere; word-break: break-word;
}
.app-chan a.app-chan-tron:active { background: none; }
.app-chan a.app-chan-tron:active .tron { filter: brightness(.93); }

/* Web trên điện thoại đeo luôn thanh này — vào bằng trình duyệt hay bằng icon
   ngoài màn hình chính thì thao tác như nhau. Màn hình rộng thì thôi, ở đó đã
   có nav trên đầu và chân trang bốn cột. */
@media (min-width: 761px) { body:not(.la-app) .app-chan { display: none; } }
@media (max-width: 760px) {
  body:not(.la-app) { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
}

/* --- Giao dien moi: thanh day dang vien thuoc noi (floating pill) ----------
   Ban cu sat day, 5 o chia deu, nut giua nho len bang vien tron. Nhin chat
   nhung nang mat khi cuon. Ban moi gom vao mot vien nam giua day, cach mep
   12px, bo vien va bong mo, nut giua gon hon (khong in so duoi nut). Van du
   5 thao tac: Trang chu / Tra cuu / Goi-Zalo / Gui anh / Chi duong-Quy trinh.
   Chi duong van do de nhan ra tren pil trang mo. */
.app-chan.app-chan-moi {
  left: 50%; right: auto; transform: translateX(-50%);
  bottom: max(10px, env(safe-area-inset-bottom, 0px));
  width: calc(100% - 24px); max-width: 460px;
  border: 1px solid rgba(0,0,0,.08);
  border-radius: 999px;
  background: rgba(255,255,255,.92);
  -webkit-backdrop-filter: saturate(1.2) blur(14px);
  backdrop-filter: saturate(1.2) blur(14px);
  box-shadow: 0 8px 28px rgba(15,23,42,.16), 0 1px 3px rgba(15,23,42,.08);
  padding: 6px 8px;
  padding-bottom: 6px;
  gap: 2px;
  justify-content: space-around;
}
.app-chan.app-chan-moi a {
  padding: 7px 6px 6px; border-radius: 999px; font-size: 10px; gap: 2px;
}
.app-chan.app-chan-moi a:active { background: rgba(15,23,42,.06); }
.app-chan.app-chan-moi a.dang { background: var(--th-nen); color: var(--muc); }
.app-chan.app-chan-moi .bt { width: 20px; height: 20px; }
.app-chan.app-chan-moi .app-chan-tron .tron {
  width: 48px; height: 48px; margin: 0;
  border-width: 3px; box-shadow: 0 4px 12px rgba(0,0,0,.18);
}
.app-chan.app-chan-moi .app-chan-tron .tron .bt { width: 22px; height: 22px; }
.app-chan.app-chan-moi a.app-chan-tron { flex-grow: 0; padding: 2px; background: transparent; }
.app-chan.app-chan-moi .app-lh-menu {
  bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
  border-radius: 14px;
}
/* Khi bat gd_moi, body van chua 76px cho thanh sat day — pil noi chi can ~72px */
body:has(.app-chan-moi) { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
body.la-app:has(.app-chan-moi) { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 761px) { body:not(.la-app) .app-chan.app-chan-moi { display: none; } }
body.la-app.man-1 .app-chan.app-chan-moi { position: fixed; }

/* --- Thẻ mời cài, nổi giữa màn hình ------------------------------------ */
.moi-nen {
  position: fixed; inset: 0; z-index: 59;
  background: rgba(8, 12, 18, .38);
  animation: moi-mo .2s ease both;
}
.moi-cai {
  position: fixed; z-index: 60;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(340px, calc(100vw - 40px));
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 8px; padding: 22px 20px 14px;
  background: var(--the); border: 1px solid var(--vien-dam);
  border-radius: 18px; box-shadow: var(--bong-cao);
  animation: moi-len .26s cubic-bezier(.34, 1.4, .64, 1) both;
}
@keyframes moi-mo { from { opacity: 0; } to { opacity: 1; } }
@keyframes moi-len {
  from { opacity: 0; transform: translate(-50%, -46%) scale(.94); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
@media (prefers-reduced-motion: reduce) { .moi-cai,
.moi-nen { animation: none; } }
/* Chốt chặn thứ hai, không dính gì tới JavaScript: màn hình rộng thì thẻ mời
   cài không có cửa hiện, kể cả khi đoạn script trên kia tính sai. Lời mời chỉ
   dành cho máy cầm tay. */
@media (min-width: 1025px) { .moi-cai,
.moi-nen { display: none !important; } }

.moi-anh { display: flex; }
/* Chỉ nhắm vào dấu hiệu, không nhắm "mọi svg trong .moi-anh": bên trong nó
   giờ còn thẻ chữ T-PIC, ép cỡ cứng lên chữ là kéo méo. Và chỉ đặt height:
   khung dấu hiệu đã cắt sát mực nên không còn vuông. */
.moi-anh .logo-dau, .moi-anh .logo-4d { height: 54px; width: auto; }
.moi-anh .chu-tpic { height: 15px; width: auto; }
.moi-cai b { font-size: 18px; line-height: 1.25; letter-spacing: -.01em; }
.moi-cai > span { font-size: 13px; color: var(--muc-mo); line-height: 1.45; }
.moi-cai .moi-nut {
  width: 100%; margin-top: 6px; padding: 15px 18px;
  font-size: 16px; min-height: 52px;
}
.moi-sau {
  background: none; border: none; cursor: pointer; padding: 5px 10px;
  font-size: 13px; color: var(--muc-mo); text-decoration: underline;
}
.moi-sau:hover { color: var(--muc); }
.moi-dong {
  position: absolute; top: 5px; right: 7px;
  width: 32px; height: 32px; padding: 0; line-height: 1;
  font-size: 22px; background: none; border: none; cursor: pointer; color: var(--muc-mo);
}
.moi-dong:hover { color: var(--muc); }

/* Hai bước của iPhone. Vẽ đúng biểu tượng Chia sẻ vì khách phải nhận ra nó
   trên thanh dưới của Safari, không phải đoán từ chữ. */
.moi-ios { width: 100%; margin-top: 2px; display: flex; flex-direction: column; gap: 9px; }
.moi-ios p {
  margin: 0; display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; line-height: 1.35; text-align: left;
}
.moi-so {
  flex: none; width: 21px; height: 21px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font: 700 11px/1 "Roboto Mono", ui-monospace, monospace;
  background: var(--sang); color: var(--tren-sang);
}
.moi-ios-bt {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--th-nen); color: var(--th);
}
.moi-ios-bt .bt { width: 17px; height: 17px; }
.moi-mui {
  font-size: 20px; line-height: 1; color: var(--muc-mo);
  animation: moi-nhun 1.4s ease-in-out infinite;
}
@keyframes moi-nhun { 0%,
100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
@media (prefers-reduced-motion: reduce) { .moi-mui { animation: none; } }

/* --- Hai khối dưới lưới app: làm thế nào, và gọi ai --------------------- */
.app-muc {
  margin-top: 22px; padding: 16px 15px 17px;
  background: var(--the); border: 1px solid var(--vien); border-radius: var(--r);
}
.app-h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.app-gap:first-of-type { margin-top: 22px; }

/* --- Khối gấp ở màn hình đầu -------------------------------------------
   Cùng cái vỏ thẻ như .app-muc, nhưng đóng lại chỉ còn một dòng cao 50px —
   đủ để đọc tên khối và bấm bằng ngón cái. Ba khối đóng lại tốn 170px thay
   vì hơn chín trăm, nhờ đó cả màn hình chính lọt vào một lần nhìn. */
.app-gap {
  margin-top: 10px;
  background: var(--the); border: 1px solid var(--vien); border-radius: var(--r);
}
.app-gap > summary {
  display: flex; align-items: center; gap: 11px;
  min-height: 50px; padding: 12px 14px; box-sizing: border-box;
  cursor: pointer; color: var(--muc);
  font-size: 14.5px; font-weight: 650; letter-spacing: -.01em;
  /* Hai dòng: bỏ tam giác mặc định của Chrome/Safari và của Firefox. */
  list-style: none;
}
.app-gap > summary::-webkit-details-marker { display: none; }
.app-gap > summary::marker { content: ""; }
.app-gap > summary:active { background: var(--th-nen); border-radius: var(--r); }
.app-gap > summary:focus-visible { outline: 2px solid var(--sang); outline-offset: -3px; }
.app-gap[open] > summary { border-bottom: 1px solid var(--vien); border-radius: 0; }
.app-gap-bt { flex: none; display: flex; color: var(--sang-muc); }
.app-gap-bt .bt { width: 20px; height: 20px; }
.app-gap-ten { flex: 1 1 auto; min-width: 0; }
.app-gap-mui { flex: none; display: flex; color: var(--muc-mo); transition: transform .18s ease; }
.app-gap-mui .bt { width: 18px; height: 18px; }
.app-gap[open] .app-gap-mui { transform: rotate(180deg); }
@media (prefers-reduced-motion: reduce) { .app-gap-mui { transition: none; } }
.app-gap-than { padding: 13px 14px 15px; }
.app-gap-than > :first-child { margin-top: 0; }

.app-buoc { margin: 0; padding: 0; list-style: none; counter-reset: b; }
.app-buoc li {
  position: relative; counter-increment: b;
  padding: 0 0 14px 34px; display: flex; flex-direction: column; gap: 2px;
}
.app-buoc li:last-child { padding-bottom: 2px; }
.app-buoc li::before {
  content: counter(b); position: absolute; left: 0; top: 0;
  width: 23px; height: 23px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font: 700 12px/1 "Roboto Mono", ui-monospace, monospace;
  background: var(--sang); color: var(--tren-sang);
}
/* Vạch nối các bước: đọc ra ngay là ba việc nối nhau, không phải ba gạch đầu
   dòng rời rạc. */
.app-buoc li:not(:last-child)::after {
  content: ""; position: absolute; left: 11px; top: 27px; bottom: 6px;
  width: 1px; background: var(--vien-dam);
}
.app-buoc b { font-size: 14px; font-weight: 650; line-height: 1.3; }
.app-buoc span { font-size: 12.5px; color: var(--muc-mo); line-height: 1.45; }

.app-nut-hang { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 15px; }
.app-nut-hang .nut { flex: 1 1 auto; text-align: center; padding: 11px 14px; font-size: 13.5px; }

/* Số điện thoại: to bằng ngón tay, bấm là gọi. Đây là thứ khách mở app ra
   tìm nhiều nhất sau danh sách việc. */
.app-so {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 13px 14px; border-radius: var(--r);
  background: var(--th-nen); color: var(--th); text-decoration: none;
  font: 700 20px/1 "Roboto Mono", ui-monospace, monospace; letter-spacing: .01em;
}
.app-so:active { filter: brightness(.96); }
.app-so .bt { width: 20px; height: 20px; stroke-width: 1.8; }

.app-lh-hang { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 10px; }
.app-lh-hang .nut { flex: 1 1 auto; text-align: center; padding: 10px 14px; font-size: 13px; }

.app-lh-ds { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
.app-lh-ds dt { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muc-mo); padding-top: 2px; }
.app-lh-ds dd { margin: 0; font-size: 13.5px; line-height: 1.4; }

/* Hai ô tra đơn nằm cạnh nhau. Mã đơn dài hơn số điện thoại nên chia
   1.5/1 — chia đôi đều thì ô mã hết chỗ ngay trên máy 360px. */
.app-tra-doi { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; margin-top: 13px; }
.app-tra-doi label { display: block; margin: 0; font-size: 13px; }
.app-tra-doi input {
  width: 100%; box-sizing: border-box; margin-top: 5px;
  /* 16px chẵn: nhỏ hơn là Safari trên iPhone tự phóng to cả trang lúc
     con trỏ nhảy vào ô, rồi để nguyên như thế. */
  padding: 12px 13px; font-size: 16px;
}
#tra-don .app-nut-to { margin-top: 13px; }

/* --- Màn hình con của app: tra đơn, gửi ảnh, quy trình -------------------
   Ba trang này đều đã có bản web. Bản app không phải bản web thu nhỏ: ô nhập
   to bằng ngón cái, xếp một cột, và thêm mấy thứ chỉ có nghĩa khi cầm điện
   thoại — nhớ đơn vừa tra, gấp bớt ô không bắt buộc, mở thẳng camera. */

.app-dau-2 { justify-content: flex-start; gap: 4px; }
.app-lui {
  flex: none; display: flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; margin-left: -10px; border-radius: 50%;
  color: var(--muc); text-decoration: none;
}
.app-lui:active { background: var(--th-nen); }
.app-lui .bt { width: 21px; height: 21px; stroke-width: 2; }
.app-tieu { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }

/* Ô nhập cỡ ngón tay. 16px không phải cho to đẹp: dưới 16px là Safari tự
   phóng cả trang lên lúc khách chạm vào ô, rồi để nguyên đấy — khách gõ xong
   không thấy cái nút gửi đâu nữa. */
.app-form { margin: 2px 0 20px; }
.app-form label { margin-bottom: 14px; font-size: 13.5px; }
.app-form input,
.app-form textarea { margin-top: 5px; padding: 13px 14px; font-size: 16px; }
.app-form textarea { min-height: 96px; }
.app-nut-to { width: 100%; padding: 15px 18px; font-size: 16px; min-height: 52px; }
/* Cùng lớp ấy đặt lên thẻ <a>: thẻ a không có kiểu nút sẵn nên phải tự căn
   giữa chữ, còn <button> thì trình duyệt lo hộ. */
a.app-nut-to { display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
.app-nut-hang-doc { flex-direction: column; }

/* Hai lối nạp ảnh ở màn gửi ảnh: chụp ngay, hoặc lấy tấm đã có trong máy.
   Ô input thật nấp sau nhãn — giấu bằng display:none thì bàn phím Tab không
   tới được nữa, nên đẩy ra khỏi tầm nhìn mà vẫn để nó tồn tại. */
.tep-an {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.app-tep { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
.app-tep-nut {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 16px 10px; text-align: center; cursor: pointer;
  border: 1px solid var(--vien-dam); border-radius: var(--r);
  background: var(--the); color: var(--muc);
}
.app-tep-nut .bt { width: 26px; height: 26px; color: var(--sang-muc); }
.app-tep-nut b { font-size: 14px; font-weight: 650; }
.app-tep-nut span { font-size: 11.5px; color: var(--muc-mo); line-height: 1.35; }
.app-tep-nut:active { background: var(--th-nen); }
/* Ô input nấp sau nhãn nên vòng focus phải mượn nhãn mà hiện, không thì người
   dùng bàn phím Tab tới đây là mất dấu con trỏ. */
.tep-an:focus-visible + .app-tep-nut,
.app-tep-nut:focus-visible { outline: 2px solid var(--muc); outline-offset: 2px; }
.app-nhan { display: block; font-weight: 650; font-size: 14px; margin-top: 4px; }

/* Màn hình một dịch vụ. Tên việc đứng cạnh đúng cái biểu tượng khách vừa bấm
   ngoài lưới trang chủ. */
.app-dv-dau { display: flex; align-items: center; gap: 13px; margin: 2px 2px 14px; }
.app-dv-bt { flex: none; display: flex; color: var(--sang-muc); }
.app-dv-bt .bt { width: 40px; height: 40px; }
.app-dv-bt .btm { width: 46px; height: 46px; }
.app-dv-ten { margin: 0 0 5px; font-size: 21px; line-height: 1.2; letter-spacing: -.02em; }
/* Ba con số: mấy ngày, bảo hành mấy tháng, cân sai lệch bao nhiêu. */
.app-so3 {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px;
}
.app-so3 > div {
  padding: 12px 6px; text-align: center;
  border: 1px solid var(--vien); border-radius: var(--r); background: var(--the);
}
.app-so3 b { display: block; font-size: 19px; line-height: 1.15; letter-spacing: -.02em; }
.app-so3 span { display: block; margin-top: 3px; font-size: 11px; color: var(--muc-mo); line-height: 1.3; }
.app-ds-so { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 13.5px; line-height: 1.55; }
.app-ds-so::marker,
.app-ds-so li::marker { color: var(--muc-mo); }

/* Thẻ đơn máy nhớ giùm, nằm trên cùng: mở app ra là đã thấy đường vào đơn
   cũ, không phải moi mã đơn trong tin nhắn. */
.app-luu { display: flex; align-items: center; gap: 4px; margin: 0 0 18px; }
.app-luu-mo {
  flex: 1 1 auto; min-width: 0;
  display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 12px 14px; border-radius: var(--r);
  background: var(--th-nen); color: var(--th); border: 1px solid var(--th-vien);
  font: 600 13.5px/1.3 Roboto, system-ui, sans-serif;
}
.app-luu-mo:hover { background: var(--th-nen); }
.app-luu-mo:active { filter: brightness(.96); }
.app-luu-mo .bt { flex: none; width: 19px; height: 19px; }
.app-luu-mo b {
  display: block; margin-top: 2px; overflow-wrap: anywhere;
  font: 500 12.5px/1.35 "Roboto Mono", ui-monospace, monospace;
}
.app-luu-quen {
  flex: none; padding: 12px 8px; background: none; color: var(--muc-mo);
  font-size: 12.5px; font-weight: 500; text-decoration: underline;
}
.app-luu-quen:hover { background: none; color: var(--muc); }

.app-kq { margin-top: 16px; }
.app-kq h3 { overflow-wrap: anywhere; }
.app-duoi { margin: 12px 2px 0; }

/* Gửi xong thì dẹp form, chỉ còn mã yêu cầu và hai đường đi tiếp. */
.app-xong { display: grid; justify-items: center; text-align: center; gap: 13px; padding: 20px 2px 6px; }
.app-xong-bt { color: var(--nhan); }
.app-xong-bt .bt { width: 46px; height: 46px; stroke-width: 1.7; }
.app-xong .bao { width: 100%; text-align: left; }
.app-xong .ma-yc { width: 100%; }
.app-xong p { margin: 0; }
.app-xong .app-nut-hang { width: 100%; margin-top: 2px; }

/* Nếp gấp cho mấy ô không bắt buộc ở màn gửi ảnh. */
.app-them { margin: -6px 0 16px; }
.app-them > summary {
  display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer;
  padding: 10px 2px; font-size: 13.5px; font-weight: 600; color: var(--th);
}
.app-them > summary::-webkit-details-marker { display: none; }
.app-them > summary::before {
  content: "+"; flex: none; width: 21px; height: 21px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--th-nen); font: 700 15px/1 ui-monospace, monospace;
}
.app-them[open] > summary::before { content: "–"; }   /* dán thẳng, xem ghi chú ở .app-xep */
.app-them-noi { padding-top: 4px; }

/* Quy trình gấp thành nếp: nhìn hết dàn bước trong một màn, cần đọc kỹ bước
   nào thì mở bước ấy. */
.app-xep { display: grid; gap: 8px; margin: 2px 0 4px; }
.app-xep details { background: var(--the); border: 1px solid var(--vien); border-radius: var(--r); }
.app-xep summary {
  display: flex; align-items: center; gap: 11px; list-style: none;
  padding: 13px 14px; cursor: pointer;
}
.app-xep summary::-webkit-details-marker { display: none; }
/* Nhan buoc lay thang tu noi dung Kendy go ("BƯỚC 1"), khong phai mot chu
   so. Ep vao vong tron 26px thi chu trang tran ra ngoai, doc khong duoc —
   cho no gian theo be ngang cua chu. */
.app-xep .n {
  flex: none; height: 22px; padding: 0 9px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  white-space: nowrap; letter-spacing: .06em;
  font: 700 11px/1 "Roboto Mono", ui-monospace, monospace;
  background: var(--sang); color: var(--tren-sang);
}
.app-xep summary b { font-size: 14.5px; font-weight: 650; line-height: 1.3; }
/* Mũi tên vẽ bằng hai cạnh viền, KHÔNG bằng ký tự.
   html/template nuốt escape CSS: viết content:"A" thì nó dịch  thành
   một ký tự điều khiển thật rồi để lại "A" — đó là cái ký hiệu lạ nằm ở đây
   suốt. Ký tự dán thẳng cũng sống được, nhưng hình học thì không phụ thuộc
   font nào có glyph ấy. */
.app-xep summary::after {
  content: ""; flex: none; margin-left: auto; margin-right: 4px;
  width: 8px; height: 8px;
  border-right: 2px solid var(--muc-mo); border-bottom: 2px solid var(--muc-mo);
  transform: translateY(-2px) rotate(45deg); transition: transform .18s ease;
}
.app-xep details[open] summary::after { transform: translateY(2px) rotate(-135deg); }
.app-xep p { margin: 0; padding: 0 15px 15px 15px; font-size: 13.5px; line-height: 1.55; color: var(--muc-mo); }

.app-muc p { margin: 0; font-size: 13.5px; line-height: 1.55; }
.app-muc h3 { font-size: 14.5px; }
.app-doi { display: grid; gap: 15px; }
.app-doi p { margin-top: 6px; }
@media (min-width: 560px) { .app-doi { grid-template-columns: 1fr 1fr; gap: 18px; } }

/* ==========================================================================
   MATERIAL 3 — THANG CHỮ VÀ LINH KIỆN
   --------------------------------------------------------------------------
   Khối này đứng CUỐI tệp là cố ý. Bố cục của bộ "Kem & nắng" đã được nhấc lên
   thành luật trần khi bỏ hệ giao diện, nên nó nằm ở dạng `body .nut` (0,1,1).
   Muốn đè phải bằng đặc hiệu đó, mà không nên đẩy đặc hiệu cao hơn nữa (càng
   cao càng khó sửa sau) — nên cùng dạng `body <thẻ>` rồi thắng bằng thứ tự.
   Chuyển khối này lên trên là mất tác dụng.

   Cái gì theo M3 và cái gì giữ của bộ kem:
     THEO M3  — thang chữ, hình và cỡ nút, lớp trạng thái khi chạm, bo góc,
                ô nhập, chip, thanh trên, thanh dưới, gợn sóng.
     GIỮ KEM  — bố cục trang: khung 1296px, hero hai cột, nhịp khối. Đó là
                thứ Kendy chốt giữ nguyên.
   ========================================================================== */
:root {
  /* Thang chữ M3. Cặp số là cỡ/dòng, đơn vị px. */
  --md-display-l:  700 57px/64px Roboto, system-ui, sans-serif;
  --md-headline-l: 700 32px/40px Roboto, system-ui, sans-serif;
  --md-title-l:    500 22px/28px Roboto, system-ui, sans-serif;
  --md-title-m:    500 16px/24px Roboto, system-ui, sans-serif;
  --md-body-l:     400 16px/24px Roboto, system-ui, sans-serif;
  --md-body-m:     400 14px/20px Roboto, system-ui, sans-serif;
  --md-label-l:    500 14px/20px Roboto, system-ui, sans-serif;
  --md-label-m:    500 12px/16px Roboto, system-ui, sans-serif;
}

/* --- Icon Material Symbols ------------------------------------------------
   Bản nhúng là bản cắt theo tên, chỉ có 36 icon. Viết tên icon không nằm
   trong danh sách đó thì ra ô trống chứ không ra icon mặc định — thêm icon
   là phải tải lại font (scratchpad/font.py giữ danh sách).

   Tám icon dịch vụ tự vẽ (btm-* trong hinh.html) KHÔNG đổi sang Material
   Symbols: bộ này không có hình cho dán viền, phủ nhám, vá mặt. */
.msym {
  font-family: 'Material Symbols Outlined';
  font-weight: 400; font-style: normal; font-size: 24px;
  line-height: 1; letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap; direction: ltr;
  -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased; vertical-align: middle;
  user-select: none; flex: none;
}
.msym-nho { font-size: 20px; }
.msym-to  { font-size: 40px; }

/* --- Lớp trạng thái ------------------------------------------------------
   M3 không đổi màu nền khi rê chuột; nó phủ một lớp màu-chữ mờ lên trên. Nhờ
   vậy một luật dùng được cho mọi nút bất kể nền màu gì, và nút màu nhấn không
   bị nhạt dần vào nền trang như cách pha màu cũ. Độ mờ theo chuẩn: 8% khi rê,
   10% khi đang nhấn. */
body .nut,
body .nut-nho,
body .m3-lop { position: relative; overflow: hidden; isolation: isolate; }
body .nut::before,
body .nut-nho::before,
body .m3-lop::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: currentColor; opacity: 0; transition: opacity .12s linear;
  pointer-events: none;
}
body .nut:hover::before,
body .nut-nho:hover::before,
body .m3-lop:hover::before { opacity: .08; }
body .nut:active::before,
body .nut-nho:active::before,
body .m3-lop:active::before { opacity: .10; }

/* --- Nút ------------------------------------------------------------------
   Cao 40, bo tròn hết, chữ label-large. Nút chính tô ô-liu đặc, chữ trắng —
   6.49:1. Trước đây tô volt, và đó là chỗ đo thiếu: volt với chữ ô-liu đúng
   là 13.3:1 nên CHỮ đọc tốt, nhưng bản thân cái nút chỉ hơn mặt thẻ 1.05:1,
   tức mắt không thấy MÉP nút ở đâu. Chữ rõ mà nút vô hình. Volt lui về đúng
   chỗ nó thắng: nền tối (--sang-tren-toi). */
body .nut {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 24px; border-radius: 999px;
  font: var(--md-label-l); letter-spacing: .1px;
  border: 1px solid transparent; text-decoration: none;
  transition: box-shadow .15s ease;
}
body .nut-chinh {
  background: var(--md-primary-container); color: var(--md-on-primary-container);
  box-shadow: none;
}
body .nut-chinh:hover { background: var(--md-primary-container); box-shadow: var(--md-elev-1); }
body .nut-vien {
  background: transparent; color: var(--md-primary);
  border-color: var(--md-outline);
}
body .nut-vien:hover { background: transparent; border-color: var(--md-outline); color: var(--md-primary); }
/* Nút đặt trên tấm tối của hero: viền và chữ phải sáng lên; phần rê chuột thì
   lớp trạng thái tự lo vì nó lấy theo currentColor. */
body .hero .nut-vien { border-color: rgba(255,255,255,.42); color: #fff; background: transparent; }
body .hero .nut-vien:hover { border-color: rgba(255,255,255,.42); color: #fff; background: transparent; }
body .hero .the .nut-vien { border-color: var(--md-outline); color: var(--md-primary); }
body .hero .nut-chinh,
body .hero .nut-chinh:hover { background: var(--sang-tren-toi); color: var(--tren-sang-toi); }
/* Nút gọi hành động ở hero to hơn một bậc — M3 cho phép cỡ lớn ở chỗ quan
   trọng nhất trang. */
body .hero-nut .nut { min-height: 56px; padding: 0 32px; font: var(--md-title-m); }
body .nut-nho {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 32px; padding: 0 16px; border-radius: 999px;
  font: var(--md-label-l); box-shadow: none;
}

/* --- Thẻ ------------------------------------------------------------------
   M3 có ba dạng thẻ; dùng dạng viền (outlined) vì nền trang và nền thẻ ở đây
   chênh nhau rất ít — bỏ viền là thẻ tan vào trang. Bo 12px theo thang M3. */
body .the {
  background: var(--md-surface-container-lowest);
  border: 1px solid var(--md-outline-variant);
  border-radius: 12px; box-shadow: none;
}

/* Ô "bốn bước" cũng là thẻ, nhưng nó không mang class .the nên bị bỏ lại ở
   luật bộ kem: css.html:1983 cho mọi ô nền --nen-2, css.html:2143 tô riêng ô
   CHẴN bằng --th-nen. Mà --nen-2 (--kem-2 #CDC9DE) trùng đúng màu nền trang
   (--kem #CDC9DE) — nên ô lẻ tan vào trang, chỉ ô chẵn nổi lên, nhìn như
   trang hỏng. Kéo cả lưới về đúng một dáng thẻ viền như .the; nth-child viết
   lại để đè luật tô luân phiên kia. */
body .buoc > div,
body .buoc > div:nth-child(2n) {
  background: var(--md-surface-container-lowest);
  border: 1px solid var(--md-outline-variant);
  border-radius: 12px; box-shadow: none;
}

/* --- Chip -----------------------------------------------------------------
   Giữ chữ mono viết hoa: đây là nhãn kỹ thuật đọc lướt (mã đơn, trạng thái),
   không phải chip lọc của M3. Chỉ lấy hình chip M3 — bo 8px và chiều cao đủ
   chạm — chứ không lấy thang chữ. */
body .chip {
  display: inline-flex; align-items: center; min-height: 24px;
  padding: 0 8px; border-radius: 8px;
}

/* --- Ô nhập ---------------------------------------------------------------
   Dạng outlined của M3: viền 1px outline, bo 4px, cao 56, chữ body-large;
   lúc có tiêu điểm thì viền dày 2px màu primary (bù padding để chữ không nhảy).

   KHÔNG làm nhãn nổi (nhãn chạy lên đè trên viền khi gõ). Nhãn nổi cần nhãn
   đứng SAU ô trong DOM để CSS bắt được :placeholder-shown, mà ở đây khoảng ba
   mươi biểu mẫu đang viết <label>Tên<input></label>. Đổi hết chỉ để lấy hiệu
   ứng nhãn chạy là đánh đổi sai: rủi ro trải trên ba mươi tệp, cái được là một
   hiệu ứng. Nhãn vẫn nằm trên ô, đúng vai và vẫn đọc được. */
body input,
body textarea,
body select {
  min-height: 56px; padding: 16px; border-radius: 4px;
  border: 1px solid var(--md-outline);
  background: var(--md-surface); color: var(--md-on-surface);
  font: var(--md-body-l);
}
body textarea { min-height: 96px; line-height: 24px; }
body select { padding-block: 0; }
body input[type=checkbox],
body input[type=radio] { min-height: 0; padding: 0; accent-color: var(--md-primary); }
body input[type=file] { min-height: 0; padding: 12px; border-style: dashed; }
body input:hover,
body textarea:hover,
body select:hover { border-color: var(--md-on-surface); }
body input:focus,
body textarea:focus,
body select:focus {
  outline: none; border: 2px solid var(--md-primary); padding: 15px;
  box-shadow: none;
}
body select:focus { padding-block: 0; }

/* --- Thang chữ áp cho thân trang -----------------------------------------
   Body theo body-large của M3: 16/24. Trước dòng cao 1.68 — thoáng hơn, nhưng
   thang M3 tính nhịp dọc theo bội số 4 của dòng 24; lệch một chỗ là lệch cả
   thang. */
body { font: var(--md-body-l); }
/* Bài viết là chỗ người ta đọc liền hơn nghìn chữ chứ không lướt. Dòng 24px ở
   đó đọc chật; nới lên 28 mà vẫn là bội số của 4 nên không phá nhịp dọc. */
body .bai p,
body .bai li { font-size: 16px; line-height: 28px; }
body .nho { font: var(--md-body-m); }

/* ==========================================================================
   MÀN HÌNH ĐẦU CỦA APP — bản dựng lại
   --------------------------------------------------------------------------
   Đứng sau khối linh kiện M3 vì nó đè lên một số luật ở trên: cùng đặc hiệu
   thì luật viết sau thắng.

   Mọi luật ở đây đều mở đầu bằng `body.la-app`. Không phải cho đều mắt: luật
   nền của trang web là dạng `body h2` / `body section`, viết class trần là
   thua, và thua im lặng. Tiêu đề khối giá mà để `.app-muc-ten` trần thì nó ăn
   `body h2 { font-size: clamp(24px,3vw,36px) }` — ra chữ 24px giữa màn hình
   điện thoại.

   Bốn thứ đổi so với bản trước, theo đúng thứ tự Kendy chỉ ra:
     1. Băng ảnh tràn hết bề ngang, không chừa lề hai bên.
     2. Lề và khoảng cách giữa các khối bóp lại — bản trước một màn hình chỉ
        chứa được lưới việc, giá và cam kết đều nằm dưới nếp gấp.
     3. Nền chuyển sắc theo tông quả bóng pickleball thay cho một mảng màu
        phẳng.
     4. Icon và logo có khối: nền chuyển sắc, vạch sáng ở mép trên, bóng đổ
        bên dưới. Đây là chỗ CỐ Ý đi khác Material 3 — M3 vẽ phẳng, phân tầng
        bằng màu nền chứ không bằng bóng đổ. Trên màn 6 inch cầm tay, phẳng
        hoàn toàn thì tám ô dịch vụ dính thành một mảng. Phần còn lại của app
        — thang chữ, nút, ô nhập, thanh dưới — vẫn M3 nguyên.
   ========================================================================== */

/* Nền: chuyển sắc từ volt rất nhạt trên đỉnh xuống trắng ngà. Gắn theo khung
   nhìn (fixed) nên cuộn tới đâu cũng không lộ chỗ nối màu. */
body.la-app {
  background:
    radial-gradient(125% 52% at 50% -8%, rgba(255, 199, 44, .24) 0%, rgba(255, 199, 44, 0) 62%),
    linear-gradient(178deg, #B3AECB 0%, #C3BFD7 38%, var(--md-surface) 100%);
  background-attachment: fixed;
}

/* Lề chung của thân app, để thành biến vì băng ảnh phải trừ đúng số này ra
   mới tràn được hết bề ngang. */
/* Lề ngang của cả màn app. Khai ở body chứ không ở .app-than: bảng hiệu nằm
   NGOÀI .app-than, mà địa chỉ góc phải phải thẳng hàng với mép banner bên
   dưới. Hai con số 14px gõ tay ở hai chỗ thì sớm muộn một chỗ bị sửa lẻ. */
body.la-app { --app-le: 14px; }
body.la-app .app-than {
  max-width: 620px; margin: 0 auto; padding: 10px var(--app-le) 6px;
}
body.la-app .app-than section.app-muc {
  margin-top: 12px; padding: 12px 12px 14px;
  background: var(--md-surface-container-lowest);
  border: 1px solid var(--md-outline-variant); border-radius: 16px;
}

/* --- Bảng hiệu ------------------------------------------------------------
   Xếp ngang, không xếp giữa. Bản trước logo nằm giữa, tên trạm 29px, dòng
   nghề bên dưới — hết gần trăm rưỡi điểm ảnh cho thứ khách đã biết rồi, đẩy
   băng ảnh xuống quá nếp gấp. */
body.la-app .app-bia {
  text-align: left; border-bottom: none; background: transparent;
  padding: calc(12px + env(safe-area-inset-top, 0px)) var(--app-le) 10px;
}
body.la-app .app-bia .app-bia-lk { display: flex; align-items: center; gap: 11px; }
body.la-app .app-bia .logo-dau,
body.la-app .app-bia .logo-4d {
  height: 42px; width: auto; margin: 0; flex: none;
  /* Bóng bám theo hình thật trong SVG chứ không theo khung chữ nhật. */
  filter: drop-shadow(0 2px 3px rgba(46, 42, 94, .22));
}
body.la-app .app-bia .logo-khoi { margin: 0; gap: 2px; }
body.la-app .app-bia .chu-tpic { height: 12px; }
body.la-app .app-bia-chu { display: grid; min-width: 0; }
body.la-app .app-bia-ten {
  margin-top: 0; font: 700 19px/1.15 Roboto, system-ui, sans-serif;
  letter-spacing: -.02em;
}
/* Viên nhãn "Nhận sửa vợt toàn quốc", bên phải tên trạm.

   ĐẢO MÀU chứ không phải chữ màu trên nền trang: bản đầu là chữ vàng đặt
   trong banner, mà nét vẽ vợt ở đấy cũng vàng nên chữ lẫn vào hình, nhìn
   không ra. Nền lime đặc + chữ tối đo được 9.7:1 và không phụ thuộc vào thứ
   nằm dưới nữa. Ở bảng hiệu nền sáng thì chính mảng lime là cái đập vào mắt
   trước, đúng việc của một cái nhãn.

   Không viết hoa toàn bộ, không giãn ký tự: "NHẬN SỬA VỢT TOÀN QUỐC" giãn
   .09em rộng thêm chừng 30px, trên máy 360px thì viên nhãn phải cắt ba chấm
   giữa chữ "TOÀN". Chữ thường vẫn đủ to để đọc mà vừa chỗ.

   flex: 0 1 auto + min-width: 0 — bảng hiệu còn có khối mạng xã hội 2×2 bên
   phải khi Kendy điền link ở /qt/lien-he. Chật thì nhãn co lại và cắt ba
   chấm, chứ không đẩy khối kia ra khỏi mép. */
body.la-app .app-bia-nhan {
  flex: 0 1 auto; min-width: 0;
  font: 700 clamp(10px, 2.9vw, 11.5px)/1.25 Roboto, system-ui, sans-serif;
  color: #1E1A3C; background: var(--lime);
  border-radius: 999px; padding: 5px 10px;
  box-shadow: 0 2px 6px -2px rgba(46, 42, 94, .38);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* --- Dải địa chỉ, ngay dưới bảng hiệu -------------------------------------
   Bản trước nhét khối này vào góc phải bảng hiệu cho khỏi tốn chiều cao. Sai:
   nó ăn 48% bề ngang, cột trái còn chưa đầy 160px nên tên trạm lẫn dòng mô tả
   cùng bị cắt cụt. Tiết kiệm được 26px chiều cao mà hỏng ba dòng chữ thì
   không phải tiết kiệm.

   Xuống đây thành một dải riêng, mỗi thứ được cả chiều ngang. Và chiều cao
   ấy KHÔNG mất đi đâu cả: banner ngay dưới là phần co giãn duy nhất trong
   thân (flex:1), nó nhả ra đúng phần dải này chiếm — nên /app vẫn gói trong
   một màn không cuộn, chỉ hình nhỏ đi vài chục điểm ảnh.

   Ba phần trên một hàng: ghim — địa chỉ — nhãn "CHỈ ĐƯỜNG".
     - Địa chỉ nhận flex:1 + min-width:0 nên nó là thứ co lại và cắt đuôi bằng
       ellipsis khi chật. Ghim và nhãn flex:none: hai cái ấy nói "bấm vào đây
       ra bản đồ", cắt mất là dải mất luôn nghĩa.
     - Nhãn nằm bên PHẢI như nút chứ không nằm trên như tiêu đề: dải chỉ cao
       một dòng, xếp dọc là quay lại hai dòng và ăn thêm chiều cao.
   Dùng cặp tertiary-container: có sẵn ở cả hai bảng màu (kem-vàng ở bảng tím,
   bạc hà ở bảng volt cũ) nên không phải bịa mã màu mới, và cả hai đều ăn được
   mực --forest. */
body.la-app .app-bia { display: flex; align-items: center; gap: 10px; }
body.la-app .app-bia .app-bia-lk { flex: 1; min-width: 0; }
body.la-app .app-cho {
  display: flex; align-items: center; gap: 8px;
  text-decoration: none;
  background: var(--md-tertiary-container);
  color: var(--md-on-tertiary-container);
  border-radius: 12px; padding: 7px 11px;
}
/* Nét mảnh hơn mặc định: ở cỡ 18px thì stroke 1.6 làm cái ghim đặc lại thành
   một vệt. */
body.la-app .app-cho > .bt {
  width: 18px; height: 18px; flex: none; stroke-width: 1.5;
  color: var(--md-error);
}
/* Xuống dòng chứ không cắt đuôi bằng "…": địa chỉ Hà Nội đủ số nhà, phường,
   quận thì dài 45-55 ký tự, một hàng ngang không bao giờ chứa nổi — mà cắt
   mất đúng cái quận là khách không biết trạm ở đâu, tức là dải này mất luôn
   lý do tồn tại. Hai dòng là hết: dòng thứ ba thì đây không còn là một dải
   phụ nữa. Chiều cao thêm ra banner nhả cho, xem chú thích trên. */
body.la-app .app-cho-chu {
  flex: 1; min-width: 0;
  font: 500 12.5px/1.32 Roboto, system-ui, sans-serif;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  overflow: hidden;
}
/* Ghim và nhãn "CHỈ ĐƯỜNG" dùng --md-error: đỏ là màu ai cũng đọc ngay ra
   "vị trí trên bản đồ", và nó là mã màu duy nhất trong hệ không đổi theo bảng
   màu, nên dải đỏ y hệt ở cả bảng tím lẫn bảng volt cũ.
   Không hạ opacity: đỏ pha loãng trên nền kem ra hồng nhạt, trông như chữ bị
   vô hiệu hoá. Cỡ 10px cạnh địa chỉ 12.5px đã đủ giữ nhãn ở vai phụ. */
body.la-app .app-cho-nhan {
  flex: none;
  font: 600 10px/1 Roboto, system-ui, sans-serif;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--md-error);
}
/* Bấm vào có phản hồi: đây là link mở app khác (bản đồ), không có trạng thái
   :hover trên điện thoại nên chỉ còn lúc chạm để báo là đã nhận. Lún xuống
   chứ không mờ đi: dải đã có nền, giảm opacity là cả nền lẫn chữ nhạt cùng
   lúc trông như bị vô hiệu hoá. */
/* Bản app của dải báo. Bóp lại còn ~60% chiều cao bản web: ở đây nó ăn vào
   phần co giãn của banner, mà banner dưới 44px thì bản vẽ vợt chỉ còn một vệt.
   Chữ 10.5–12px vẫn đọc được vì nền lime đặc cho tương phản cao hơn hẳn chữ
   cùng cỡ đặt trên nền kem nhạt như bản trước. Viền trái mỏng hơn bản web
