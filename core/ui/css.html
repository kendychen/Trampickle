     h1     { font-size: 50px -> 70px; line-height: 1; letter-spacing: .025em }
     body   { letter-spacing: .075em }
     .button-sm { padding: 12px 30px; min-width: 160px; font-size: 12px }
     .button-lg { padding: 20px 45px; min-width: 230px; font-size: 14px }
   Tức là ngược hẳn luật chung của trang này (800, giãn chữ âm, bo tròn): chữ
   IN HOA nét mảnh giãn rộng, góc vuông tuyệt đối, nút dài và thấp có bề ngang
   tối thiểu. Đó là chỗ nhìn phát ra ngay, không phải mã màu. */
body.theme-cobalt {
  --r: 0px; --r-nho: 0px; --r-lon: 0px;
  /* Mẫu giãn .075em cho cả thân bài. Tiếng Việt cỡ 16px mà giãn tới mức đó
     thì dấu rời khỏi chữ, nên lấy một phần ba: vẫn đọc ra "trang giãn chữ",
     vẫn đọc được. */
  letter-spacing: .025em;
}
body.theme-cobalt h1, body.theme-cobalt h2,
body.theme-cobalt h3, body.theme-cobalt h4 { text-transform: uppercase; font-weight: 500; }
/* Chữ hoa tiếng Việt có dấu chồng (Ẫ, Ệ) nên line-height phải nới hơn số 1
   của mẫu, nếu không dấu chạm chân dòng trên. */
body.theme-cobalt h1 { font-size: clamp(29px, 4.4vw, 52px); line-height: 1.13; letter-spacing: .03em; }
body.theme-cobalt h2 { font-size: clamp(21px, 2.5vw, 30px); line-height: 1.2; letter-spacing: .07em; }
body.theme-cobalt h3 { font-size: 17px; letter-spacing: .1em; }
body.theme-cobalt h4 { letter-spacing: .1em; }
body.theme-cobalt .nut {
  border-radius: 0; min-width: 200px; text-align: center;
  padding: 16px 34px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
}
/* Nút in hoa giãn chữ rộng gấp rưỡi nút thường, hai cái đứng cạnh nhau là
   1.15 lần cột chữ mặc định — chúng tự xuống dòng thành hai bề ngang lệch
   nhau. Nới cột chữ thay vì bóp nút: mẫu gốc cũng để cột chữ rộng hơn cột
   hình, và bóp nút thì mất luôn cái đặc trưng vừa dựng. */
@media (min-width: 980px) {
  body.theme-cobalt .hero-canh { grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr); }
}
body.theme-cobalt .nut-nho, body.theme-cobalt .dau-trong nav a.nut-nho {
  border-radius: 0; padding: 10px 20px; font-size: 12.5px;
  letter-spacing: .1em; text-transform: uppercase;
}
body.theme-cobalt .dau-trong nav a { font-size: 13px; letter-spacing: .09em; text-transform: uppercase; }
body.theme-cobalt .chip, body.theme-cobalt .dv-the .bt-o,
body.theme-cobalt .bang-anh-khung { border-radius: 0; }
body.theme-cobalt .the, body.theme-cobalt .dv-the,
body.theme-cobalt .luoi-vach, body.theme-cobalt .buoc,
body.theme-cobalt .hero-lon > .khung, body.theme-cobalt .hero > .khung { border-radius: 0; }
/* Mẫu để khối thở rất rộng — 84px thay cho 60px. */
body.theme-cobalt section { padding: 84px 0; }


body.theme-dien {
  --nen:           #FFFFFF;   /* trắng thuần */
  --nen-2:         #F3F7FD;   /* dải xen kẽ, chỉ đủ khác nền để thấy ranh giới */
  --the:           #FFFFFF;   /* thẻ trắng, tách nhau bằng viền */
  --muc:           #10171D;   /* 18.1:1 trên nền */
  --muc-mo:        #4D5A69;   /* sáng nhất còn đạt AAA 7:1 */
  --vien:          #D3DAE1;   /* viền trang trí */
  --vien-dam:      #8796A7;   /* nhạt nhất còn đạt 3:1 — WCAG 1.4.11 */
  --th:            #203D5A;   /* L=0.35 — nền nút, chữ trắng còn AAA */
  --th-2:          #385574;   /* L=0.44 — đầu gradient hero */
  --th-dam:        #06233E;   /* màu tối gốc của mẫu */
  --th-nen:        #EAF1F9;   /* nền chip */
  --th-vien:       #C7D1DB;   /* viền chip */
  --sang:          #0080FF;   /* màu nhấn gốc của mẫu */
  --sang-muc:      #004FCB;   /* màu nhấn hạ tối tới AAA 7:1 — khi nó phải làm CHỮ trên nền sáng */
  --sang-tren-toi: #1187FF;   /* màu nhấn làm chữ trên tấm hero — 4.5:1 */
  --tren-sang:     #070C11;   /* chữ trên mảng màu nhấn — 5.2:1 */
  --tren-th:       #FFFFFF;
  --tren-dam:      #F2F4F6;   /* 14.5:1 trên nền tối */
  --tren-dam-mo:   #788B9E;   /* mờ nhất còn đạt AA 4.5:1 trên nền tối */
  --nhan-manh:     #10171D;
  --bong:          0 1px 2px rgba(6,35,62,.07), 0 12px 28px -14px rgba(6,35,62,.36);
  --bong-cao:      0 2px 4px rgba(6,35,62,.08), 0 22px 44px -20px rgba(6,35,62,.46);
  --sv-net:        #424E5B;
  --sv-mo:         #8796A7;
  --sv-to:         #EFF4F9;
  --sv-man:        #06233E;
  --sv-nhan:       #004FCB;
}
body.theme-dien header.dau { background: var(--th-dam); border-bottom: 1px solid rgba(255,255,255,.10); }
body.theme-dien .hero-lon > .khung {
  background: radial-gradient(120% 130% at 78% 8%, var(--th-2) 0%, var(--th-dam) 74%);
  border: 1px solid rgba(255,255,255,.10);
}
.gd-mau-dien {
  background: linear-gradient(180deg, #385574 0%, #06233E 44%, #FFFFFF 44%, #F3F7FD 100%);
  box-shadow: inset -14px 0 0 -8px #0080FF;
}

/* Đo trên trang mẫu: tiêu đề Rajdhani 72px/700 line-height 1.0, thân Rubik
   16px/1.6, nút vuông 20px 50px cao 66px chữ 700, thẻ trắng góc vuông bóng
   `0 1px 10px rgba(0,0,0,.1)`, khối thở 150px/90px.
   Chỗ khác nhìn ra trước nhất không nằm ở màu mà ở HERO: mẫu dựng hero là một
   BĂNG chạy hết bề ngang màn hình, không phải tấm bo góc nằm trong khung. */
body.theme-dien { --r: 0px; --r-nho: 0px; --r-lon: 0px; }
body.theme-dien .hero { padding-top: 0; }
/* Padding ngang tính bằng max() để chữ trong băng vẫn thẳng hàng với lưới
   1140px của các khối bên dưới; max-width bỏ đi thì .khung tự giãn hết bề
   ngang cha nó — không dùng 100vw cho bề rộng, tránh cộng thêm thanh cuộn. */
body.theme-dien .hero > .khung {
  max-width: none; border-radius: 0;
  padding: clamp(46px, 5.4vw, 84px) max(24px, calc((100vw - 1092px) / 2)) clamp(46px, 5vw, 78px);
}
body.theme-dien h1 { font-size: clamp(34px, 5.2vw, 60px); line-height: .98; letter-spacing: -.022em; font-weight: 700; }
body.theme-dien h2 { font-size: clamp(25px, 3.2vw, 38px); line-height: 1.04; letter-spacing: -.018em; font-weight: 700; }
body.theme-dien .hero-lon h1 { max-width: 13ch; }
body.theme-dien .nut {
  border-radius: 0; padding: 19px 32px; font-size: 15px;
  letter-spacing: .04em; text-transform: uppercase;
}
/* Cùng lý do như bộ cobalt: nút to bản cần cột chữ rộng hơn, nếu không hai
   nút hero xuống dòng lệch nhau. Mẫu gốc cũng chia lệch về phía chữ. */
@media (min-width: 980px) {
  body.theme-dien .hero-canh { grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); }
}
body.theme-dien .nut-nho, body.theme-dien .dau-trong nav a.nut-nho { border-radius: 0; }
body.theme-dien .chip, body.theme-dien .dv-the .bt-o,
body.theme-dien .the, body.theme-dien .dv-the, body.theme-dien .bang-anh-khung { border-radius: 0; }
body.theme-dien section { padding: 96px 0; }
body.theme-dien section + section { border-top: none; }
/* Mẫu không dùng lưới kẻ: từng ô là một thẻ trắng RỜI, góc vuông, bóng rất
   nhạt trải rộng. Tháo lưới kẻ ra thành thẻ rời — nền lưới, viền và bóng của
   khung đều phải bỏ, nếu không khe gap 22px sẽ lòi ra một mảng xám. */
body.theme-dien .luoi-vach, body.theme-dien .buoc {
  background: none; border: none; box-shadow: none; border-radius: 0; gap: 22px;
}
body.theme-dien .luoi-vach > *, body.theme-dien .buoc > div { box-shadow: 0 1px 10px rgba(0,0,0,.1); }
body.theme-dien .luoi-vach .dv-the:hover {
  background: var(--the); box-shadow: 0 6px 26px rgba(0,0,0,.15); transform: translateY(-3px);
}


body.theme-bien {

/* Đo trên trang mẫu: Roboto 48px/700 line-height 1.33 KHÔNG giãn chữ, thân
   Open Sans 14px/1.7, nút thấp 41px chữ 14px nét 400 bo 0, thẻ bo 2px với
   bóng tỏa đều `0 0 8px rgba(0,0,0,.1)` chứ không đổ xuống, đầu trang cao
   219px vì chia hai tầng.
   Đây là bộ NHỎ VÀ KHẼ nhất trong sáu: tiêu đề vừa phải, dòng thưa, nút nhẹ
   nét — chỗ khác với "xanh điện" (chữ khổng lồ, nút to) tuy cùng họ xanh. */
body.theme-bien {
  --r: 2px; --r-nho: 2px; --r-lon: 3px;
  --bong:     0 0 8px rgba(0,0,0,.10);
  --bong-cao: 0 0 18px rgba(0,0,0,.13);
  font-size: 15px; line-height: 1.75;
}
body.theme-bien h1 { font-size: clamp(28px, 4vw, 48px); line-height: 1.24; letter-spacing: -.01em; font-weight: 700; }
body.theme-bien h2 { font-size: clamp(21px, 2.4vw, 30px); line-height: 1.3; letter-spacing: -.008em; font-weight: 700; }
body.theme-bien h3 { font-size: 17.5px; letter-spacing: 0; }
body.theme-bien .nut { border-radius: 2px; padding: 12px 24px; font-size: 14px; font-weight: 500; }
body.theme-bien .nut-nho, body.theme-bien .dau-trong nav a.nut-nho { border-radius: 2px; font-size: 14px; }
body.theme-bien .chip, body.theme-bien .dv-the .bt-o { border-radius: 2px; }
body.theme-bien .hero-lon > .khung, body.theme-bien .hero > .khung { border-radius: 3px; }
body.theme-bien .bang-anh-khung { border-radius: 3px; }
body.theme-bien section { padding: 52px 0; }
/* Đầu trang của mẫu cao gấp đôi vì chia hai tầng. Ở đây không đổi HTML nên
   không chia được tầng, nhưng nới chiều cao và phóng logo thì đọc ra cùng
   một nhịp. */
body.theme-bien .dau-trong { padding: 18px 0; }
body.theme-bien .logo-dau { height: 42px; }
body.theme-bien .dau-trong nav a { font-size: 14px; font-weight: 400; }
/* Thẻ rời có bóng tỏa đều, không kẻ lưới. */
body.theme-bien .luoi-vach, body.theme-bien .buoc {
  background: none; border: none; box-shadow: none; border-radius: 0; gap: 18px;
}
body.theme-bien .luoi-vach > *, body.theme-bien .buoc > div {
  border-radius: 2px; box-shadow: 0 0 8px rgba(0,0,0,.10);
}
body.theme-bien .luoi-vach .dv-the:hover {
  background: var(--the); box-shadow: 0 0 16px rgba(0,0,0,.17); transform: translateY(-2px);
}


body.theme-kem {

  --the:           #FFFFFF;   /* thẻ trắng, tách nhau bằng viền */
  --muc:           #14151E;   /* 17.3:1 trên nền */
  --muc-mo:        #525568;   /* sáng nhất còn đạt AAA 7:1 */

  --th-2:          #4C5070;   /* L=0.44 — đầu gradient hero */
  --th-dam:        #1C1F3B;   /* màu tối gốc của mẫu */
  --th-nen:        #EEF0F8;   /* nền chip */
  --th-vien:       #CCCFDA;   /* viền chip */
  --sang:          #FFDC69;   /* màu nhấn gốc của mẫu */
  --sang-muc:      #715000;   /* màu nhấn hạ tối tới AAA 7:1 — khi nó phải làm CHỮ trên nền sáng */
  --sang-tren-toi: #FFDC69;   /* màu nhấn làm chữ trên tấm hero — 12.0:1 */
  --tren-sang:     #0A0B11;   /* chữ trên mảng màu nhấn — 14.7:1 */
  --tren-th:       #FFFFFF;
  --tren-dam:      #F3F3F6;   /* 14.5:1 trên nền tối */
  --tren-dam-mo:   #82879E;   /* mờ nhất còn đạt AA 4.5:1 trên nền tối */
  --nhan-manh:     #14151E;

  --bong-cao:      0 2px 4px rgba(28,31,59,.08), 0 22px 44px -20px rgba(28,31,59,.46);
  --sv-net:        #494C5C;

}
body.theme-kem header.dau { background: var(--th-dam); border-bottom: 1px solid rgba(255,255,255,.10); }
body.theme-kem .hero-lon > .khung {
  background: radial-gradient(120% 130% at 78% 8%, var(--th-2) 0%, var(--th-dam) 74%);
  border: 1px solid rgba(255,255,255,.10);
}
.gd-mau-kem {
  background: linear-gradient(180deg, #4C5070 0%, #1C1F3B 44%, #FFF9ED 44%, #F6F0E4 100%);
  box-shadow: inset -14px 0 0 -8px #FFDC69;
}

/* Đo trên trang mẫu: tiêu đề Manrope 72px/700 line-height 1.2, thân Inter
   18px/500 — thân bài to hơn hẳn mức thường; nút bo 12px, đệm 14px 24px, nét
   500; khối thở 150px/150px; và điểm riêng nhất: các ô KHÔNG có bóng, KHÔNG
   có viền — chúng là những MẢNG MÀU PHẲNG luân phiên (chàm / vàng nắng / kem).
   Bộ này vì thế đi ngược cả năm bộ kia: mềm, to, phẳng. */
body.theme-kem {
  --r: 14px; --r-nho: 10px; --r-lon: 22px;
  font-size: 17px;
}
body.theme-kem h1 { font-size: clamp(33px, 5vw, 58px); line-height: 1.16; letter-spacing: -.026em; font-weight: 700; }
body.theme-kem h2 { font-size: clamp(24px, 3vw, 36px); line-height: 1.18; letter-spacing: -.022em; font-weight: 700; }
body.theme-kem .nut { border-radius: 12px; padding: 15px 24px; font-size: 16px; font-weight: 600; }
body.theme-kem .nut-nho, body.theme-kem .dau-trong nav a.nut-nho { border-radius: 10px; }
body.theme-kem .dau-trong nav a { border-radius: 10px; }
body.theme-kem .dv-the .bt-o { border-radius: 14px; }
body.theme-kem section { padding: 100px 0; }
/* Mẫu chia khối bằng khoảng trống lớn, không bằng đường kẻ. */
body.theme-kem section + section { border-top: none; }
body.theme-kem .the { border: none; box-shadow: none; background: var(--nen-2); border-radius: 14px; }
body.theme-kem .luoi-vach, body.theme-kem .buoc {
  background: none; border: none; box-shadow: none; border-radius: 0; gap: 16px;
}
body.theme-kem .luoi-vach > *, body.theme-kem .buoc > div { border-radius: 14px; }
/* Ba màu luân phiên như mẫu. nth-child chứ không phải class vì HTML dùng
   chung cho mọi giao diện — không đổi template chỉ để đổi màu ô.
   Ô thứ ba KHÔNG lấy --nen-2: nền trang của bộ này đã là kem, hai màu trùng
   nhau nên ô thứ ba trông như một lỗ thủng giữa lưới. Pha vàng nắng vào nền
   thẻ cho nó là một mảng thật. */
body.theme-kem .luoi-vach > *:nth-child(3n+2) { background: var(--th-nen); }
body.theme-kem .luoi-vach > *:nth-child(3n)   { background: color-mix(in srgb, var(--sang) 15%, var(--the)); }
body.theme-kem .buoc > div { background: var(--nen-2); }
body.theme-kem .luoi-vach .dv-the:hover {
  background: color-mix(in srgb, var(--sang) 30%, var(--the)); box-shadow: none;
}

/* KHÔNG đo được: trang demo của MobRepair (ThemeForest 19191980) không truy
   cập được — xem ghi chú màu ở đầu phần này. Dáng dưới đây dựng theo lối
   chung của dòng mẫu sửa điện thoại chứ không phải đọc từ mẫu thật.

   Nét riêng: chữ tiêu đề IN HOA nét dày (ngược với cobalt — cũng in hoa nhưng
   nét mảnh giãn rộng), góc vuông, và mọi ô mang một vạch đỏ ở mép trái. Vạch
   là cách giữ cho đỏ không phải tô thành mảng: đỏ tô mảng lớn thì đọc ra
   cảnh báo lỗi chứ không đọc ra thương hiệu. */
body.theme-do { --r: 0px; --r-nho: 0px; --r-lon: 2px; }

body.theme-do .hero-lon > .khung, body.theme-do .hero > .khung { border-radius: 2px; }
/* Vạch đỏ mép trái. .dv-the đã có sẵn vạch ấy cho lúc rê chuột — ở bộ này nó
   hiện thường trực, mờ hơn, và đậm lên khi rê. Thẻ tĩnh thì dùng viền trái. */

  --muc-mo:        #4B5B68;   /* sáng nhất còn đạt AAA 7:1 */
  --vien:          #D3DAE1;   /* viền trang trí */
  --vien-dam:      #8697A6;   /* nhạt nhất còn đạt 3:1 — WCAG 1.4.11 */
  --th:            #3B4A57;   /* L=0.40 — nền nút, chữ trắng còn AAA */

  --sang-tren-toi: #FF6B00;   /* màu nhấn làm chữ trên tấm hero — 4.7:1 */
