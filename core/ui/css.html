   (3px) cho cân với chiều cao đã bóp lại. */
body.la-app .tb-chuamo {
  margin: 6px 0 0; padding: 7px 11px; border-radius: 12px;
  border-left-width: 3px;
  font: 500 clamp(10.5px, 1.45svh, 12px)/1.38 Roboto, system-ui, sans-serif;
}
body.la-app .app-cho:active {
  transform: scale(.99); filter: brightness(.94);
}

/* Mạng xã hội trong bảng hiệu app. Hai cột auto: một trang thì ra một ô, bốn
   trang thì ra vuông 2×2 — không bao giờ thành hàng dài bốn cái đẩy tên trạm
   ra khỏi chỗ.

   flex: none để nó không co lại khi tên trạm dài; khối logo bên trái mới là
   thứ được phép nhường chỗ. */
body.la-app .app-bia-mxh {
  flex: none; display: grid; grid-template-columns: repeat(2, auto); gap: 2px;
}
body.la-app .app-bia-mxh a {
  display: grid; place-items: center; width: 23px; height: 23px;
  border-radius: 7px; color: var(--muc);
}
body.la-app .app-bia-mxh .bt { width: 15px; height: 15px; }
body.la-app .app-bia-mxh a:active { background: var(--md-surface-variant); }

/* --- Băng ảnh việc thật ---------------------------------------------------
   Tràn hết bề ngang bằng cách ăn ngược lề của .app-than. Cuộn ngang có điểm
   dừng nên vuốt một cái là đúng một tấm, không dừng lưng chừng giữa hai ảnh.

   overscroll-behavior-x: contain chặn cử chỉ "vuốt để lùi trang" của trình
   duyệt lúc vuốt hết tấm cuối — thiếu dòng này thì khách xem tới ảnh cuối rồi
   vuốt thêm một cái là văng ra khỏi app. */
body.la-app .app-bang {
  display: flex; gap: 8px; margin: 0 calc(-1 * var(--app-le)) 14px;
  padding: 0 var(--app-le); overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scrollbar-width: none;
}
body.la-app .app-bang::-webkit-scrollbar { display: none; }
body.la-app .app-bang-o {
  flex: 0 0 calc(100% - 26px); margin: 0; position: relative;
  scroll-snap-align: center; border-radius: 16px; overflow: hidden;
  background: var(--md-surface-container);
  box-shadow: 0 8px 20px -10px rgba(46, 42, 94, .38), 0 1px 2px rgba(46, 42, 94, .12);
}
body.la-app .app-bang-o img {
  display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
}
/* Chú thích in đè lên ảnh, không đẩy khung cao thêm. Dải tối chỉ ở đáy, đủ để
   chữ trắng đọc được trên ảnh sáng. */
body.la-app .app-bang-o figcaption {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 12px 9px;
  font: var(--md-label-l); color: #fff;
  background: linear-gradient(180deg, rgba(12, 14, 4, 0) 0%, rgba(12, 14, 4, .72) 100%);
}

/* --- Tiêu đề mục ----------------------------------------------------------
   Title-medium của M3, kèm một vạch volt ngắn bên trái. Vạch ấy thay cho cỡ
   chữ to: bốn mục nối nhau cần dấu phân đoạn, mà chữ to thì tốn chiều cao. */
body.la-app .app-muc-ten {
  display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
  font: var(--md-title-m); letter-spacing: 0; color: var(--md-on-surface);
}
body.la-app .app-muc-ten::before {
  content: ""; width: 4px; height: 16px; border-radius: 2px; flex: none;
  background: linear-gradient(180deg, var(--green-2), var(--md-primary));
}

/* --- Ô việc trong lưới ----------------------------------------------------
   Khối nổi: nền chuyển sắc, một vạch sáng trong ở mép trên làm cạnh vát, hai
   tầng bóng bên dưới. Nhấn xuống thì lún — ô hạ 1px và bóng co lại.

   Có viền, dù đã có bóng. Trước đây để border:none và giao hết việc tách lớp
   cho bóng đổ; đo ra thẻ #FBFCF6 trên tấm trắng chỉ được 1.03:1, nghĩa là
   tám ô không có mép, chỉ có một vệt mờ dưới đáy. Bóng tả độ cao chứ không
   tả ranh giới — ranh giới phải là đường kẻ. */
body.la-app .app-luoi-nho { gap: 9px; max-width: 460px; }
body.la-app .app-o {
  align-items: center; text-align: center; gap: 8px;
  min-height: 0; padding: 12px 6px 11px; border-radius: 16px;
  border: 1px solid var(--vien);
  background: linear-gradient(163deg, var(--the) 0%, var(--kem-2) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .9),
    0 6px 14px -8px rgba(46, 42, 94, .40),
    0 1px 2px rgba(46, 42, 94, .10);
  transition: transform .13s ease, box-shadow .13s ease;
}
body.la-app .app-o:hover {
  border-color: var(--vien-dam);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .9),
    0 9px 18px -8px rgba(46, 42, 94, .46),
    0 1px 2px rgba(46, 42, 94, .12);
}
body.la-app .app-o:active {
  transform: translateY(1px) scale(.985);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 3px 8px -5px rgba(46, 42, 94, .40);
}
/* Việc nổi bật (tích ở /qt/dich-vu, bật/tắt cả cụm ở /qt/giao-dien).

   Vành vẽ bằng box-shadow inset chứ không tăng border-width: lưới này là
   grid-auto-rows 1fr ở màn hình đơn, một ô dày thêm 1px là cả hàng cao thêm
   1px, mà /app thì cấm cuộn.

   Ngôi sao đặt absolute, đè lên góc ô. Không chiếm dòng nào trong luồng nên
   ô nổi bật cao đúng bằng ô thường. */
body.la-app .app-o-noi {
  position: relative;
  border-color: var(--sang);
  box-shadow:
    inset 0 0 0 1px var(--sang),
    inset 0 1px 0 rgba(255, 255, 255, .9),
    0 6px 14px -8px rgba(46, 42, 94, .40),
    0 1px 2px rgba(46, 42, 94, .10);
}
body.la-app .app-o-noi:hover { border-color: var(--sang); }
body.la-app .app-o-sao {
  position: absolute; top: 4px; right: 4px; display: block;
  pointer-events: none;
}
/* Sao VÀNG nhận diện chứ không phải tím của chủ đề: nó phải nhảy ra khỏi ô
   trong một cái liếc. --lime vốn chỉ dành cho nền tối, đặt lên ô gần trắng
   thì nhoè mất, nên viền thêm một nét hổ phách --lime-dam. Nét 0.9 trên khung
   24, ở cỡ 13px là hơn nửa điểm ảnh: đủ tách hình khỏi nền mà không biến
   ngôi sao đặc thành hình vẽ nét. */
body.la-app .app-o-sao .bt {
  width: 13px; height: 13px;
  fill: var(--lime); stroke: var(--lime-dam); stroke-width: .9;
}

/* Ô "Việc khác" là lối thoát chứ không phải một việc — viền đứt để nó không
   đứng ngang hàng với tám việc thật. */
body.la-app .app-o-hoi {
  background: transparent; box-shadow: none;
  border: 1px dashed var(--md-outline-variant);
}
body.la-app .app-o-hoi:hover { box-shadow: none; border: 1px dashed var(--md-outline); }
body.la-app .app-luoi-nho .app-bt .btm { width: 44px; height: 44px; }
body.la-app .app-luoi-nho .app-ten {
  font-size: 11.5px; line-height: 1.3; margin-top: 0; -webkit-line-clamp: 3;
}
/* Tên việc chỉ còn hai dòng khi ô có thêm dòng giá — ba dòng tên cộng một
   dòng số là ô cao hơn ô không có giá, hàng lưới so le. */
body.la-app .app-luoi-nho .app-o:has(.app-o-gia) .app-ten { -webkit-line-clamp: 2; }
body.la-app .app-o-gia { color: var(--md-primary); }
body.la-app .app-luoi-chu {
  color: var(--md-on-surface-variant);
  font: 400 12px/1.5 Roboto, system-ui, sans-serif;
}

/* --- Giá trong trang từng dịch vụ -----------------------------------------
   Trước đây tám dòng giá xếp thành một bảng ở màn hình đầu. Bảng ấy bỏ rồi:
   nó bắt người ta dò tên việc của mình giữa tám dòng, trong khi bấm vào đúng
   ô việc là tới thẳng trang này. Ở đây chỉ còn MỘT con số, nên nó được to.

   Nhãn nằm trên, số nằm dưới — không xếp trái/phải như bảng cũ. Trang này con
   số là thứ khách xuống tìm; cho nó đứng riêng một dòng thì mắt bắt được ngay
   mà không phải quét ngang. */
body.la-app .app-dv-gia {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  margin: 14px 0 8px; padding: 12px 15px 13px; border-radius: 16px;
  background: var(--md-surface-container-lowest);
  border: 1px solid var(--md-outline-variant);
}
body.la-app .app-dv-gia-nhan {
  font: var(--md-label-m); letter-spacing: .3px; text-transform: uppercase;
  color: var(--md-on-surface-variant);
}
body.la-app .app-dv-gia-so {
  font: 700 27px/1.15 "Roboto Mono", ui-monospace, monospace;
  color: var(--md-primary); font-variant-numeric: tabular-nums;
}
/* "từ" là chú thích của con số chứ không phải một phần con số — nhỏ, mờ, và
   KHÔNG mono, để mắt không đọc nó thành chữ số. */
body.la-app .app-dv-gia-so i {
  font: 400 13px/1 Roboto, system-ui, sans-serif;
  color: var(--md-on-surface-variant); margin-right: 3px;
}
/* Khoảng giá là hai con số trong một dòng — ở 27px nó xuống hàng ngay giữa
   chữ "đến", đọc thành hai giá rời. Bóp theo bề ngang máy để nó ở lại một
   dòng; vẫn là con số to nhất màn hình này. */
body.la-app .app-dv-gia-khoang {
  font-size: clamp(18px, 6.1vw, 24px);
}
/* Hai trạng thái không-có-số thì thôi làm số to: chúng là chữ, để nguyên dạng
   viên thuốc như cũ, cỡ chữ thường. */
body.la-app .app-gia-hoi,
body.la-app .app-gia-mp {
  font: var(--md-label-m); letter-spacing: .2px; padding: 5px 11px;
  border-radius: 999px; color: var(--md-on-secondary-container);
  background: var(--md-secondary-container);
}
body.la-app .app-dv-gia-so.app-gia-hoi,
body.la-app .app-dv-gia-so.app-gia-mp { font: var(--md-label-m); }
@media (prefers-reduced-motion: reduce) {
  body.la-app .app-o,
  body.la-app .app-luoi-nho .app-bt { transition: none; }
  body.la-app .app-o:active .app-bt { transform: none; }
  /* JS đã tự đứng im khi máy bật "giảm chuyển động", nhưng chặn thêm ở đây:
     luật CSS đúng kể cả khi JS chưa chạy hoặc bị chặn. */
  body.la-app .app-luoi-nho .app-bt.dong { animation: none; }
}

/* --- Thẻ đơn máy nhớ giùm -------------------------------------------------
   Nền volt đặc: đây là thứ duy nhất trên màn hình dành riêng cho người đã gửi
   vợt, và họ mở app ra chỉ để bấm đúng nó. */
body.la-app .app-luu {
  display: flex; align-items: center; gap: 8px; margin: 0 0 12px;
  padding: 8px 8px 8px 12px; border-radius: 14px;
  background: linear-gradient(160deg, var(--green-2) 0%, var(--md-primary-container) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 4px 12px -7px rgba(60, 74, 0, .5);
}
body.la-app .app-luu-mo {
  flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 9px;
  background: none; border: none; padding: 4px 0; min-height: 0;
  font: var(--md-label-l); color: var(--md-on-primary-container);
  text-align: left; cursor: pointer;
}
body.la-app .app-luu-mo .bt { width: 20px; height: 20px; flex: none; }
body.la-app .app-luu-mo .so { font-family: "Roboto Mono", ui-monospace, monospace; }
body.la-app .app-luu-quen {
  flex: none; min-height: 32px; padding: 0 12px; border-radius: 999px;
  background: rgba(255, 255, 255, .55); border: none;
  font: var(--md-label-m); color: var(--md-on-primary-container); cursor: pointer;
}

/* --- Khối gấp "Trạm làm thế nào" -----------------------------------------
   Bóp cho khớp bốn khối trên: bản cũ bo 14px kèm padding 16px, đứng ngay dưới
   thẻ cam kết bo 14px thì lệch một sợi tóc — không ai chỉ ra được là lệch,
   nhưng nhìn vào thấy xộc xệch. */
body.la-app .app-gap {
  border-radius: 14px; background: var(--md-surface-container-lowest);
  border: 1px solid var(--md-outline-variant); margin-top: 14px;
}
body.la-app .app-gap:first-of-type { margin-top: 14px; }
body.la-app .app-gap > summary { padding: 10px 12px; gap: 11px; }
body.la-app .app-gap-bt {
  flex: none; width: 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: var(--md-on-primary-container);
  background: linear-gradient(158deg, var(--green-2) 0%, var(--md-primary-container) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .75), 0 4px 9px -5px rgba(60, 74, 0, .55);
}
body.la-app .app-gap-bt .bt { width: 20px; height: 20px; }
body.la-app .app-gap-ten { font: var(--md-title-m); font-size: 14.5px; }

/* --- Thanh dưới đáy -------------------------------------------------------
   Navigation bar của M3: nền surface-container, nhãn label-medium, mục đang
   mở có viên thuốc volt sau icon. */
body .app-chan {
  background: var(--md-surface-container);
  border-top: 1px solid var(--md-outline-variant);
}
body .app-chan a { font: var(--md-label-m); gap: 2px; padding: 8px 3px 9px; }
body .app-chan a.dang { color: var(--md-on-surface); font-weight: 700; }
body .app-chan a .bt { width: 22px; height: 22px; }
body .app-chan a.app-chi-duong { color: #d32f2f; }
/* Viên thuốc sau icon của mục đang mở. M3 báo mục đang mở bằng cái này chứ
   không bằng đổi màu chữ. Viên thuốc nay tô ô-liu nên nét icon phải lật sang
   trắng — nét tối trên mảng tối là không thấy gì. */
body .app-chan a.dang > .bt:first-child,
body .app-chan a.dang > svg:first-child {
  background: var(--md-primary-container); color: var(--md-on-primary-container);
  border-radius: 999px;
  padding: 3px 14px; box-sizing: content-box; width: 22px; height: 22px;
}
body .app-chan-tron .tron {
  background: linear-gradient(158deg, var(--green-2) 0%, var(--md-primary-container) 100%);
  color: var(--md-on-primary-container); border-color: var(--md-surface-container);
  box-shadow: 0 6px 16px -6px rgba(60, 74, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .8);
}

/* ==========================================================================
   KHỐI NỔI CHO HÌNH DỊCH VỤ — cái Kendy gọi là "dạng 4D"
   Tám hình việc là SVG phẳng: một ô bo góc màu, thân vợt tô đặc, chỗ hỏng tô
   cam. Đọc thì rõ, nhưng nằm cạnh nhau trông vẫn là hình vẽ dán lên giấy.

   Không sửa 12 tệp SVG để thêm chuyển sắc vào từng hình — sửa một chỗ ở đây
   là xong cả tám, và hình gốc giữ nguyên để còn dùng lại ở trang web.
   Ba lớp làm nên chiều sâu:
     1. drop-shadow theo đúng hình bo góc  → vật có bóng, tức là nó nổi trên
        mặt phẳng chứ không nằm trong mặt phẳng.
     2. men bóng phủ trên (::after)        → sáng ở nửa trên, tối ở mép dưới,
        đúng cách ánh sáng rơi lên một khối lồi.
     3. hai vạch inset                     → cạnh vát trên và chân tối dưới.
   Chỉ áp trong .app-luoi-nho: đấy là chỗ hình vuông đúng cỡ. Icon nét ở chỗ
   khác mà phủ men vào thì thành ô vuông mờ, không ra hình gì.
   ========================================================================== */
body.la-app .app-luoi-nho .app-bt {
  position: relative; display: inline-flex;
  transition: transform .2s cubic-bezier(.34, 1.56, .64, 1);
}
body.la-app .app-o:active .app-bt { transform: scale(.86) rotate(-7deg); }

/* Nhúc nhích một mình. Mỗi nhịp JS gắn .dong vào ĐÚNG MỘT icon rồi gỡ ra —
   tám icon cùng nhảy thì màn hình thành cái đèn nháy, mắt không biết đậu vào
   đâu và nhìn vài giây là mỏi. Một cái động giữa bảy cái đứng yên thì mắt tự
   bị kéo tới, đấy mới là thứ muốn.

   Cùng đường cong vượt đà với cú chạm (.34,1.56 và .34,1.4) nên hai chuyển
   động là họ hàng: cái tự chạy trông như cái người ta vừa bấm, nhẹ hơn một
   chút. Khác cong là icon động ra một kiểu, bấm ra một kiểu, thành hai vật
   khác nhau.

   Không đặt animation-fill-mode: hết animation thì transform trả về giá trị
   thường, để :active lúc chạm vẫn ăn. (JS còn gỡ .dong ngay lúc pointerdown
   nữa — animation đang chạy thì đè lên :active, ngón tay bấm mà icon không
   lún xuống là mất cảm giác bấm.) */
@keyframes app-bt-nhun {
  0%   { transform: scale(1) rotate(0deg); }
  20%  { transform: scale(.88) rotate(-7deg); }
  46%  { transform: scale(1.12) rotate(5deg); }
  70%  { transform: scale(.98) rotate(-2deg); }
  100% { transform: scale(1) rotate(0deg); }
}
body.la-app .app-luoi-nho .app-bt.dong {
  animation: app-bt-nhun .68s cubic-bezier(.34, 1.4, .64, 1);
}
body.la-app .app-luoi-nho .app-bt .btm {
  border-radius: 29.2%;                       /* = rx 7 trên khung 24 của SVG */
  filter:
    drop-shadow(0 3px 4px rgba(28, 36, 6, .30))
    drop-shadow(0 1px 1px rgba(28, 36, 6, .16));
}
body.la-app .app-luoi-nho .app-bt::after {
  content: ""; position: absolute; inset: 0; border-radius: 29.2%;
  pointer-events: none;
  background: linear-gradient(177deg,
    rgba(255, 255, 255, .60) 0%,
    rgba(255, 255, 255, .10) 33%,
    rgba(255, 255, 255, 0) 51%,
    rgba(24, 30, 6, .09) 80%,
    rgba(24, 30, 6, .21) 100%);
  box-shadow:
    inset 0 1.2px 0 rgba(255, 255, 255, .92),
    inset 0 -1.4px 2px rgba(24, 30, 6, .20);
}
/* Nhấn xuống thì khối lún: bóng co lại, men mờ đi. Cả ô .app-o cũng đang hạ
   1px, hai thứ đi cùng nhau mới ra cảm giác bấm vào vật thật. */
body.la-app .app-o:active .app-bt .btm {
  filter: drop-shadow(0 1px 2px rgba(28, 36, 6, .34));
}
body.la-app .app-o:active .app-bt::after { opacity: .55; }

/* Logo trên bảng hiệu cũng là hình phẳng — cho nó cùng một nguồn sáng với
   tám ô bên dưới, nếu không thì đầu trang trông dán lên, thân trang nổi lên. */
body.la-app .app-bia .logo-dau,
body.la-app .app-bia .logo-4d,
body.la-app .app-bia .chu-tpic {
  filter:
    drop-shadow(0 3px 4px rgba(46, 42, 94, .26))
    drop-shadow(0 1px 0 rgba(255, 255, 255, .55));
}

/* ==========================================================================
   THANH TẢI TRÊN ĐỈNH — chạy lúc đang sang trang
   Trang này dựng ở máy chủ, bấm link là trình duyệt đi lấy trang mới. Khoảng
   giữa lúc bấm và lúc trang mới hiện ra, màn hình đứng im y hệt như lúc chưa
   bấm — khách tưởng nút chết nên bấm lại lần nữa. Một vạch chạy trên đỉnh là
   câu trả lời rẻ nhất: "nghe rồi, đang đi lấy".

   Chờ 90ms mới hiện (đoạn JS trong pwa.html): mạng nhanh thì trang mới về
   trước lúc ấy, mà một vạch loé lên 40ms rồi tắt còn khó chịu hơn không có gì.
   ========================================================================== */
.app-tai {
  position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 90;
  pointer-events: none; overflow: hidden;
  opacity: 0; transition: opacity .16s linear;
  background: rgba(78, 96, 0, .13);   /* máy cũ chưa biết color-mix */
  background: color-mix(in srgb, var(--sang-muc) 14%, transparent);
}
.app-tai i {
  display: block; width: 100%; height: 100%; border-radius: 0 3px 3px 0;
  transform: translateX(-100%) scaleX(.3); transform-origin: 0 50%;
  background: linear-gradient(90deg,
    rgba(78, 96, 0, .5) 0%, var(--sang) 62%, #fff 100%);
  background: linear-gradient(90deg,
    color-mix(in srgb, var(--sang-muc) 55%, transparent) 0%,
    var(--sang) 62%, #fff 100%);
}
html.dang-tai .app-tai { opacity: 1; }
html.dang-tai .app-tai i { animation: app-tai-chay 1.05s cubic-bezier(.35, 0, .2, 1) infinite; }
@keyframes app-tai-chay {
  0% { transform: translateX(-100%) scaleX(.3); }
  52% { transform: translateX(52%) scaleX(.62); }
  100% { transform: translateX(210%) scaleX(.3); }
}
/* Máy xin bớt chuyển động: vẫn phải biết là trang đang đi, nên giữ vạch
   nhưng để nó đứng yên một đoạn chứ không chạy. */
@media (prefers-reduced-motion: reduce) {
  html.dang-tai .app-tai i { animation: none; transform: translateX(0) scaleX(.4); }
}

/* ==========================================================================
   NÚT LIÊN HỆ GIỮA THANH ĐÁY — số điện thoại và Zalo chung một chỗ
   Kendy: "Zalo phải cùng với cái sđt vì nó là liên hệ". Đúng. Hai thứ ấy là
   hai đường tới cùng một người; xếp thành hai ô ngang hàng là bắt khách chọn
   giữa hai cái giống nhau, mà lại ăn mất ô thứ năm vốn dẫn vào Quy trình. Nay
   ô năm trả về Quy trình, nút giữa nở ra hai dòng khi bấm.

   Dùng <details> chứ không dựng menu bằng JS: mở/đóng là việc trình duyệt làm
   sẵn, JS chỉ còn đúng một việc — đóng khi bấm ra chỗ khác. Máy tắt JS vẫn
   bấm mở bấm đóng được.

   Luật `.app-chan a` không với tới <details>, nên phần căn chỉnh phải khai
   lại đủ ở đây. Trông thừa nhưng không thừa: xoá dòng nào là nút giữa tụt
   khỏi hàng dòng ấy.
   ========================================================================== */
.app-chan details.app-lh { flex: 1 1 0; flex-grow: 1.3; min-width: 0; position: relative; }
.app-chan details.app-lh > summary {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 0 3px 10px; color: var(--muc); font-weight: 650;
  font-size: 11px; line-height: 1.2; text-align: center;
  list-style: none; cursor: pointer;
}
.app-chan details.app-lh > summary::-webkit-details-marker { display: none; }
.app-chan details.app-lh > summary::marker { content: ""; }
.app-chan details.app-lh > summary:active .tron { filter: brightness(.93); }
.app-chan details.app-lh[open] > summary .tron { filter: brightness(.93); }

/* Hai dòng bật lên: neo vào nút, mở NGƯỢC LÊN TRÊN. Nút nằm sát đáy màn hình
   nên mở xuống là chui ra ngoài. translateX(-50%) để bảng nằm giữa nút chứ
   không lệch — nút giữa rộng hơn bốn nút kia, canh theo mép trái là lệch. */
.app-chan .app-lh-menu {
  position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
  z-index: 40; min-width: 212px; padding: 6px;
  border-radius: 16px; background: var(--the); border: 1px solid var(--vien);
  box-shadow: 0 14px 34px -12px rgba(46, 42, 94, .58), 0 2px 8px rgba(46, 42, 94, .14);
}
.app-chan .app-lh-menu a {
  display: flex; flex-direction: row; align-items: center; gap: 11px;
  padding: 9px 11px; border-radius: 11px; text-align: left;
  color: var(--muc); text-decoration: none; font-size: 14px; font-weight: 650;
}
.app-chan .app-lh-menu a:active { background: var(--th-nen); }
.app-chan .app-lh-menu .bt { flex: none; width: 22px; height: 22px; color: var(--sang-muc); }
.app-chan .app-lh-menu a span { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.app-chan .app-lh-menu a b {
  font: 400 12px/1.25 "Roboto Mono", ui-monospace, monospace;
  color: var(--muc-mo); font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}

/* ==========================================================================
   MÀN HÌNH ĐẦU GÓI TRONG ĐÚNG MỘT MÀN — body.la-app.man-1
   Kendy chốt: "tất cả cho vào 1 trang không có kéo chuột". Trang này KHÔNG
   cuộn, không vuốt ngang. Mọi thứ phải lọt giữa bảng hiệu và thanh đáy.

   ĐO BẰNG KHUNG NHÌN, KHÔNG ĐO BẰNG MÀN HÌNH MÁY. Bài học đã trả giá một lần,
   ghi ra đây để đừng trả lần nữa: bản trước bóp theo ba nấc @media
   (700 / 660 / 620px) và nghiệm thu bằng chiều cao MÀN HÌNH máy — 844, 667,
   640. Sai chỗ đó. Khung nhìn thật của trình duyệt là màn hình TRỪ thanh địa
   chỉ và thanh điều hướng, hụt đi 100-150px:
     iPhone 390x844  → còn ~700px, trên ngưỡng 620 nên vừa.
     Android 360x640 → còn ~510px, RƠI XUỐNG dưới 620 nên trúng nấc cuối, mà
     nấc ấy chính là nấc "trả lại cách cuộn cũ".
   Kendy báo đúng hiện tượng ấy: "iphone thì full còn android ko full".

   → Không còn nấc nào để rơi qua. Mọi kích thước ở đây là
     clamp(sàn, k·svh, trần): co LIÊN TỤC theo khung nhìn thật. Sàn là ngưỡng
     đọc được, trần là cỡ dễ chịu trên máy cao.
   → svh chứ không dvh: svh đo lúc thanh địa chỉ ĐANG HIỆN, tức lúc chật nhất,
     và nó là hằng số — dvh đổi giá trị giữa chừng khi thanh trượt đi, kéo cả
     trang giật lên giật xuống theo.
   → Ngưỡng bỏ cuộc hạ từ 620 xuống 430: dưới 430 là điện thoại xoay ngang, ở
     đó không bố cục nào cứu được, thà cuộn.

   Cách chia chiều cao: body là cột flex ba phần. Bảng hiệu và thanh đáy giữ
   chiều cao thật của chúng; thân ở giữa nhận hết phần còn lại. Trong thân, ba
   khối chữ khoá theo clamp, banner nuốt nốt phần thừa — máy cao banner nở ra,
   máy thấp banner co lại. Thứ hi sinh trước là hình, không phải chữ.

   Thanh đáy chuyển từ fixed sang static: đã là cột flex thì để nó tự chiếm
   chỗ, khỏi đoán chiều cao rồi chừa đệm — đoán sai một lần là hoặc thừa dải
   trắng, hoặc nuốt mất dòng cuối.
   ========================================================================== */
body.la-app.man-1 {
  height: 100vh;                      /* máy cũ chưa biết svh */
  height: 100svh;
  overflow: hidden;
  display: flex; flex-direction: column;
  /* body.la-app chừa 76px dưới đáy cho thanh cố định. Ở đây thanh ấy đã thành
     static trong cột flex, để nguyên padding là thừa hẳn một dải trắng. */
  padding-bottom: 0;
}

/* --- Bảng hiệu ----------------------------------------------------------- */
body.la-app.man-1 .app-bia {
  flex: none;
  padding: calc(clamp(4px, .9svh, 9px) + env(safe-area-inset-top, 0px)) var(--app-le) clamp(4px, .8svh, 7px);
}
body.la-app.man-1 .app-bia-lk { gap: clamp(7px, 1.3svh, 11px); }
body.la-app.man-1 .app-bia .logo-dau,
body.la-app.man-1 .app-bia .logo-4d { height: clamp(26px, 4.25svh, 36px); }
/* Màn hình đơn không cuộn: chữ phải co theo svh y như hình, nếu không thì
   máy màn ngắn bị đội thêm 11px cứng và thanh đáy tụt khỏi màn. */
body.la-app.man-1 .app-bia .chu-tpic { height: clamp(7.5px, 1.2svh, 10px); }
body.la-app.man-1 .app-bia .logo-khoi { gap: clamp(1px, .25svh, 2px); }
body.la-app.man-1 .app-bia-ten { font-size: clamp(15px, 2.05svh, 17px); }
body.la-app.man-1 .app-bia-mo { font-size: clamp(10px, 1.4svh, 11.5px); }
/* --- Dải địa chỉ --------------------------------------------------------
   Co theo svh như mọi thứ khác ở màn không cuộn. Dải này tuy không đẩy thanh
   đáy tụt xuống (banner nuốt phần chênh), nhưng mỗi điểm ảnh nó giữ lại là
   một điểm ảnh banner mất đi — máy màn ngắn banner đã sát trần dưới 44px. */
body.la-app.man-1 .app-cho {
  padding: clamp(4px, .75svh, 7px) clamp(8px, 1.35svh, 11px);
  gap: clamp(6px, 1svh, 8px); border-radius: clamp(9px, 1.5svh, 12px);
}
body.la-app.man-1 .app-cho-nhan { font-size: clamp(8.5px, 1.2svh, 10px); }
body.la-app.man-1 .app-cho > .bt {
  width: clamp(14px, 2.2svh, 18px); height: clamp(14px, 2.2svh, 18px);
}
body.la-app.man-1 .app-cho-chu { font-size: clamp(11px, 1.55svh, 12.5px); }

/* --- Thanh đáy ----------------------------------------------------------- */
body.la-app.man-1 .app-chan { position: static; flex: none; }
body.la-app.man-1 .app-chan a {
  padding-top: clamp(5px, .95svh, 9px); padding-bottom: clamp(5px, 1.05svh, 10px);
}
body.la-app.man-1 .app-chan a.app-chan-tron { padding-top: 0; }
body.la-app.man-1 .app-chan details.app-lh > summary {
  padding-bottom: clamp(5px, 1.05svh, 10px);
}
body.la-app.man-1 .app-chan .bt {
  width: clamp(19px, 2.7svh, 22px); height: clamp(19px, 2.7svh, 22px);
}
body.la-app.man-1 .app-chan-tron .tron {
  width: clamp(42px, 6.4svh, 54px); height: clamp(42px, 6.4svh, 54px);
  margin-top: clamp(-24px, -2.85svh, -16px); border-width: clamp(3px, .45svh, 4px);
}
body.la-app.man-1 .app-chan-tron .tron .bt {
  width: clamp(20px, 3svh, 25px); height: clamp(20px, 3svh, 25px);
}
body.la-app.man-1 .app-chan-so { font-size: clamp(9.5px, 1.28svh, 10.5px); }

/* --- Thân ---------------------------------------------------------------- */
body.la-app.man-1 .app-than {
  flex: 1 1 auto; min-height: 0; width: 100%;
  display: flex; flex-direction: column; gap: clamp(5px, .95svh, 8px);
  padding: 0 var(--app-le) clamp(5px, .95svh, 8px);
}
body.la-app.man-1 .app-than > * { flex: none; }
body.la-app.man-1 .app-luu { margin: 0; }

/* --- Banner: phần co giãn duy nhất ---------------------------------------
   Mặc định là chữ + bản vẽ vợt (hinh-vot-hero), không phải ảnh chụp: khe này
   cao 60-240px và rất ngang, ảnh chụp cắt vào đây thường còn một vệt màu
   không đọc ra cái gì mà vẫn nặng vài trăm KB cho cái vệt ấy. Bản vẽ nhẹ, sắc
   ở mọi cỡ màn, và nói được một câu chào hàng.

   Nhưng đấy là mặc định chứ không phải luật. Chủ trạm chọn được một tấm ở
   /qt/app thì banner đổi sang ảnh ấy (.co-anh) — có ảnh chụp đúng khổ ngang,
   chủ thể lệch phải, thì ảnh thật vẫn hơn hình vẽ. Bỏ chọn là về lại bản vẽ,
   không mất gì.

   min-height là cái phanh: dưới 44px thì chữ không lọt. max-height là cái
   phanh ngược: flex:1 khiến banner nuốt hết phần thừa, máy cao mà không chặn
   thì nó cao bằng cả lưới việc bên dưới. Ẩn hẳn banner ở /qt/app thì cả khối
   biến mất, phần thừa chảy sang lưới việc — lưới cũng flex:1 nên không phải
   sửa gì thêm. */
body.la-app.man-1 .app-bang1 {
  flex: 1 1 auto;
  min-height: clamp(44px, 8svh, 92px); max-height: clamp(60px, 30svh, 240px);
  margin: 0; position: relative; overflow: hidden; border-radius: 16px;
  display: flex; align-items: center;
  padding: clamp(7px, 1.4svh, 16px) clamp(11px, 2svh, 18px);
  background:
    radial-gradient(120% 155% at 86% 14%, rgba(255, 199, 44, .34) 0%, rgba(255, 199, 44, 0) 56%),
    linear-gradient(122deg, #231F47 0%, #393172 54%, #16132F 100%);
  box-shadow: 0 8px 20px -10px rgba(46, 42, 94, .5), 0 1px 2px rgba(46, 42, 94, .14);
}
/* Ảnh đè lên nền volt, không trộn với nó: background rút gọn ghi đè cả hai
   lớp gradient bên trên. Giữ nguyên box-shadow để khối vẫn nổi khỏi mặt nền.

   ::before là lớp phủ tối, và nó phải là gradient chứ không phải một màu đen
   mờ đều: chữ chỉ nằm ở nửa trái (max-width 63%) nên bên trái cần tối để chữ
   đọc được, bên phải cần sáng để còn nhìn ra ảnh. Phủ đều một mức thì hoặc
   chữ mờ, hoặc ảnh thành cục than. Độ đậm --toi do chủ trạm chọn ở /qt/app,
   vì nó phụ thuộc vào tấm ảnh chứ không phải vào bố cục — ảnh chụp ngoài nắng
   và ảnh chụp trong xưởng cần hai mức khác hẳn nhau. */
body.la-app.man-1 .app-bang1.co-anh {
  background: var(--anh) center / cover no-repeat #231F47;
}
/* Video nền. Nằm dưới lớp phủ tối (z-index 1) và dưới chữ (z-index 2), phủ
   kín khung bằng object-fit: cover — khung banner cao theo màn hình nên tỉ lệ
   của nó không bao giờ khớp tỉ lệ clip, và thà cắt mép còn hơn để hai vệt đen
   hai bên.

   pointer-events: none để chạm vào banner không đánh thức bộ điều khiển video
   của trình duyệt. Khách chạm vào đây là đang định bấm cái gì đó, không phải
   định tạm dừng một đoạn phim nền.

   Nền phía sau trả về ĐÚNG bộ gradient volt mặc định, không phải một màu
   trơn. Hai lý do: khung hình đầu chưa về thì chỗ này vẫn phải trông như một
   banner chứ không phải ô đen, và .co-video luôn đi kèm .co-anh — mà .co-anh
   đặt background: var(--anh)..., nên khi có video nhưng chưa chọn ảnh thì
   --anh không tồn tại và cả khai báo ấy hỏng, để lại nền trong suốt. Dòng
   dưới đứng sau nên thắng, và vá luôn cái lỗ đó. */
body.la-app.man-1 .app-bang1.co-video {
  background:
    radial-gradient(120% 155% at 86% 14%, rgba(255, 199, 44, .34) 0%, rgba(255, 199, 44, 0) 56%),
    linear-gradient(122deg, #231F47 0%, #393172 54%, #16132F 100%);
}
body.la-app.man-1 .app-bang1-video {
  position: absolute; inset: 0; z-index: 0;
  width: 100%; height: 100%; object-fit: cover;
  pointer-events: none;
}
body.la-app.man-1 .app-bang1.co-anh::before {
  content: ""; position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(96deg,
    rgba(11, 9, 23, calc(var(--toi) + 18%)) 0%,
    rgba(11, 9, 23, var(--toi)) 52%,
    rgba(11, 9, 23, calc(var(--toi) * .5)) 100%);
}
/* Ảnh chụp có chỗ sáng bất ngờ; thêm một vệt bóng ngay sau chữ để dòng lớn
   không rơi vào đúng một mảng trắng. Rẻ hơn nhiều so với bắt chủ trạm phải
   sửa ảnh trước khi tải lên. */
body.la-app.man-1 .app-bang1.co-anh .app-bang1-chu b,
body.la-app.man-1 .app-bang1.co-anh .app-bang1-chu span {
  text-shadow: 0 1px 3px rgba(9, 8, 20, .55);
}
/* 78% chứ không 63% như bản "Vợt hỏng, sửa được": dòng lớn nay là hai nghề
   xuống dòng thủ công, dòng dài nhất là "Thay đế giày thể thao". Để 72% thì
   trên máy 360px dòng ấy vẫn tự ngắt thêm một lần nữa thành ba dòng, banner
   phải cao thêm ~24px — chỗ ấy phải lấy từ lưới việc. Bản vẽ vợt nằm tràn mép
   phải, phần bị chữ lấn vào là phần đã ra ngoài khung, nên nới bề ngang chữ
   không che mất hình. */
body.la-app.man-1 .app-bang1-chu {
  position: relative; z-index: 2; max-width: 78%;
  display: flex; flex-direction: column; gap: clamp(1px, .38svh, 4px);
}
/* pre-line: chủ trạm gõ Enter ở /qt/app thì banner xuống dòng đúng chỗ ấy.
   Không dùng <br> cứng trong template vì câu này là chữ CMS — nhét thẻ vào
   thì nd phải cho phép HTML, mà cho phép HTML ở một ô chữ thì mở luôn đường
   dán thẻ bậy vào. pre-line vẫn gộp khoảng trắng thừa và VẪN tự ngắt khi
   dòng dài quá, nên máy hẹp không bị tràn chữ ra ngoài khung. */
body.la-app.man-1 .app-bang1-chu b {
  font: 700 clamp(14.5px, 2.32svh, 21px)/1.16 Roboto, system-ui, sans-serif;
  color: var(--lime-nhat); letter-spacing: -.012em;
  white-space: pre-line;
}
body.la-app.man-1 .app-bang1-phu {
  font: 400 clamp(10px, 1.42svh, 13px)/1.32 Roboto, system-ui, sans-serif;
  color: rgba(249, 237, 200, .76);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
/* Bản vẽ tràn ra khỏi mép: cắt cụt là cố ý. Cây vợt nằm gọn trong khung thì
   nó là cái tem dán vào góc; tràn mép thì khung mới trông như cửa sổ nhìn vào
   một chỗ rộng hơn. Nghiêng 11 độ cho khỏi song song với mép khung. */
body.la-app.man-1 .app-bang1-hinh {
  position: absolute; right: -3%; bottom: -20%; z-index: 1;
  height: min(172%, 258px); aspect-ratio: 440 / 570; pointer-events: none;
  transform: rotate(-11deg);
}
body.la-app.man-1 .app-bang1-hinh .sv {
  width: auto; height: 100%;
  --sv-net: rgba(255, 225, 148, .82);
  --sv-mo: rgba(255, 225, 148, .26);
  --sv-nhan: var(--lime);
  --sv-to: rgba(255, 199, 44, .15);
  --sv-canh: #F0A184;
}

/* --- Ba khối chữ --------------------------------------------------------- */
body.la-app.man-1 .app-than section.app-muc {
  margin: 0; border-radius: 14px;
  padding: clamp(6px, 1.05svh, 9px) clamp(8px, 1.2svh, 10px) clamp(7px, 1.15svh, 10px);
}
body.la-app.man-1 .app-muc-ten {
  margin: 0 0 clamp(4px, .8svh, 7px);
  font: 500 clamp(12px, 1.66svh, 14px)/1.42 Roboto, system-ui, sans-serif;
}
body.la-app.man-1 .app-muc-ten::before { height: clamp(11px, 1.55svh, 13px); }

/* --- Lưới việc: vẫn 4 cột, ô thấp lại, chữ hai dòng ----------------------- */
body.la-app.man-1 .app-luoi-nho { gap: clamp(4px, .83svh, 7px); }
body.la-app.man-1 .app-o {
  padding: clamp(4px, .95svh, 8px) 4px; gap: clamp(3px, .6svh, 5px); border-radius: 13px;
}
body.la-app.man-1 .app-luoi-nho .app-bt .btm {
  width: clamp(30px, 5.6svh, 44px); height: clamp(30px, 5.6svh, 44px);
}
body.la-app.man-1 .app-luoi-nho .app-ten {
  font-size: clamp(9px, 1.24svh, 10.5px); line-height: 1.22; -webkit-line-clamp: 2;
}
body.la-app.man-1 .app-o-gia { font-size: clamp(8.5px, 1.16svh, 10px); line-height: 1.2; }
/* Câu chú thích nằm ngoài phần co giãn: lưới là thứ được chia chỗ thừa, câu
   này chỉ lấy đúng chiều cao một dòng của nó. */
body.la-app.man-1 .app-luoi-chu {
  flex: none; margin: clamp(5px, .9svh, 9px) 4px 0;
  font-size: clamp(9.5px, 1.24svh, 11.5px); line-height: 1.38;
}

/* --- Chia lại chỗ trống ---------------------------------------------------
   Bỏ khối giá và khối cam kết là màn hình dôi ra hơn 200px. Để trống thì đáy
   màn hở một mảng, trông như trang bị cụt chứ không như trang gọn.

   Chia cho hai khối còn lại, và chia theo cách khác nhau:
     banner  — cao thêm, vì nó là hình, hình to thì đẹp hơn chứ không loãng.
     lưới việc — ô cao thêm chứ không thêm ô. Tám việc vẫn là tám việc; ô to
                 lên thì ngón tay bấm trúng dễ hơn, đó là lợi ích thật.
   Cả hai đều flex:1 nên khi khuyến mãi bật/tắt, phần chênh tự chảy vào hai
   chỗ này — không phải chỉnh tay hai bố cục. */
body.la-app.man-1 .app-muc-luoi {
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  max-height: clamp(186px, 52svh, 430px);
}
/* Ẩn banner ở /qt/app là dôi ra hơn 200px không ai nhận. Đã thử nới trần lưới
   cho nó nuốt hết: ô cao 225px cho một icon 44px, icon lọt thỏm giữa ô trắng,
   xấu hơn hẳn. Nên chỗ thừa không cho ai cả — chia đều lên trên xuống dưới.
   Dư ở hai đầu trông như khoảng thở; dồn hết xuống đáy mới trông như trang bị
   cụt.

   Luật này chung cho mọi trạng thái, không riêng lúc ẩn banner: khi chỗ thừa
   bằng 0 (gần như luôn luôn, vì banner và lưới đều flex:1) thì nó không làm
   gì cả. Dưới 430px khung nhìn .app-than thành display:block nên luật cũng tự
   hết tác dụng. */
body.la-app.man-1 .app-than { justify-content: center; }
body.la-app.man-1 .app-muc-luoi .app-luoi-nho {
  flex: 1 1 auto; min-height: 0; grid-auto-rows: 1fr;
}
body.la-app.man-1 .app-o { justify-content: center; }

/* --- Khuyến mãi -----------------------------------------------------------
   Một dòng bấm được, không phải cái thẻ to. Khối này bật/tắt theo mùa; nếu
   nó chiếm nửa màn thì lúc tắt màn hình lại phải bố trí kiểu khác. Giữ nó
   thấp và flex:none là hai bố cục chỉ chênh nhau đúng chiều cao một dòng.

   Nền volt đặc — nó phải nổi hơn lưới việc bên trên, vì nội dung ở đây là
   thứ có hạn, xem muộn là mất. */
body.la-app.man-1 .app-muc-km { flex: none; }
body.la-app.man-1 .app-km {
  display: flex; align-items: center; gap: clamp(8px, 1.3svh, 11px);
  padding: clamp(7px, 1.2svh, 10px) clamp(10px, 1.5svh, 13px);
  border-radius: 13px; text-decoration: none; position: relative;
  color: var(--md-on-primary-container);
  background: linear-gradient(160deg, var(--green-2) 0%, var(--md-primary-container) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 5px 12px -7px rgba(60, 74, 0, .5);
}
body.la-app.man-1 .app-km:active { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6); }
body.la-app.man-1 .app-km-huy {
  flex: none; padding: 3px clamp(6px, .9svh, 8px); border-radius: 999px;
  font: 700 clamp(9px, 1.15svh, 10.5px)/1.3 Roboto, system-ui, sans-serif;
  letter-spacing: .5px; color: var(--lime-nhat); background: var(--forest-2);
}
body.la-app.man-1 .app-km-huy:empty { display: none; }
body.la-app.man-1 .app-km-chu {
  flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px;
}
body.la-app.man-1 .app-km-chu b {
  font: 700 clamp(12px, 1.66svh, 14.5px)/1.25 Roboto, system-ui, sans-serif;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
body.la-app.man-1 .app-km-chu i {
  font: 400 clamp(9.5px, 1.24svh, 11.5px)/1.28 Roboto, system-ui, sans-serif;
  font-style: normal; opacity: .72;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
body.la-app.man-1 .app-km-chu i:empty { display: none; }
/* Mũi tên vẽ bằng hai nét viền xoay 45 độ. Bộ Material Symbols nhúng là bản
   cắt 36 icon, không có mũi tên phải — thêm một cái tên là phải dựng lại
   font. Không đáng cho một hình chữ V. */
body.la-app.man-1 .app-km::after {
  content: ""; flex: none; width: 7px; height: 7px; margin-right: 2px;
  border-right: 2px solid currentColor; border-top: 2px solid currentColor;
  transform: rotate(45deg); opacity: .55;
}
/* --- Dưới 545px khung nhìn: bớt chữ, KHÔNG bớt cỡ chữ ---------------------
   Tới đây clamp đã chạm sàn ở khắp nơi, bóp nữa là chữ nhỏ hơn ngưỡng đọc.
   Còn đúng một cách: bỏ bớt thứ để đọc. Bỏ dòng phụ của banner, bỏ dòng hạn
   của khuyến mãi, cắt tên việc trong lưới còn một dòng. Đổi lại chữ giữ
   nguyên cỡ. */
@media (max-height: 545px) {
  body.la-app.man-1 .app-bang1-phu { display: none; }
  body.la-app.man-1 .app-bang1-chu { max-width: 84%; }
  body.la-app.man-1 .app-km-chu i { display: none; }
  body.la-app.man-1 .app-luoi-nho .app-ten { -webkit-line-clamp: 1; }
  /* Con số trong ô vẫn còn — đó là thứ khách vào đây để xem. Bỏ câu giải
     thích dưới lưới, nó lặp lại điều mà dấu gạch trong "100–150k" đã nói. */
  body.la-app.man-1 .app-luoi-chu { display: none; }
}

/* --- Dưới 430px: bỏ cuộc, trả lại cách cuộn cũ ---------------------------
   Đây là điện thoại xoay ngang. Chiều cao ấy không đủ cho bảng hiệu + thanh
   đáy + một dòng chữ; ép vào một màn là nuốt chữ. Thà cuộn.
   Ngưỡng cũ đặt 620 — hoá ra đó là khung nhìn thật của gần hết máy Android,
   nên cái nấc "bỏ cuộc" này lại là nấc chạy thường xuyên nhất. */
@media (max-height: 430px) {
  body.la-app.man-1 {
    display: block; height: auto; overflow: visible;
    padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  }
  body.la-app.man-1 .app-chan { position: fixed; }
  body.la-app.man-1 .app-bang1 { min-height: 74px; max-height: none; }
  body.la-app.man-1 .app-than { display: block; }
  body.la-app.man-1 .app-than > * + * { margin-top: 6px; }
  body.la-app.man-1 .app-muc-luoi { max-height: none; }
}

/* ==========================================================================
   CỬA HÀNG ONLINE (/cua-hang)
   Chỉ bố cục và khoảng cách. Màu lấy hết từ biến ở đầu tệp, không khai màu
   mới — chế độ Online đổi CHỮ, không đổi bảng màu.
   Tiền tố .la-cua-hang là class trên <main>, không phải trên <body>: khung
   chung ở phan.html phát ra <body> trần, không nơi nào gắn class vào nó.
   ========================================================================== */
/* Cột hẹp. Khung chung rộng 1240px là để xếp lưới nhiều cột; trang cửa hàng
   chỉ có MỘT cột, nên bỏ nguyên bề ngang ấy cho một ô nhập là bắt mắt chạy
   hết màn hình mới đọc lại được dòng vừa gõ. Chặn ở đây, không đụng .khung
   chung: class nằm trên <main> nên đầu trang và chân trang vẫn rộng như cũ. */
.la-cua-hang .khung { max-width: 820px; }

.la-cua-hang .ch-form { margin-top: 26px; }

.la-cua-hang .ch-o {
  margin: 0 0 22px; padding: 20px;
  border: 1px solid var(--vien); border-radius: var(--r-lon);
  background: var(--the);
}
/* Tiêu đề bước nằm HẲN trong thẻ, không cưỡi lên đường viền. Mặc định trình
   duyệt nhấc <legend> lên giữa nét viền trên: đường kẻ đâm ra hai bên chữ,
   dấu tiếng Việt chen với nét viền, cỡ 15px ở đó đọc chật. float:left +
   width:100% là cách duy nhất bắt legend hành xử như một khối thường — display
   block không ăn — và vì nó chiếm trọn bề ngang nên phần nội dung phía sau vẫn
   xuống dòng đúng chỗ. Viền fieldset nhờ vậy khép kín. */
.la-cua-hang .ch-o > legend,
.la-cua-hang .ch-o > h2 {
  margin: 0; padding: 0 0 12px;
  font: 700 16px/1.4 Roboto, system-ui, sans-serif; color: var(--muc);
}
.la-cua-hang .ch-o > legend { float: left; width: 100%; }
/* Legend đang float, mà .ch-mon là flex — flex tạo vùng định dạng riêng nên nó
   KHÔNG chui xuống dưới float, nó co lại nhường chỗ và hàng nút tròn bị đẩy
   dạt ra mép. clear trả mọi khối con về nguyên bề ngang, dưới legend. */
.la-cua-hang .ch-o > * { clear: both; }

.la-cua-hang .ch-mon { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 12px; }
.la-cua-hang .ch-mon label { display: flex; align-items: center; margin: 0; cursor: pointer; }

/* Nút tròn to hơn mặc định và ăn màu thương hiệu. Cỡ mặc định của trình duyệt
   là 13px xám nhạt — trên nền tím nó chìm, khách nhìn cả cột không biết mình
   đang tích cái nào. flex: none để nó không bị bóp khi tên món dài. */
.la-cua-hang .ch-mon input[type=radio],
.la-cua-hang .ch-goi input[type=radio] {
  flex: none; width: 18px; height: 18px; accent-color: var(--th);
}

/* Mỗi việc một thẻ bấm được cả ô, không bắt khách nhắm đúng cái nút tròn. */
.la-cua-hang .ch-goi-ds { display: grid; gap: 10px; margin-top: 14px; }
.la-cua-hang .ch-goi {
  display: flex; align-items: flex-start; gap: 12px; margin: 0;
  padding: 14px 16px;
  border: 1px solid var(--vien-dam); border-radius: var(--r-nho);
  background: var(--nen-2); cursor: pointer;
}
.la-cua-hang .ch-goi:hover { border-color: var(--sang); background: var(--th-nen); }
.la-cua-hang .ch-goi input { margin-top: 2px; }

/* Đã chọn thì CẢ THẺ phải đổi, không chỉ cái chấm tròn. Danh sách này dài
   chục dòng; nếu dấu hiệu duy nhất là chấm 18px thì khách phải rà mắt từ đầu
   xuống mới biết đã tích chưa, và trang xác nhận sẽ là chỗ đầu tiên họ biết
   mình chọn nhầm.
   Viền dày lên bằng box-shadow inset chứ không đổi border-width: đổi width là
   thẻ nhích 1px, cả cột giật khi bấm. */
.la-cua-hang .ch-goi:has(input:checked) {
  border-color: var(--th); background: var(--th-nen);
  box-shadow: inset 0 0 0 1px var(--th);
}
/* Bàn phím: viền focus phải thấy được cả khi thẻ chưa được chọn. */
.la-cua-hang .ch-goi:has(input:focus-visible) { outline: 2px solid var(--sang); outline-offset: 2px; }
.la-cua-hang .ch-goi input:focus-visible { outline: none; }
.la-cua-hang .ch-goi-than { display: grid; gap: 3px; }
.la-cua-hang .ch-goi-ten { font-weight: 600; }
.la-cua-hang .ch-goi-gia { font-size: 14px; color: var(--th); font-weight: 600; }
.la-cua-hang .ch-goi-dk { font-size: 13px; color: var(--muc-mo); }

.la-cua-hang .ch-nhac { margin-top: 14px; font-size: 13.5px; color: var(--muc-mo); }
.la-cua-hang .ch-nhac p { margin: 0 0 6px; }

.la-cua-hang .ch-loi {
  margin: 20px 0 0; padding: 12px 16px;
  border-left: 3px solid var(--tuchoi); border-radius: var(--r-nho);
  background: var(--nen-2); color: var(--muc); font-weight: 500;
}

/* --- Màn kết: mã đơn là thứ khách phải chép tay lên kiện hàng ---------- */
.la-cua-hang .ch-ma {
  margin: 26px 0; padding: 22px;
  border: 2px solid var(--th); border-radius: var(--r-lon);
  background: var(--th-nen); text-align: center;
}
.la-cua-hang .ch-ma-nhan {
  margin: 0; font: 600 12px/1.4 "Roboto Mono", monospace;
  letter-spacing: .12em; text-transform: uppercase; color: var(--muc-mo);
}
.la-cua-hang .ch-ma-so {
  margin: 8px 0 0;
  font: 700 34px/1.15 "Roboto Mono", monospace;
  letter-spacing: .06em; color: var(--muc);
  overflow-wrap: anywhere;
}
