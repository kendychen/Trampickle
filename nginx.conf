server {
    listen 80;
    server_name trampickle.vn www.trampickle.vn;
    root /usr/share/nginx/html;
    index index.html;

    # Static files - cache
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Markdown rendered html
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # sitemap/robots — TRÊN VPS có Go (127.0.0.1:8442) PHẢI proxy để sitemap
    # động (gồm /dich-vu/{ma}, /bai-viet/{slug} với lastmod thật) được ưu tiên.
    # Bản tĩnh trong dist chỉ là fallback khi Go chưa chạy.
    # Xem docs/van-hanh/nginx-trampickle.conf để cấu hình đầy đủ (443, HSTS, www->non-www).
    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }
}
# LƯU Ý PRODUCTION: file này chỉ cho deploy tĩnh (Docker preview).
# Trên VPS production, dùng docs/van-hanh/nginx-trampickle.conf làm canonical:
# - server 80 return 301 https://trampickle.vn$request_uri
# - server 443 cho trampickle.vn + www -> 301 về non-www
# - HSTS, proxy_pass /sitemap.xml và /robots.txt về Go.
