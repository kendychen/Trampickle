server {
    listen 80;
    server_name trampickle.vn www.trampickle.vn;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # Static assets - cache 7d, immutable
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # SEO/AI Search files - short cache, always fresh
    location ~* ^/(sitemap\.xml|robots\.txt|llms\.txt|ai\.txt)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate" always;
        add_header Content-Type $content_type always;
        try_files $uri =404;
    }

    # HTML - no cache stale, allow revalidate + security headers
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # sitemap/robots fallback via Go on VPS is handled by docs/van-hanh/nginx-trampickle.conf proxy.
    # This static image (Docker preview) serves dist/sitemap.xml directly.
}
# LƯU Ý PRODUCTION: file này chỉ cho deploy tĩnh (Docker preview).
# Trên VPS production, dùng docs/van-hanh/nginx-trampickle.conf làm canonical:
# - server 80 return 301 https://trampickle.vn$request_uri
# - server 443 cho trampickle.vn + www -> 301 về non-www
# - HSTS, proxy_pass /sitemap.xml và /robots.txt về Go.
