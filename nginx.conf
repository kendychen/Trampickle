server {
    listen 80;
    server_name trampickle.vn www.trampickle.vn;
    root /usr/share/nginx/html;
    index index.html;

    # SEO: redirect URL viet hoa ve chu thuong (optional - nginx lower via map)
    # Static files - cache
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Markdown rendered html
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # sitemap/robots — bản TĨNH (dist) đã hợp nhất /, /dich-vu, /bai-viet, /quy-trinh ...
    # nên try_files là đủ. TRÊN VPS có Go (127.0.0.1:8442), PHẢI đổi 2 dòng này
    # thành proxy_pass http://127.0.0.1:8442 để sitemap động (gồm /dich-vu/{ma},
    # /bai-viet/{slug} với lastmod thật) được ưu tiên — xem docs/van-hanh/nginx-trampickle.conf.
    location = /sitemap.xml { try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }
}