# nginx cho trampickle.vn. Hai việc quan trọng nhất ở đây:
#   1. real_ip_header CF-Connecting-IP — để $remote_addr là khách thật.
#   2. proxy_set_header X-Real-IP $remote_addr — Go tin header này khi
#      request tới từ loopback (xem core/realip.go).
#
# Đặt vào /etc/nginx/sites-available/trampickle.vn rồi ln -s sang
# sites-enabled. Các dòng ngoài khối server nằm ở tầng http, đúng chỗ.

# Dải Cloudflare — giữ TRÙNG với daiCloudflare trong core/realip.go. Lệch
# nhau thì hoặc nginx tin nhầm, hoặc Go tin nhầm; kiểu gì cũng sai IP.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Giới hạn ở tầng nginx cho /dang-nhap. Lớp trong Go vẫn có (core/khoadangnhap.go),
# đây là lớp ngoài để request xấu không tốn một lần bcrypt cost 12 của tiến
# trình Go. 10 lần/phút: người thật gõ sai vài lần vẫn thoải mái.
limit_req_zone $binary_remote_addr zone=dangnhap:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx < 1.25 không có chỉ thị này — lúc đó đổi hai dòng trên thành
    # "listen 443 ssl http2;" và bỏ dòng dưới. Kiểm bằng: nginx -v
    http2 on;
    server_name trampickle.vn www.trampickle.vn;

    # Chỉ nhận từ Cloudflare. Không có khối này thì ai quét ra IP gốc là bỏ
    # qua toàn bộ WAF và rate limit của Cloudflare — mọi luật bên đó thành
    # trang trí.
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    ssl_certificate     /etc/letsencrypt/live/trampickle.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trampickle.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Khách gửi video quay bằng điện thoại. Go cho tối đa 100MB một yêu cầu
    # (tongYeuCauToiDaByte trong core/server.go); để nginx rộng hơn một chút
    # thì lỗi "quá nặng" hiện ra bằng tiếng Việt trong trang, thay vì bằng
    # trang 413 trần của nginx.
    client_max_body_size 110m;

    # Header bảo mật do Go đặt (core/middleware.go). Không đặt lại ở đây:
    # đặt hai nơi thì lúc sửa dễ quên một chỗ, và CSP có nonce đổi mỗi lượt
    # tải nên nginx không dựng được.

    location /dang-nhap {
        limit_req zone=dangnhap burst=5 nodelay;
        proxy_pass http://127.0.0.1:8442;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8442;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gửi video 100MB qua mạng nhà mất vài phút; mặc định 60s là cắt giữa
        # chừng, khách thấy "lỗi" mà không hiểu vì sao.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name trampickle.vn www.trampickle.vn;

    # BẪY: certbot HTTP-01 gọi thẳng vào IP gốc, KHÔNG qua Cloudflare, nên
    # nó rơi vào "deny all" ở khối 443 sau khi bị chuyển hướng. Chừa đường
    # cho acme trước rồi mới chuyển hướng, không thì lần gia hạn chứng chỉ
    # tới là hỏng — và hỏng lặng lẽ sau 90 ngày.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
